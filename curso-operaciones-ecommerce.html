{id:'3.2',title:'Fill Rate, In Full y OTIF',min:20,
goal:'Calcular Fill Rate, pedidos completos y OTIF, y entender por qué OTIF no es el producto de On Time por In Full.',
body:`<ul><li><b>Fill Rate</b> (por unidades): unidades entregadas / unidades pedidas. Mide cuánto de lo pedido se logró surtir.</li><li><b>In Full %</b>: pedidos entregados completos / pedidos entregados.</li><li><b>OTIF</b> (On Time In Full): pedidos que cumplen <b>ambas</b> condiciones a la vez / pedidos entregados.</li></ul>
<p>Las fuentes coinciden en que OTIF es binario por pedido: si llega tarde o incompleto, falla. Y que solo cuenta la intersección: 96% a tiempo y 95% completos no dan 95,5% de OTIF, porque los fallos pueden estar en pedidos distintos. Algunas empresas miden OTIF por línea de pedido en vez de por pedido completo, lo que da valores más altos; confirma cuál usa la tuya.</p>
<p>Fill Rate puede verse alto incluso cuando muchos clientes recibieron pedidos parciales, porque promedia unidades. Por eso conviene mirar los tres juntos.</p>`,
example:`<p>Un pedido de tres unidades en «Retail Andino» (ficticio) llega a tiempo pero con dos: para Fill Rate aporta 2 de 3; para In Full es un fallo; para OTIF, un fallo. El cliente ya habrá calificado.</p>`,
ex:{type:'calc',lab:{t:'Laboratorio: Fill Rate',fields:[{k:'p',l:'Unidades pedidas',v:21},{k:'e',l:'Unidades entregadas',v:19}],out:[{l:'Fill Rate',u:'%',f:function(v){return 100*v.e/v.p}}]},
intro:'Diez pedidos entregados (datos sintéticos).',cols:['Pedido','Uds pedidas','Uds entregadas','A tiempo'],rows:[['O1',2,2,'Sí'],['O2',1,1,'Sí'],['O3',3,2,'Sí'],['O4',1,1,'No'],['O5',2,2,'No'],['O6',4,4,'Sí'],['O7',2,1,'No'],['O8',1,1,'Sí'],['O9',3,3,'Sí'],['O10',2,2,'Sí']],num:[1,2],
task:'Calcula el Fill Rate por unidades, el % de pedidos completos y el OTIF.',
parts:[{l:'Fill Rate',u:'%',tol:0.1,fn:function(r){var p=0,e=0;r.forEach(function(x){p+=x[1];e+=x[2]});return 100*e/p}},{l:'Pedidos completos',u:'%',tol:0.1,fn:function(r){return 100*r.filter(function(x){return x[1]===x[2]}).length/r.length}},{l:'OTIF',u:'%',tol:0.1,fn:function(r){return 100*r.filter(function(x){return x[1]===x[2]&&x[3]==='Sí'}).length/r.length}}],
sol:function(v){return '<p>Fill Rate = 19/21 = <b>'+fmt(v[0])+'%</b>. Completos: 8 de 10 = <b>'+fmt(v[1])+'%</b>. A tiempo: 7 de 10 = 70%. OTIF: solo O1, O2, O6, O8, O9 y O10 cumplen ambas = <b>'+fmt(v[2])+'%</b>, no 70% × 80% = 56%. Fill Rate se ve mejor porque promedia unidades.</p>'}},
quiz:[
{q:'OTIF cuenta un pedido como éxito cuando…',o:['Llega a tiempo','Llega completo','Llega a tiempo y completo','Se factura'],a:2,w:'Necesita ambas condiciones a la vez.'},
{q:'Fill Rate 96% no garantiza…',o:['Que haya stock','Que los clientes recibieron sus pedidos completos','Nada','Que se facturó'],a:1,w:'Se puede tener alto Fill Rate con muchos pedidos parciales.'},
{q:'OTIF por línea frente a por pedido completo…',o:['Da siempre menor','Suele dar mayor valor y hay que confirmar cuál se usa','Es igual','No existe'],a:1,w:'Cambia la unidad de conteo.'}],
src:[['https://sourceday.com/blog/otif/','SourceDay: OTIF, pedido vs línea'],['https://agilebrandguide.com/wiki/ecommerce/on-time-in-full-otif/','Agile Brand Guide: OTIF (solo cuenta la intersección)'],['https://kaizen.com/insights/otif-supply-chain-indicator/','Kaizen: OTIF, OTD, DIFOT y fill rate']],
ver:['Base de OTIF (entregados o programados) y unidad (pedido o línea): '+V('confirmar con el equipo')]},

{id:'3.3',title:'NPS y satisfacción',min:15,
goal:'Calcular NPS, interpretar promotores, pasivos y detractores, y conocer sus límites.',
body:`<p>El <b>Net Promoter Score</b> se basa en una pregunta: «del 0 al 10, ¿qué tan probable es que nos recomiendes?». Se agrupa así: <b>promotores</b> 9 y 10, <b>pasivos</b> 7 y 8, <b>detractores</b> 0 a 6. La fórmula es <code>NPS = % promotores − % detractores</code>, con rango de −100 a +100. Los pasivos cuentan en el total pero no suman ni restan. Lo desarrolló Fred Reichheld en Bain & Company en 2003.</p>
<p>En e-commerce el NPS suele ser <b>transaccional</b>: una encuesta después de la entrega. Por eso se mueve con On Time, completitud y trato del repartidor. Límites que debes conocer: pocas respuestas dan un valor inestable, quien responde no siempre representa al cliente promedio, y un número sin comentarios no dice qué arreglar.</p>
<p>No hay un NPS «bueno» universal: compáralo con tu propia serie histórica y con tu categoría, no con cifras de internet.</p>`,
example:`<p>«Retail Andino» (ficticio) cruza el NPS con la modalidad: retiro en tienda tiene más promotores que domicilio. Al leer los comentarios de los detractores, la mayoría menciona «llegó fuera de la franja». La causa es de despacho, no de producto.</p>`,
ex:{type:'calc',lab:{t:'Laboratorio: NPS',fields:[{k:'p',l:'Promotores',v:11},{k:'a',l:'Pasivos',v:5},{k:'d',l:'Detractores',v:4}],out:[{l:'NPS',f:function(v){var t=v.p+v.a+v.d;return t?100*(v.p-v.d)/t:0}}]},
intro:'Veinte respuestas (datos sintéticos): 10, 9, 9, 8, 7, 10, 6, 3, 9, 10, 8, 9, 5, 10, 9, 7, 2, 9, 10, 8.',
task:'Calcula % de promotores, % de detractores y el NPS.',
parts:[{l:'% promotores',u:'%',tol:0.1,fn:function(){var s=[10,9,9,8,7,10,6,3,9,10,8,9,5,10,9,7,2,9,10,8];return 100*s.filter(function(x){return x>=9}).length/s.length}},{l:'% detractores',u:'%',tol:0.1,fn:function(){var s=[10,9,9,8,7,10,6,3,9,10,8,9,5,10,9,7,2,9,10,8];return 100*s.filter(function(x){return x<=6}).length/s.length}},{l:'NPS',tol:0.1,fn:function(){var s=[10,9,9,8,7,10,6,3,9,10,8,9,5,10,9,7,2,9,10,8];return 100*(s.filter(function(x){return x>=9}).length-s.filter(function(x){return x<=6}).length)/s.length}}],
sol:function(v){return '<p>Promotores: 11 de 20 = <b>'+fmt(v[0])+'%</b>. Detractores: 4 de 20 = <b>'+fmt(v[1])+'%</b>. NPS = 55 − 20 = <b>'+fmt(v[2])+'</b>. Los 5 pasivos no suman ni restan, pero sí están en el denominador.</p>'}},
quiz:[
{q:'¿Quiénes son detractores?',o:['0 a 6','7 y 8','9 y 10','Solo el 0'],a:0,w:'0 a 6.'},
{q:'¿Los pasivos entran al denominador?',o:['No','Sí, cuentan en el total aunque no sumen ni resten','Solo si son muchos','Depende del día'],a:1,w:'Se calculan porcentajes sobre todas las respuestas.'},
{q:'Con 8 respuestas, ¿qué cuidado tomas?',o:['Ninguno','Cuidado: el valor es muy inestable con tan poca muestra','Doblas el NPS','Lo comparas con internet'],a:1,w:'Un solo cambio mueve mucho el resultado.'}],
src:[['https://www.productplan.com/glossary/net-promoter-score','ProductPlan: fórmula y grupos del NPS'],['https://uschamber.com/co/grow/marketing/net-promoter-score','U.S. Chamber of Commerce: NPS'],['https://1up.ai/net-promoter-score-nps','1up: origen del NPS (Bain, 2003)']],
ver:['Escala, momento de encuesta y objetivos internos de NPS: '+V('definición interna')]},

{id:'3.4',title:'Cálculo en Excel y Power Query',min:20,
goal:'Calcular On Time y cancelaciones con fórmulas y con una consulta de Power Query reutilizable.',
body:`<p>Pega el CSV de «Datos sintéticos» en Excel. Columnas: A id, B fecha, C canal, D vendedor, E tienda, F modalidad, G categoría, H uds, I uds_ent, J monto, K estado, L motivo, M prometida, N entrega.</p>
<h3>Con fórmulas</h3>
<pre><code>Columna O (a_tiempo):
=SI(K2&lt;&gt;"Entregado";"";SI(N2&lt;=M2;1;0))

On Time global:
=SUMA(O:O)/CONTAR.SI(K:K;"Entregado")

Cancelación de una tienda (E2 = tienda):
=CONTAR.SI.CONJUNTO(E:E;"Surco";K:K;"Cancelado")/CONTAR.SI(E:E;"Surco")</code></pre>
<p>Si tu Excel usa comas en vez de punto y coma, cambia el separador. Si las fechas se importan como texto ISO (AAAA-MM-DD), comparan bien igualmente; si las conviertes, hazlo en ambas columnas.</p>
<h3>Con Power Query (reutilizable)</h3>
<pre><code>let
  Origen = Excel.CurrentWorkbook(){[Name="Pedidos"]}[Content],
  Tipos = Table.TransformColumnTypes(Origen,{{"prometida", type date},{"entrega", type date}}),
  OnTime = Table.AddColumn(Tipos, "a_tiempo", each if [estado]="Entregado" and [entrega] &lt;= [prometida] then 1 else 0, Int64.Type),
  Entregados = Table.SelectRows(OnTime, each [estado]="Entregado"),
  PorTienda = Table.Group(Entregados, {"tienda"}, {{"entregados", each Table.RowCount(_), Int64.Type},{"a_tiempo", each List.Sum([a_tiempo]), Int64.Type}}),
  Pct = Table.AddColumn(PorTienda, "pct_on_time", each [a_tiempo]/[entregados], Percentage.Type)
in
  Pct</code></pre>
<p>Ventaja frente a fórmulas: mañana reemplazas el CSV y pulsas <i>Actualizar todo</i>; el reporte diario se recalcula solo. Si sabes macros, una sola macro que actualice y exporte a PDF cierra el ciclo.</p>`,
example:`<p>Tu jefe pide «On Time por tienda de ayer» a las 9:05. Con Power Query cargas el archivo del OMS, actualizas y copias la tabla. Con fórmulas repites pasos manuales cada día y aumenta el riesgo de arrastrar mal una fila.</p>`,
ex:{type:'calc',data:true,task:'Calcula el On Time de Surco y de Chorrillos, y el número de pedidos entregados de Chorrillos.',
parts:[{l:'On Time Surco',u:'%',tol:0.1,fn:function(d){return K.ontime(d.filter(function(r){return r.tienda==='Surco'}))}},{l:'On Time Chorrillos',u:'%',tol:0.1,fn:function(d){return K.ontime(d.filter(function(r){return r.tienda==='Chorrillos'}))}},{l:'Entregados en Chorrillos',tol:0,fn:function(d){return d.filter(function(r){return r.tienda==='Chorrillos'&&r.estado==='Entregado'}).length}}],
sol:function(v){return '<p>Surco <b>'+fmt(v[0])+'%</b>, Chorrillos <b>'+fmt(v[1])+'%</b>, con <b>'+v[2]+'</b> pedidos entregados en Chorrillos. Verifica que tu consulta filtra entregados antes de agrupar; si no, tu On Time baja artificialmente.</p>'}},
quiz:[
{q:'Ventaja principal de Power Query sobre fórmulas manuales:',o:['Es más bonito','El proceso se repite al actualizar la fuente','No necesita datos','Reemplaza al ERP'],a:1,w:'Reproducibilidad y menos pasos manuales.'},
{q:'¿Dónde filtras «Entregado» al calcular On Time?',o:['Nunca','Antes de agrupar o dividir','Después de mostrar','Solo en el gráfico'],a:1,w:'Define el universo del denominador.'},
{q:'Tu Excel pide «;» y no «,». ¿Qué significa?',o:['Está roto','Depende de la configuración regional del sistema','Es otra versión de Excel obligatoria','No importa'],a:1,w:'El separador de argumentos depende de la configuración regional.'}],
src:[],
ver:['Sintaxis de Excel, Power Query (M) y separadores según tu versión y configuración regional: '+V('probar en tu Excel; consultar documentación de Microsoft Learn')]},

{id:'3.5',title:'Cálculo en SQL Server y Power BI',min:20,
goal:'Escribir la misma métrica en T-SQL y en Power BI, y comparar con la de Excel.',
body:`<h3>T-SQL (SQL Server)</h3>
<pre><code>SELECT tienda,
       COUNT(*) AS entregados,
       SUM(CASE WHEN fecha_entrega &lt;= fecha_prometida THEN 1 ELSE 0 END) AS a_tiempo,
       CAST(100.0 * SUM(CASE WHEN fecha_entrega &lt;= fecha_prometida THEN 1 ELSE 0 END)
            / COUNT(*) AS DECIMAL(5,1)) AS pct_on_time
FROM pedidos
WHERE estado = 'Entregado'
GROUP BY tienda;

-- Cancelación por tienda (sobre creados)
SELECT tienda,
       CAST(100.0 * SUM(CASE WHEN estado = 'Cancelado' THEN 1 ELSE 0 END) / COUNT(*) AS DECIMAL(5,1)) AS pct_cancelacion
FROM pedidos
GROUP BY tienda;</code></pre>
<p>Detalle importante: <code>100.0 *</code> fuerza decimales; sin él, la división de enteros en SQL Server trunca el resultado.</p>
<h3>Power BI: dos medidas mínimas</h3>
<p>Primero crea en Power Query una columna <code>a_tiempo</code> (1 o 0) como en el capítulo anterior. Luego, tres medidas cortas:</p>
<pre><code>Entregados = CALCULATE(COUNTROWS(Pedidos), Pedidos[estado] = "Entregado")
A tiempo = CALCULATE(SUM(Pedidos[a_tiempo]), Pedidos[estado] = "Entregado")
% On Time = DIVIDE([A tiempo], [Entregados])</code></pre>
<p>No hace falta más DAX para este nivel. Usa <code>DIVIDE</code> para evitar errores por cero. La misma lógica que viste en Excel y SQL, pero como medida reutilizable en cualquier visual.</p>
<p>Regla de oro: <b>la misma fórmula debe dar el mismo número en las tres herramientas</b>. Si no, hay diferencia de denominador o de filtro.</p>`,
example:`<p>Si tu dashboard de Power BI muestra 88,4% y tu Excel 87,5%, empieza por el denominador: ¿uno incluye cancelados? ¿uno excluye pedidos del último día por corte de extracción? La diferencia casi siempre está ahí.</p>`,
ex:{type:'calc',intro:'Resultado intermedio de una consulta por tienda (datos sintéticos).',cols:['Tienda','Entregados','A tiempo'],rows:[['A',40,36],['B',25,20],['C',35,34]],num:[1,2],
task:'Calcula el On Time de B, el global ponderado y el promedio simple de los tres porcentajes.',
parts:[{l:'On Time B',u:'%',tol:0.1,fn:function(r){return 100*r[1][2]/r[1][1]}},{l:'On Time global',u:'%',tol:0.1,fn:function(r){var e=0,a=0;r.forEach(function(x){e+=x[1];a+=x[2]});return 100*a/e}},{l:'Promedio simple de %',u:'%',tol:0.1,fn:function(r){var s=0;r.forEach(function(x){s+=100*x[2]/x[1]});return s/r.length}}],
sol:function(v){return '<p>B = 20/25 = <b>'+fmt(v[0])+'%</b>. Global = 90/100 = <b>'+fmt(v[1])+'%</b>. El promedio simple de los tres porcentajes da <b>'+fmt(v[2])+'%</b>: es distinto porque no pondera por volumen. En un reporte usa siempre la versión ponderada.</p>'}},
quiz:[
{q:'En SQL Server, sin «100.0 *» en la división de dos enteros…',o:['Da decimales','Trunca a entero','Falla','Da NULL siempre'],a:1,w:'La división entera trunca.'},
{q:'Ventaja de DIVIDE frente a «/» en DAX:',o:['Es más rápido','Maneja la división por cero','Cambia el color','Filtra entregados'],a:1,w:'Devuelve vacío o valor alternativo en lugar de error.'},
{q:'Excel da 87,5% y Power BI 88,4%. Primero revisas…',o:['El color','Denominador y filtros','El logo','La fuente'],a:1,w:'Casi siempre es la definición del universo.'}],
src:[],
ver:['Sintaxis T-SQL y DAX según tu versión de SQL Server y Power BI: '+V('validar en tu entorno; documentación de Microsoft Learn')]},

{id:'3.6',title:'Plantillas: reporte diario y reporte semanal de sellers',min:20,
goal:'Armar un reporte diario que se lee en dos minutos y un reporte semanal de sellers que provoca acciones.',
body:`<h3>Reporte diario (para operaciones)</h3>
<p>Orden sugerido: <b>1)</b> fecha y corte de datos. <b>2)</b> KPIs del día frente a meta y semana anterior: pedidos, On Time, cancelación, Fill Rate. <b>3)</b> Pedidos atorados con antigüedad. <b>4)</b> Cancelaciones por motivo y tienda. <b>5)</b> Stock: quiebres, ajustes y SKU críticos. <b>6)</b> Incidencias principales. <b>7)</b> Acciones y responsables para hoy.</p>
<p>Principio: <b>qué pasó, por qué, qué se hace</b>. Un número sin causa ni acción es decoración.</p>
<h3>Reporte semanal de sellers</h3>
${T(['Columna','Para qué'],[['Seller','Identificación'],['Pedidos','Volumen, para ponderar'],['Despachados a tiempo %','Cumplimiento de SLA de despacho'],['Cancelados por seller %','Fallas de stock o gestión del seller'],['Reclamos y devoluciones %','Calidad de producto y de información'],['Semáforo','Verde, amarillo, rojo según umbrales acordados']])}
<p>Los umbrales del semáforo los fija el negocio con el seller; no inventes cifras de referencia. Cierra el reporte con las tres acciones de la semana: a quién llamas, qué pides y cuándo revisas.</p>`,
example:`<p>El lunes envías a «Moda Rímac» (seller ficticio) su tabla con fechas y pedidos que fallaron, no solo un porcentaje. Un seller reacciona a una lista de pedidos concretos, no a un promedio.</p>`,
ex:{type:'calc',intro:'Semana de cuatro sellers (datos sintéticos).',cols:['Seller','Pedidos','Despachados a tiempo','Cancelados por seller'],rows:[['Tecnoandes',120,108,6],['Moda Rímac',80,60,10],['Hogar Sur',60,57,1],['Belleza Lima',40,38,0]],num:[1,2,3],
task:'Calcula % a tiempo de Moda Rímac, la cancelación global por seller y cuántos sellers quedan por debajo de 90% a tiempo.',
parts:[{l:'% a tiempo Moda Rímac',u:'%',tol:0.1,fn:function(r){return 100*r[1][2]/r[1][1]}},{l:'Cancelación global',u:'%',tol:0.1,fn:function(r){var p=0,c=0;r.forEach(function(x){p+=x[1];c+=x[3]});return 100*c/p}},{l:'Sellers bajo 90%',tol:0,fn:function(r){return r.filter(function(x){return 100*x[2]/x[1]<90}).length}}],
sol:function(v){return '<p>Moda Rímac = <b>'+fmt(v[0])+'%</b>. Cancelación global = 17/300 = <b>'+fmt(v[1])+'%</b>. Bajo 90%: solo Moda Rímac (<b>'+v[2]+'</b>); Tecnoandes está justo en 90,0%, no por debajo. El 90% es un umbral inventado para el ejercicio.</p>'}},
quiz:[
{q:'¿Qué debe tener todo bloque de un reporte diario?',o:['Solo números','Qué pasó, por qué y qué se hace','Solo gráficos','Solo texto'],a:1,w:'Cada bloque lleva causa y acción.'},
{q:'¿Por qué mostrar los pedidos concretos que fallaron a un seller?',o:['Para castigar','Porque actúa sobre casos, no sobre promedios','Por costumbre','No se debe'],a:1,w:'Sin casos no puede investigar.'},
{q:'¿Quién fija los umbrales del semáforo?',o:['Tú, inventándolos','El negocio con el seller, con datos históricos','Nadie','Internet'],a:1,w:'Debe ser un acuerdo, no una cifra suelta.'}],
src:[],
ver:['Formato exacto de reportes: el de tu empresa. Esta plantilla es una propuesta didáctica sin norma.']}

{id:'4.1',title:'SKU, EAN/GTIN y atributos',min:18,
goal:'Distinguir SKU de EAN/GTIN, entender variantes y validar un código GTIN-13.',
body:`<ul><li><b>SKU:</b> código <i>interno</i> de la empresa para una variante vendible (por ejemplo, misma polera en talla M y color negro). Lo define cada retailer o seller.</li><li><b>EAN/GTIN:</b> código <i>global</i> del producto que aparece en el código de barras. EAN-13 es el mismo número que GTIN-13; lo administra GS1. Se compone de prefijo de empresa, referencia de producto y un dígito verificador.</li><li><b>Atributos:</b> marca, modelo, color, talla, peso, dimensiones, descripción e imágenes. Son la base de búsqueda, filtros y del picking correcto.</li><li><b>Variante:</b> producto «padre» con hijos por talla o color, cada uno con su SKU y su EAN.</li></ul>
<p>El dígito verificador del GTIN-13 se calcula con módulo 10: se multiplican los 12 primeros dígitos por pesos alternos 1 y 3 (empezando por 1), se suman, y el dígito es lo que falta para llegar a múltiplo de 10. Sirve para detectar errores de digitación.</p>
<p>Fallas comunes de catálogo: un mismo EAN en dos SKU, un SKU sin EAN, atributos distintos en 1P y en el seller para el mismo producto, o imágenes que no corresponden. Un EAN mal cargado hace que el picker escanee y no lo reconozca.</p>`,
example:`<p>«Retail Andino» (ficticio) recibe de un seller una zapatilla con el EAN de otra talla. El picker escanea, el sistema dice «producto correcto», y el cliente recibe talla equivocada. El reclamo llega como «error de preparación», pero la causa está en el catálogo.</p>`,
ex:{type:'gtin',intro:'Prueba el validador. El primer código es un ejemplo conocido de GTIN-13 válido. El botón simula un error de digitación.',base:'775123456789',task:'Calcula el dígito verificador del código sintético 775123456789.'},
quiz:[
{q:'El SKU es…',o:['Un código global de GS1','Un código interno de la empresa para una variante','El número de RUC','El número del pedido'],a:1,w:'Cada retailer o seller define el suyo.'},
{q:'¿Para qué sirve el dígito verificador del GTIN-13?',o:['Para el precio','Para detectar errores de digitación','Para el IGV','Para la ruta'],a:1,w:'Valida que el código sea coherente.'},
{q:'Dos SKU con el mismo EAN provocan…',o:['Nada','Confusión en escaneo, picking y stock','Descuentos','Más ventas'],a:1,w:'El sistema no distingue el producto correcto.'}],
src:[['https://gs1.se/en/guides/how-to-guides/gtin-13/','GS1 Sweden: guía de GTIN-13'],['https://www.activebarcode.com/codes/ean13','ActiveBarcode: estructura del EAN-13'],['https://www.omnicalculator.com/all/gtin-check-digit','Omni Calculator: dígito verificador GTIN']],
ver:['El prefijo GS1 asignado a Perú (775 según referencia general) y la afiliación GS1 Perú de cada proveedor: '+V('confirmar en GS1 Perú')]},

{id:'4.2',title:'Precios y promociones',min:17,
goal:'Calcular descuento y margen en una promoción y reconocer errores típicos de precio.',
body:`<p>Un producto tiene <b>precio regular</b>, <b>precio promocional</b> y, a veces, precio por canal o por bandera. Las promociones definen vigencia, tope de unidades, canal y condiciones (medio de pago, mínimo de compra).</p>
<pre><code>Descuento % = (Precio regular − Precio promo) / Precio regular
Margen S/  = Precio promo − Costo
Margen %   = Margen S/ / Precio promo</code></pre>
<p>Riesgos frecuentes: precio con un cero de menos, promoción que sigue activa después de su fecha, precio distinto entre web y app, y sellers que cambian precio sin que se refleje en el marketplace. Un error de precio se convierte rápido en una ola de pedidos que luego se cancelan, con daño en NPS y reclamos.</p>
<p>Para el ejercicio se ignoran impuestos por simplicidad. La forma de mostrar precios al consumidor (por ejemplo, incluyendo o no impuestos) tiene reglas propias ${V('norma de información de precios al consumidor')}.</p>`,
example:`<p>Un televisor de «Retail Andino» (ficticio) sale a S/ 100 en vez de S/ 1000 por un cero faltante. En 20 minutos entran cientos de pedidos. La operación tendrá que decidir si cancelar, con impacto en reclamos, o cumplir, con pérdida. Por eso los cambios de precio tienen revisión y alertas de variación.</p>`,
ex:{type:'calc',intro:'Promoción de un producto (datos sintéticos): precio regular S/ 1000, precio promo S/ 850, costo S/ 700. Sin impuestos.',
task:'Calcula el descuento %, el margen en soles y el margen % sobre el precio promo.',
parts:[{l:'Descuento',u:'%',tol:0.1,fn:function(){return 100*(1000-850)/1000}},{l:'Margen',u:'S/',tol:0.01,fn:function(){return 850-700}},{l:'Margen sobre precio promo',u:'%',tol:0.1,fn:function(){return 100*(850-700)/850}}],
sol:function(v){return '<p>Descuento = 150/1000 = <b>'+fmt(v[0])+'%</b>. Margen = 850 − 700 = <b>S/ '+v[1]+'</b>. Margen % = 150/850 = <b>'+fmt(v[2])+'%</b>. Sin promoción el margen era S/ 300 (30% sobre 1000): el descuento de 15% recortó el margen a la mitad. Por eso el descuento no es «solo un porcentaje».</p>'}},
quiz:[
{q:'Un precio 10 veces menor por error de digitación genera…',o:['Nada','Una ola de pedidos y luego cancelaciones o pérdida','Más margen','Mejor NPS'],a:1,w:'Es un riesgo operativo y de reputación.'},
{q:'El margen % de una promoción se calcula sobre…',o:['El costo siempre','El precio promo, según la fórmula del ejercicio','El IGV','El stock'],a:1,w:'Margen S/ dividido por el precio de venta.'},
{q:'Un precio distinto en web y app suele indicar…',o:['Sincronización o regla de precios por canal mal configurada','Nada','Promoción intencional siempre','Error de picking'],a:0,w:'Se revisa configuración y sincronización.'}],
src:[],
ver:['Cómo se debe informar el precio al consumidor (con impuestos, plazos de promoción, etc.): '+V('revisar la norma vigente de Indecopi')]},

{id:'4.3',title:'Sincronización de stock y disponibilidad',min:20,
goal:'Entender de dónde viene el stock que ve el cliente y calcular el riesgo por retraso de sincronización.',
body:`<p>El stock que ve el cliente es una <b>copia</b> del stock real, y toda copia llega con retraso. La cadena típica: tienda o almacén (físico) → ERP o WMS (contable/lógico) → OMS (reservas) → plataforma (publicado). Cada salto agrega latencia.</p>
<h3>Palancas para reducir sobreventa</h3>
<ul><li><b>Sincronización por evento</b> (cada movimiento actualiza) frente a por lote (cada X minutos).</li><li><b>Stock de seguridad</b> en la publicación.</li><li><b>Reservas</b> al confirmar el pedido, no al pagar.</li><li><b>Alertas</b> cuando el picker reporta sin ubicar en un SKU: se corta la publicación de ese SKU en esa tienda hasta contar.</li><li><b>Ajustes con hora</b>: saber a qué hora se corrigió el stock para explicar cancelaciones.</li></ul>
<p>Recuerda la advertencia de VTEX: tras iniciar la atención el seller asume la reserva, y actualizar el inventario antes de facturar puede descartar reservas y crear discrepancias. La regla práctica es sincronizar con orden y trazabilidad, no «lo antes posible».</p>`,
example:`<p>En una campaña, «Retail Andino» (ficticio) vende cientos de unidades en un fin de semana. El POS de la tienda vende en caja a la misma hora. Si la sincronización es por lote cada 30 minutos, hay media hora de sobreventa potencial por SKU popular.</p>`,
ex:{type:'calc',intro:'Ventas de caja que aún no se reflejan online (datos sintéticos).',cols:['SKU','Publicado online','Ventas POS pendientes de sincronizar'],rows:[['X',5,2],['Y',2,3],['Z',10,1],['W',0,0]],num:[1,2],
task:'Calcula cuántas unidades publicadas ya no existen (máximo el publicado de cada SKU) y cuántos SKU tienen riesgo de sobreventa.',
parts:[{l:'Unidades publicadas inexistentes',tol:0,fn:function(r){return r.reduce(function(a,x){return a+Math.min(x[1],x[2])},0)}},{l:'SKU con riesgo',tol:0,fn:function(r){return r.filter(function(x){return x[2]>0}).length}}],
sol:function(v){return '<p>X: 2, Y: mín(2,3)=2, Z: 1, W: 0 = <b>'+v[0]+'</b> unidades. Riesgo en X, Y y Z = <b>'+v[1]+'</b> SKU. Y es el más peligroso: se vendió en caja más de lo que se publicaba, así que todo lo publicado ya es fantasma.</p>'}},
quiz:[
{q:'¿Por qué el stock online siempre llega con retraso?',o:['Por diseño de la plataforma únicamente','Porque cada salto entre sistemas suma latencia','Por el color','Por el IGV'],a:1,w:'Cadena de copias.'},
{q:'¿Qué ayuda a reducir sobreventa en SKU populares?',o:['Sincronización por evento y stock de seguridad','Subir el precio','Quitar imágenes','Cerrar la web'],a:0,w:'Menos retraso y colchón.'},
{q:'Un picker reporta «sin ubicar» en un SKU. Medida operativa razonable:',o:['Seguir vendiendo','Pausar su publicación en esa tienda hasta contar y ajustar','Duplicar el stock','Ignorar'],a:1,w:'Evita más cancelaciones mientras se investiga.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: reservas y actualización de inventario']],
ver:['Frecuencia y mecanismo de sincronización de cada empresa: '+V('preguntar en entrevista')]},

{id:'4.4',title:'Scorecard de sellers y comisiones',min:20,
goal:'Construir un puntaje ponderado de sellers y calcular la liquidación neta con comisión.',
body:`<p>Un <b>scorecard</b> resume en un número el desempeño de un seller. Pasos: elegir métricas, normalizarlas a una escala común (0 a 100), asignar pesos y sumar.</p>
${T(['Métrica (ejemplo)','Peso (ejemplo)'],[['Despacho a tiempo','40%'],['Baja cancelación (100 − cancelación %)','30%'],['Baja tasa de reclamos','20%'],['Calidad de catálogo','10%']],[1])}
<p>Los pesos de la tabla son didácticos. En un marketplace real los define el negocio; lo que importa es que sean <b>explícitos y conocidos por el seller</b>. La <b>comisión</b> es un porcentaje sobre la venta que el marketplace retiene; la <b>liquidación neta</b> es lo que recibe el seller después de descontar comisión y otros conceptos pactados.</p>
<p>Un buen scorecard <b>no reemplaza</b> al detalle: un seller de 92 puntos puede tener un problema serio en un solo SKU. Úsalo para priorizar, no para cerrar la conversación.</p>`,
example:`<p>Comisión: en 2023 Gestión reportó que variaba según rubro (por ejemplo, alrededor de 20% en ropa y 6 a 8% en celulares). Esas cifras eran de esa nota y de esa fecha; para 2026 pide el contrato del marketplace ${V('comisiones vigentes')}.</p>`,
ex:{type:'calc',intro:'Dos sellers (datos y pesos sintéticos): puntajes 0 a 100 en despacho, baja cancelación, reclamos y catálogo. Pesos: 40%, 30%, 20%, 10%.',cols:['Seller','Despacho','Baja cancelación','Reclamos','Catálogo'],rows:[['A',92,95,88,100],['B',75,85,90,70]],num:[1,2,3,4],
task:'Calcula el puntaje de A, el de B y la liquidación neta de B si vendió S/ 20 000 con comisión de 15%.',
parts:[{l:'Puntaje A',tol:0.05,fn:function(r){var x=r[0];return .4*x[1]+.3*x[2]+.2*x[3]+.1*x[4]}},{l:'Puntaje B',tol:0.05,fn:function(r){var x=r[1];return .4*x[1]+.3*x[2]+.2*x[3]+.1*x[4]}},{l:'Liquidación B',u:'S/',tol:0.5,fn:function(){return 20000*(1-0.15)}}],
sol:function(v){return '<p>A = 36,8 + 28,5 + 17,6 + 10 = <b>'+fmt(v[0])+'</b>. B = 30 + 25,5 + 18 + 7 = <b>'+fmt(v[1])+'</b>. Liquidación B = 20 000 × (1 − 0,15) = <b>S/ '+fmt(v[2],0)+'</b>. La diferencia mayor entre A y B está en despacho: ahí va la conversación.</p>'}},
quiz:[
{q:'¿Por qué normalizar métricas a 0-100?',o:['Por estética','Para poder sumarlas con pesos','Por norma legal','Porque Excel lo exige'],a:1,w:'Métricas en escalas distintas no se suman.'},
{q:'Los pesos de un scorecard deben…',o:['Ser secretos','Ser explícitos y conocidos por el seller','Cambiar cada día','Ser iguales siempre'],a:1,w:'Transparencia para que el seller pueda mejorar.'},
{q:'Un scorecard alto…',o:['Garantiza cero problemas','No excluye problemas puntuales en un SKU','Elimina el reclamo','Cambia la comisión sola'],a:1,w:'Resume, pero oculta detalle.'}],
src:[['https://gestion.pe/economia/empresas/marketplace-busca-vendedores-del-extranjero-para-ampliar-catalogo-las-razones-por-que-es-rentable-cyberwow-marketplace-comercio-electronico-falabellacom-ripley-app-tiendamia-mercado-libre-sellers-noticia/','Gestión (2023): comisiones aproximadas en marketplaces peruanos']],
ver:['Pesos y comisión de 15%: inventados para el ejercicio. Comisiones y métricas oficiales de cada marketplace: '+V('según contrato vigente')]},

{id:'4.5',title:'Plataformas vigentes: VTEX, Shopify y otras (2026/2027)',min:20,
goal:'Reconocer las plataformas que verás en ofertas de trabajo, qué documentar de cada una y qué preguntar en entrevista.',
body:`${T(['Plataforma','Lo que documenta o se sabe','Para verificar en 2027'],[
['VTEX','Documenta un OMS con estados de pedido, ventana de cancelación, reservas y flujo con seller externo. Se presenta como plataforma comercial con módulo de marketplace.','Módulos y nombres vigentes, pricing, integraciones locales'],
['Shopify','Documenta ubicaciones de inventario, división de pedidos por ubicación, estados de fulfillment y entrega local o retiro.','Funciones para retail omnicanal y límites en retiro parcial'],
['Adobe Commerce (Magento)','Mencionada en guías de mercado como plataforma potente para catálogos grandes.','Estado del producto, costos, soporte local'],
['Jumpseller y otras para pymes','Una guía de mercado peruana la recomienda por integración con pasarelas locales.','Alcance real, comisiones']])}
<p>Sobre marketplaces en Perú: según Similarweb, en agosto de 2026 los cinco sitios de marketplace más visitados fueron temu.com, falabella.com.pe, ripley.com.pe, mercadolibre.com.pe y plazavea.com.pe (tráfico, no ventas). Es un ranking de visitas; úsalo como contexto, no como cuota de mercado.</p>
<p>Lo más útil para tu perfil: entender los <b>conceptos comunes</b> (estados, reservas, ubicaciones, sellers, promesa) y poder aprender la plataforma concreta en semanas. En la entrevista pregunta qué plataforma y qué OMS usan y cómo se integran con ERP y WMS.</p>`,
example:`<p>Si una oferta pide «experiencia en VTEX» y tu empresa usaba un sistema interno de despacho, puedes traducir: «manejé el flujo de estados, reservas y cancelaciones en un OMS propio; la lógica es la misma que documenta VTEX». Es una respuesta honesta y fuerte.</p>`,
ex:{type:'reveal',intro:'Ejercicio de entrevista.',task:'Escribe 5 preguntas que harías sobre la plataforma y el stack tecnológico de la empresa.',
sol:'<ol><li>¿Qué plataforma e-commerce y qué OMS usan, y cómo se integran con ERP y WMS?</li><li>¿Cómo y cada cuánto se sincroniza el stock a la plataforma?</li><li>¿Cómo manejan reservas, y qué pasa con las ventas por POS?</li><li>¿Qué marketplaces y qué sellers integran, y cómo miden su cumplimiento?</li><li>¿Qué herramientas de reporte usan (Power BI, Looker Studio, Excel) y quién mantiene los datos?</li></ol>'},
quiz:[
{q:'¿Qué valor tiene un ranking de visitas?',o:['Mide ventas','Da contexto de tráfico, no de ventas ni de cuota','Mide margen','Mide NPS'],a:1,w:'Similarweb estima visitas.'},
{q:'Tu empresa no usaba VTEX. ¿Qué dices en la entrevista?',o:['Que no sabes nada','Que dominas los conceptos comunes y aprenderías la plataforma','Que mientes','Nada'],a:1,w:'Los conceptos son transferibles.'},
{q:'¿Qué haces para hablar de 2027 sin inventar?',o:['Adivinas','Verificas en documentación oficial y lo marcas como pendiente','Copias un blog','Ignoras'],a:1,w:'Documentación oficial y fechas.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center'],['https://help.shopify.com/en/manual/locations/managing-orders','Shopify Help: pedidos por ubicación'],['https://shopify.dev/docs/api/storefront/latest/enums/orderfulfillmentstatus','Shopify Developers: estados de fulfillment'],['https://www.lmmarketing.com.pe/blog/mejores-plataformas-ecommerce/','LM Marketing: guía de plataformas ecommerce en Perú (blog comercial)'],['https://www.similarweb.com/es/top-websites/peru/e-commerce-and-shopping/marketplace/','Similarweb: ranking de marketplaces en Perú']],
ver:['Toda comparación de precios, funciones y cuota de mercado de plataformas para 2026/2027: '+V('la guía de LM Marketing es una fuente comercial; confirma en los sitios oficiales')]}
]});
MODS.push({id:'5',title:'5. Cumplimiento en Perú y empleabilidad',short:'SUNAT, Indecopi, datos personales, entrevista, Excel',blurb:'Comprobantes, reclamos y datos personales, y cómo contar tu experiencia y rendir la prueba.',ch:[
{id:'5.1',title:'Comprobantes electrónicos SUNAT en e-commerce',min:20,
goal:'Elegir el documento correcto (factura, boleta, notas, guía de remisión) según la situación del pedido.',
body:`<ul><li><b>Factura electrónica:</b> a empresas con RUC; permite crédito fiscal del IGV.</li><li><b>Boleta de venta electrónica:</b> a consumidor final.</li><li><b>Nota de crédito:</b> reduce o anula una operación ya facturada (devolución, descuento posterior, error). Va ligada al comprobante original.</li><li><b>Nota de débito:</b> aumenta el valor o suma cargos (por ejemplo, un flete no incluido).</li><li><b>Guía de remisión electrónica (GRE):</b> no es comprobante de pago; sustenta el <i>traslado</i> de bienes. SUNAT indica que la factura-guía dejó de sustentar traslado desde el 13.07.2022 y que el código QR es una de las formas de sustentar el traslado.</li></ul>
<p>Los comprobantes electrónicos se emiten y se firman digitalmente; una vez emitido, no se «borra»: se corrige con una nota o, en casos acotados, se anula dentro de un plazo. SUNAT menciona un plazo excepcional de hasta el décimo día hábil para anular o corregir ciertos casos ${V('condiciones exactas del plazo')}. Existen varias vías de emisión (portal de SUNAT, sistema propio, OSE), según el contribuyente.</p>
<p>Qué debes saber como operaciones: cuando cambias o devuelves un producto ya facturado, hay <b>un documento fiscal detrás</b>. Si la tienda hace el cambio pero nadie emite la nota, aparece el descuadre entre ventas, stock y contabilidad.</p>`,
example:`<p>Un cliente de «Retail Andino» (ficticio) recibe una polera en talla equivocada y pide cambio. Operación: recoge la prenda, ingresa la devolución al stock, se emite la nota de crédito por la boleta original y se genera un nuevo pedido con su propio comprobante. Cada movimiento físico tiene su documento.</p>`,
ex:{type:'match',intro:'¿Qué documento corresponde?',opts:['Factura','Boleta','Nota de crédito','Nota de débito','Guía de remisión'],items:[
{t:'Persona natural sin RUC compra un televisor',a:'Boleta'},
{t:'Empresa con RUC compra 10 laptops y quiere crédito fiscal',a:'Factura'},
{t:'Cliente devuelve un producto ya facturado y se le reembolsa',a:'Nota de crédito'},
{t:'Se omitió cobrar un flete y se cobra aparte sobre un comprobante ya emitido',a:'Nota de débito'},
{t:'El almacén traslada mercadería a la tienda de Surco',a:'Guía de remisión'}],
sol:'<p>Correcto. Tema de entrevista: el sistema genera el comprobante automáticamente, pero tú debes saber <b>cuál</b> y <b>cuándo</b> para entender por qué un pedido queda «sin comprobante».</p>'},
quiz:[
{q:'La guía de remisión sirve para…',o:['Cobrar el IGV','Sustentar el traslado de bienes','Emitir reclamos','Reembolsar'],a:1,w:'No es comprobante de pago.'},
{q:'Una devolución de producto ya facturado se documenta con…',o:['Otra factura','Nota de crédito','Guía','Recibo por honorarios'],a:1,w:'Corrige o anula la operación original.'},
{q:'Un comprobante electrónico emitido y firmado…',o:['Se borra libremente','Se corrige o anula por vías y plazos previstos','No se puede tocar jamás','Se cambia por WhatsApp'],a:1,w:'Existen mecanismos formales.'}],
src:[['https://cpe.sunat.gob.pe/informacion_general/obligados_cpe','SUNAT: sujetos obligados a emitir comprobantes electrónicos'],['https://cpe.sunat.gob.pe/node/122','SUNAT: preguntas frecuentes de guía de remisión electrónica'],['https://cpe.sunat.gob.pe/sistema_emision/see_contribuyente','SUNAT: Sistema de Emisión del Contribuyente (plazos excepcionales)'],['https://perugestiona.pe/tramites-sunat/comprobantes-pago-tipos/','Perú Gestiona: tipos de comprobantes (fuente secundaria)']],
ver:['Cuándo emitir factura tras una boleta, y GRE en entregas a domicilio de e-commerce: '+V('confirmar con SUNAT y con el área contable'),'Cambios normativos de SUNAT en 2026 y 2027 (por ejemplo, fechas de obligatoriedad de nuevos sistemas): '+V('portal de SUNAT')]},

{id:'5.2',title:'Libro de Reclamaciones e Indecopi',min:20,
goal:'Distinguir reclamo de queja, conocer el plazo de respuesta y explicar la nueva obligación para plataformas de e-commerce.',
body:`<p>El <b>Libro de Reclamaciones</b> está regulado en el Código de Protección y Defensa del Consumidor (Ley 29571, arts. 150 y 151) y en su reglamento (DS 011-2011-PCM). Un <b>reclamo</b> es una disconformidad con el producto o servicio; una <b>queja</b> es un malestar sobre la atención, sin pedido concreto de solución.</p>
<p><b>Plazo:</b> la Ley 31435 y el DS 101-2022-PCM fijan 15 días hábiles improrrogables para responder, por el canal que indique el consumidor. El reclamo no impide ir al Indecopi ni es requisito previo.</p>
<p><b>Novedad 2025-2026:</b> la Ley 32495, publicada el 11 de noviembre de 2025, incluye a las plataformas digitales de comercio electrónico en la obligación de contar con Libro de Reclamaciones y exige mostrar de forma permanente un enlace visible. Indecopi supervisa. Según el mismo texto legal, el Ejecutivo debía adecuar el reglamento en 30 días calendario. En julio de 2026 se publicó para comentarios un proyecto de decreto supremo que define «plataforma digital de comercio electrónico» y amplía el alcance a redes sociales; el plazo de comentarios vencía el 2 de agosto de 2026. ${V('si el reglamento final ya se aprobó y cuándo entra en vigor')}</p>
<p>Para operaciones: un reclamo de e-commerce casi siempre nace de una incidencia operativa (entrega tardía, producto equivocado, cancelación). Conoce el flujo con el área de atención al cliente: quién responde, con qué evidencia (estado del pedido, fechas, fotos) y en qué plazo.</p>`,
example:`<p>«Retail Andino» (ficticio) recibe un reclamo por entrega tardía. Atención pide a operaciones: fecha de compra, promesa, fecha de entrega, y motivo del retraso. Si el sistema no guarda la promesa vigente en cada estado, la respuesta se vuelve difícil de sostener.</p>`,
ex:{type:'calc',intro:'Un cliente registra un reclamo el lunes 7 de septiembre de 2026. Supón cómputo desde el día hábil siguiente, sábados y domingos no hábiles y sin feriados en el periodo (ejercicio didáctico).',
task:'¿Qué día de septiembre vence el plazo de 15 días hábiles y cuántos días calendario transcurren desde el 7?',
parts:[{l:'Día de septiembre del vencimiento',tol:0,fn:function(){var d=new Date(Date.UTC(2026,8,7)),n=15;while(n>0){d.setUTCDate(d.getUTCDate()+1);var w=d.getUTCDay();if(w!==0&&w!==6)n--}return d.getUTCDate()}},{l:'Días calendario transcurridos',tol:0,fn:function(){var d=new Date(Date.UTC(2026,8,7)),n=15,c=0;while(n>0){d.setUTCDate(d.getUTCDate()+1);c++;var w=d.getUTCDay();if(w!==0&&w!==6)n--}return c}}],
sol:function(v){return '<p>Vence el <b>'+v[0]+' de septiembre de 2026</b> (lunes), <b>'+v[1]+'</b> días calendario después. En Excel: <code>=DIA.LAB(FECHA(2026;9;7);15;feriados)</code>. El cómputo y los feriados aplicables debes confirmarlos con el área legal; el objetivo es que sepas hacer la cuenta.</p>'}},
quiz:[
{q:'Plazo para responder un reclamo:',o:['5 días','15 días hábiles improrrogables','30 días calendario','No hay plazo'],a:1,w:'Establecido por la Ley 31435 y el DS 101-2022-PCM.'},
{q:'La Ley 32495 (Nov 2025) exige a plataformas de e-commerce…',o:['Solo cobrar comisión','Contar con Libro de Reclamaciones y mostrar su enlace de forma visible y permanente','Cerrar redes sociales','Nada'],a:1,w:'Modifica los artículos 150 y 151 del Código.'},
{q:'Un reclamo registrado en el Libro…',o:['Impide acudir a Indecopi','No impide acudir a Indecopi','Reemplaza la denuncia','Se archiva solo'],a:1,w:'No es requisito previo ni excluye otras vías.'}],

{id:'5.3',title:'Protección de datos personales',min:18,
goal:'Reconocer datos personales en tus reportes y aplicar buenas prácticas básicas según la Ley 29733 y su nuevo reglamento.',
body:`<p>La <b>Ley 29733</b> regula el tratamiento de datos personales. Su nuevo reglamento (DS 016-2024-JUS, publicado el 30 de noviembre de 2024) entró en vigor el 31 de marzo de 2025 según la ANPD; algunas fuentes dan el 30 de marzo. La <b>ANPD</b> es la autoridad. Ideas que debes manejar:</p>
<ul><li><b>Consentimiento y finalidad:</b> los datos se usan para lo que el cliente autorizó. El nuevo reglamento refuerza el consentimiento en llamadas publicitarias.</li><li><b>Seguridad:</b> acceso solo a quien lo necesita, y cuidado con exportar y enviar archivos con datos.</li><li><b>Bancos de datos:</b> las empresas deben inscribirlos ante la ANPD ${V('obligaciones vigentes de registro')}.</li><li><b>Incidentes:</b> fuentes secundarias indican notificación a la ANPD en 48 horas ante una brecha ${V('plazo exacto en el DS 016-2024-JUS')}.</li></ul>
<p><b>Práctica del analista:</b> en un reporte operativo casi nunca hace falta el DNI ni el teléfono. Trabaja con número de pedido y agrégalo por tienda, canal y fecha. Si necesitas casos concretos, comparte solo con quien debe actuar. No mandes bases con datos personales por chats personales ni a correos externos.</p>`,
example:`<p>Un Excel de pedidos atorados con nombre, teléfono y dirección se reenvía por WhatsApp a un proveedor de transporte «para agilizar». Aunque la intención sea buena, expone datos de clientes por un canal no autorizado. Alternativa: enviar solo pedido, distrito y estado, y los datos de contacto mediante el sistema autorizado.</p>`,
ex:{type:'match',intro:'En un reporte semanal para gerencia, ¿qué haces con cada campo?',opts:['Quitar o proteger','Mantener'],items:[
{t:'DNI del cliente',a:'Quitar o proteger'},{t:'Teléfono del cliente',a:'Quitar o proteger'},{t:'Dirección exacta de entrega',a:'Quitar o proteger'},{t:'Correo del cliente',a:'Quitar o proteger'},{t:'Distrito de entrega (agregado)',a:'Mantener'},{t:'Estado del pedido',a:'Mantener'},{t:'SKU y monto del pedido',a:'Mantener'}],
sol:'<p>Regla práctica: mínimo necesario. Si la audiencia necesita rastrear un caso concreto, entrega el número de pedido y que atención lo consulte en el sistema.</p>'},
quiz:[
{q:'La autoridad de protección de datos personales en Perú es…',o:['SUNAT','ANPD','Indecopi','SBS'],a:1,w:'Autoridad Nacional de Protección de Datos Personales.'},
{q:'¿Qué datos necesita normalmente un reporte de KPIs?',o:['DNI y teléfono','Datos agregados y número de pedido','Dirección exacta','Tarjeta'],a:1,w:'Principio de minimización.'},
{q:'Enviar una base con datos de clientes por WhatsApp personal es…',o:['Buena práctica','Un riesgo de seguridad y cumplimiento','Obligatorio','Indiferente'],a:1,w:'Canales no autorizados.'}],
src:[['https://www.gob.pe/institucion/anpd/campa%C3%B1as/128319-nuevo-reglamento-de-proteccion-de-datos-personales','ANPD (gob.pe): nuevo Reglamento, vigente desde 31 de marzo de 2025'],['https://www.gob.pe/institucion/minjus/noticias/1137398-nuevo-reglamento-de-proteccion-de-datos-personales-refuerza-el-consentimiento-de-usuarios-para-recibir-llamadas-publicitarias','Minjus (gob.pe): consentimiento en llamadas publicitarias'],['https://iapp.org/news/a/se-publica-el-nuevo-reglamento-de-protecci-n-de-datos-personales-en-per-','IAPP: publicación del nuevo reglamento'],['https://www.altimea.com/blog/nuevo-reglamento-proteccion-datos-peru-ds-016-2024-jus/','Altimea: cambios clave (fuente secundaria)']],
ver:['Fecha de vigencia: la ANPD indica 31 de marzo de 2025; otras fuentes 30 de marzo. '+V('DS 016-2024-JUS'),'Plazo de 48 horas para notificar brechas y montos de sanciones: '+V('texto del reglamento')]},

{id:'5.4',title:'Preguntas de entrevista y cómo contar tu experiencia',min:20,
goal:'Preparar respuestas con estructura para las preguntas típicas del puesto, apoyadas en tu experiencia real.',
body:`<p>Estructura útil para casi toda pregunta de experiencia: <b>Situación → Tarea → Acción → Resultado</b> (STAR). Regla de oro: <b>usa tus cifras reales o di que no las recuerdas con exactitud y cómo las medías</b>. Inventar un número es el error que más te cuesta si te repreguntan.</p>
<p>Tus materiales base: tus reportes diarios de pedidos, el reporte semanal de sellers, el seguimiento de On Time y NPS, el control de stock con ajustes vía almacén de tienda, y el sistema interno de despacho y retiro. Cada uno es una historia potencial.</p>
<p>Recorre las tarjetas de abajo: contesta en voz alta 60 segundos y luego compara con la estructura sugerida.</p>`,
example:`<p>Una respuesta débil: «hacía reportes». Una respuesta fuerte: «armaba cada día el reporte de pedidos y cancelaciones; detectaba las cancelaciones por producto sin ubicar concentradas en unas tiendas; se lo enviaba a operaciones con el motivo y la acción sugerida». Verbo, dato, acción.</p>`,
ex:{type:'flash',intro:'Ocho preguntas típicas. Responde primero, mira después.',cards:[
{q:'Cuéntame de tu experiencia en e-commerce.',a:'<p>Tres frases: <b>dónde</b> (rol y sistema), <b>qué hacías cada semana</b> (reportes diarios y semanales, On Time, NPS, stock) y <b>qué lograste</b> (un ejemplo con tu cifra real). Cierra con lo que buscas ahora.</p>'},
{q:'¿Cómo calculas On Time y qué denominador usas?',a:'<p>Entregados a tiempo sobre entregados, contra la promesa vigente. Aclara que la definición puede variar por empresa y ofrécete a alinearla. Los cancelados no entran al denominador.</p>'},
{q:'El On Time cayó 10 puntos esta semana. ¿Qué haces?',a:'<p>1) Verifico definición y datos. 2) Segmento por tienda, modalidad, categoría y día. 3) Busco concentración. 4) Cruzo con cancelaciones, stock y cambios de proceso o sistema. 5) Propongo hipótesis y cómo confirmarla. 6) Acciones con responsable.</p>'},
{q:'¿Qué es OTIF y por qué no es On Time por In Full?',a:'<p>OTIF cuenta pedidos que cumplen ambas condiciones a la vez; los fallos de tiempo y de completitud pueden estar en pedidos distintos, por eso el producto de los dos porcentajes no coincide.</p>'},
{q:'Explica sobreventa y cómo la reducirías.',a:'<p>Definición breve, causas (POS, ajustes tardíos, stock fantasma, picos), y medidas: sincronización, stock de seguridad, pausar SKU con sin ubicar reiterado, conteos cíclicos y trazabilidad de ajustes.</p>'},
{q:'¿Cómo armas un reporte semanal de sellers?',a:'<p>Columnas: seller, pedidos, despacho a tiempo, cancelación por seller, reclamos y devoluciones. Semáforo con umbrales acordados. Cierro con acciones, casos concretos y responsables.</p>'},
{q:'El dato de Excel no coincide con el de Power BI. ¿Qué haces?',a:'<p>Comparo definición, denominador, filtros, corte de fecha y duplicados. Reproduzco el cálculo paso a paso en ambos y documento la diferencia.</p>'},
{q:'Cuéntame un error tuyo y qué aprendiste.',a:'<p>Elige un error real y acotado. Cuenta qué pasó, cómo lo detectaste, qué corregiste y qué cambio de proceso o control dejaste (por ejemplo, una validación).</p>'}]},
quiz:[
{q:'Si no recuerdas una cifra exacta de tu trabajo anterior, ¿qué haces?',o:['La inventas','Das un rango y explicas cómo la medías','Cambias de tema','Mientes'],a:1,w:'Honestidad y método.'},
{q:'En STAR, la «R» es…',o:['Riesgo','Resultado','Rol','Regla'],a:1,w:'Resultado medible.'},
{q:'Una respuesta fuerte incluye…',o:['Solo adjetivos','Verbo, dato y acción','Solo el nombre de la empresa','Solo el sistema'],a:1,w:'Concreta y verificable.'}],
src:[],
ver:['Este capítulo es método de práctica, sin fuente normativa. Adapta las respuestas a tus cifras reales.']},

{id:'5.5',title:'Prueba de Excel para el puesto (cronometrada)',min:20,
goal:'Practicar el tipo de tareas que suelen pedir en una prueba de Excel para operaciones e-commerce, con reloj.',
body:`<p>Las pruebas varían, pero para este puesto suelen pedir: buscar datos entre tablas (<code>BUSCARV</code> o <code>BUSCARX</code>), sumar y contar con condiciones (<code>SUMAR.SI.CONJUNTO</code>, <code>CONTAR.SI.CONJUNTO</code>), <code>SI</code> y <code>SI.ERROR</code>, fechas (<code>DIAS.LAB</code>, <code>DIA.LAB</code>), tablas dinámicas, formato condicional y limpieza de datos con Power Query ${V('confirmar con la convocatoria de cada empresa')}.</p>
<p>Pega el CSV en Excel (botón «Datos sintéticos»), inicia el cronómetro de 30 minutos y resuelve las seis preguntas. Después compara con la solución. Practica hacerlo <b>sin mirar apuntes</b> al menos una vez.</p>`,
example:`<p>Un consejo práctico: antes de fórmulas, convierte el rango en <b>Tabla</b> (Ctrl+T) y ponle nombre. Las referencias estructuradas evitan errores al ampliar datos, y en una prueba te ahorran minutos.</p>`,
ex:{type:'calc',data:true,timer:1800,task:'Resuelve con el CSV en Excel.',
parts:[
{l:'1. Monto total de pedidos entregados',u:'S/',tol:0.5,fn:function(d){return d.filter(function(r){return r.estado==='Entregado'}).reduce(function(a,r){return a+r.monto},0)}},
{l:'2. Cancelaciones por «Pago rechazado»',tol:0,fn:function(d){return d.filter(function(r){return r.motivo==='Pago rechazado'}).length}},
{l:'3. Ticket promedio de Tecnología entregados',u:'S/',tol:0.5,fn:function(d){return K.ticket(d.filter(function(r){return r.categoria==='Tecnología'}))}},
{l:'4. On Time de «Mismo día»',u:'%',tol:0.1,fn:function(d){return K.ontime(d.filter(function(r){return r.modalidad==='Mismo día'}))}},
{l:'5. Lead time medio de Domicilio',u:'días',tol:0.05,fn:function(d){return K.leadDays(d.filter(function(r){return r.modalidad==='Domicilio'}))}},
{l:'6. Entregados con 2 o más días de retraso',tol:0,fn:function(d){return d.filter(function(r){return r.estado==='Entregado'&&(new Date(r.entrega)-new Date(r.prometida))/864e5>=2}).length}}],
sol:function(v){return '<ol><li><b>S/ '+fmt(v[0],0)+'</b>: <code>=SUMAR.SI(K:K;"Entregado";J:J)</code></li><li><b>'+v[1]+'</b>: <code>=CONTAR.SI(L:L;"Pago rechazado")</code></li><li><b>S/ '+fmt(v[2])+'</b>: <code>=PROMEDIO.SI.CONJUNTO(J:J;K:K;"Entregado";G:G;"Tecnología")</code></li><li><b>'+fmt(v[3])+'%</b>: columna auxiliar de a_tiempo y luego <code>=SUMAR.SI.CONJUNTO(O:O;F:F;"Mismo día")/CONTAR.SI.CONJUNTO(F:F;"Mismo día";K:K;"Entregado")</code></li><li><b>'+fmt(v[4],2)+' días</b>: columna auxiliar <code>=SI(K2="Entregado";N2-B2;"")</code> y <code>=PROMEDIO.SI(F:F;"Domicilio";P:P)</code></li><li><b>'+v[5]+'</b>: auxiliar <code>=SI(K2="Entregado";N2-M2;"")</code> y <code>=CONTAR.SI(Q:Q;">=2")</code></li></ol><p class="small">Si tu Excel usa comas, sustituye los puntos y coma. Si las fechas se importaron como texto, conviértelas primero.</p>'}},
quiz:[
{q:'¿Por qué convertir el rango en Tabla (Ctrl+T)?',o:['Por estética','Para usar referencias estructuradas que se amplían solas','Para bloquear la hoja','Para ocultar columnas'],a:1,w:'Reduce errores al ampliar datos.'},
{q:'Para contar filas con dos condiciones usas…',o:['CONTAR.SI.CONJUNTO','SUMA','MAX','ALEATORIO'],a:0,w:'Acepta varios criterios.'},
{q:'BUSCARX frente a BUSCARV:',o:['Solo busca a la derecha','Busca en cualquier dirección y no depende del número de columna','Es más lento','No existe'],a:1,w:'Más flexible; verifica que tu versión de Excel lo incluya.'}],
src:[],
ver:['Funciones disponibles según tu versión de Excel (por ejemplo, BUSCARX). '+V('probar en tu Excel')]}
]});

MODS.push({id:'C',title:'Caso final del curso base',short:'On Time y cancelaciones por stock desalineado',blurb:'Un reporte completo con datos sintéticos, de la exploración a la recomendación.',ch:[
{id:'caso',title:'On Time y cancelaciones por stock desalineado',min:75,
goal:'Producir un reporte para operaciones: qué pasó con el On Time y las cancelaciones, dónde se concentra, qué causa es probable y qué acciones tomar.',
body:`<p><b>Situación.</b> Eres analista en «Retail Andino» (ficticio). Operaciones nota que el On Time bajó y las cancelaciones subieron en septiembre. Tienes 320 pedidos del 1 al 14 de septiembre de 2026 (datos sintéticos). Tu jefe pide un reporte que explique qué pasó y qué hacer.</p>
<h3>Ruta de análisis sugerida</h3>
<ol><li><b>Define</b> On Time (sobre entregados) y cancelación (sobre creados) y escríbelo en el reporte.</li><li><b>Tendencia por día</b>: ¿hay un punto de quiebre?</li><li><b>Cortes</b>: tienda, categoría, modalidad y canal.</li><li><b>Concentración</b>: ¿pocas celdas explican la mayoría de cancelaciones?</li><li><b>Hipótesis</b>: qué la explicaría y cómo la confirmarías.</li><li><b>Acciones</b> con responsable y fecha.</li></ol>
<p>Cómo lo harías en cada herramienta: en <b>Power Query</b>, la consulta del capítulo 3.4 más un grupo por tienda, categoría y período. En <b>SQL Server</b>, el <code>GROUP BY</code> del 3.5 con <code>CASE WHEN fecha &gt;= '2026-09-08'</code>. En <b>Power BI</b>, las medidas del 3.5 con segmentadores de tienda, categoría y fecha.</p>
<p><b>Ojo:</b> encontrarás más de un hallazgo. No todos tienen la misma causa ni la misma urgencia. Distingue lo que ves en los datos de lo que solo es una hipótesis.</p>`,
ex:{type:'case',data:true,intro:'Explora los datos con los filtros. Cambia el período a «8 al 14 de septiembre» y compara. Luego responde las preguntas.',
task:'Preguntas del caso (calcúlalas tú con el CSV y compara).',
parts:[
{l:'On Time global',u:'%',tol:0.1,fn:function(d){return K.ontime(d)}},
{l:'Cancelación global',u:'%',tol:0.1,fn:function(d){return K.cancelPct(d)}},
{l:'On Time Surco, 1 al 7 sep',u:'%',tol:0.1,fn:function(d){return K.ontime(d.filter(function(r){return r.tienda==='Surco'&&r.fecha<'2026-09-08'}))}},
{l:'On Time Surco, 8 al 14 sep',u:'%',tol:0.1,fn:function(d){return K.ontime(d.filter(function(r){return r.tienda==='Surco'&&r.fecha>='2026-09-08'}))}},
{l:'Cancelación Surco Tecnología, 8 al 14 sep',u:'%',tol:0.1,fn:function(d){return K.cancelPct(d.filter(function(r){return r.tienda==='Surco'&&r.categoria==='Tecnología'&&r.fecha>='2026-09-08'}))}},
{l:'Cancelaciones por stock (sin ubicar o sobreventa) en Surco Tecnología desde el 8 sep',tol:0,fn:function(d){return d.filter(function(r){return r.tienda==='Surco'&&r.categoria==='Tecnología'&&r.fecha>='2026-09-08'&&r.estado==='Cancelado'&&(r.motivo==='Producto sin ubicar'||r.motivo==='Sobreventa')}).length}},
{l:'Esas cancelaciones sobre el total de cancelaciones',u:'%',tol:0.1,fn:function(d){var t=d.filter(function(r){return r.estado==='Cancelado'}).length;var s=d.filter(function(r){return r.tienda==='Surco'&&r.categoria==='Tecnología'&&r.fecha>='2026-09-08'&&r.estado==='Cancelado'&&(r.motivo==='Producto sin ubicar'||r.motivo==='Sobreventa')}).length;return 100*s/t}},
{l:'On Time del resto (todo menos Surco desde el 8 sep)',u:'%',tol:0.1,fn:function(d){return K.ontime(d.filter(function(r){return !(r.tienda==='Surco'&&r.fecha>='2026-09-08')}))}}],
sol:function(v){return '<p>On Time global <b>'+fmt(v[0])+'%</b>, cancelación <b>'+fmt(v[1])+'%</b>. Surco pasó de <b>'+fmt(v[2])+'%</b> a <b>'+fmt(v[3])+'%</b> de On Time tras el 8 de septiembre, mientras el resto de la operación se mantiene en <b>'+fmt(v[7])+'%</b>. En Surco Tecnología, la cancelación llega a <b>'+fmt(v[4])+'%</b>, y las cancelaciones por stock allí ('+v[5]+') son el <b>'+fmt(v[6])+'%</b> de todas las cancelaciones del período.'+(Math.abs(v[4]-v[6])<0.05?' Ojo: los dos porcentajes coinciden por casualidad (ambos son 7 de 16), pero miden universos distintos: uno sobre pedidos de esa celda y el otro sobre todas las cancelaciones.':'')+'</p>'},
template:'1. Resumen (2 líneas)\n\n\n2. Hallazgos (3 cifras con su denominador)\n\n\n3. Causa probable y cómo la confirmarías\n\n\n4. Acciones (qué, quién, cuándo)\n\n\n5. Riesgos si no se actúa\n\n\n6. Próximo reporte y datos que necesito\n',
model:function(){
  var d=DATA,ot=K.ontime(d),ca=K.cancelPct(d);
  var sp=d.filter(function(r){return r.tienda==='Surco'&&r.fecha<'2026-09-08'}),sq=d.filter(function(r){return r.tienda==='Surco'&&r.fecha>='2026-09-08'});
  var zt=sq.filter(function(r){return r.categoria==='Tecnología'});
  var stock=function(r){return r.estado==='Cancelado'&&(r.motivo==='Producto sin ubicar'||r.motivo==='Sobreventa')};
  var totC=d.filter(function(r){return r.estado==='Cancelado'}).length,zs=zt.filter(stock).length;
  var resto=d.filter(function(r){return !(r.tienda==='Surco'&&r.fecha>='2026-09-08')});
  var sell=d.filter(function(r){return r.tienda==='Seller'});
  return '<h3>Reporte modelo</h3><p class="small">Definiciones: On Time = entregados hasta la fecha prometida / entregados; cancelación = cancelados / creados. Datos sintéticos del 1 al 14 de septiembre de 2026.</p>'
  +'<p><b>1. Resumen.</b> El On Time global es '+fmt(ot)+'% y la cancelación '+fmt(ca)+'%. El deterioro se concentra en la tienda Surco desde el 8 de septiembre, sobre todo en Tecnología.</p>'
  +'<p><b>2. Hallazgos.</b></p><ul><li>Surco pasó de '+fmt(K.ontime(sp))+'% de On Time (1 al 7) a '+fmt(K.ontime(sq))+'% (8 al 14). El resto de la operación está en '+fmt(K.ontime(resto))+'%.</li><li>Surco Tecnología, 8 al 14: cancelación de '+fmt(K.cancelPct(zt))+'% ('+zt.filter(function(r){return r.estado==='Cancelado'}).length+' de '+zt.length+' pedidos).</li><li>Cancelaciones por stock (sin ubicar o sobreventa) en esa celda: '+zs+', el '+fmt(100*zs/totC)+'% de todas las cancelaciones del período.</li><li>Aparte, los pedidos de sellers (3P) tienen On Time de '+fmt(K.ontime(sell))+'%: es otro problema que merece su propio seguimiento.</li></ul>'
  +'<p><b>3. Causa probable.</b> Compatible con stock desalineado en Surco Tecnología (ajuste o recepción no reflejados, o ventas de caja no sincronizadas). Es una hipótesis: los datos muestran dónde y desde cuándo, no por qué. Confirmación: conteo físico de los SKU más cancelados y revisión de la hora de los ajustes y de las ventas de POS.</p>'
  +'<p><b>4. Acciones.</b> Hoy: pausar publicación de los SKU con más cancelaciones en Surco hasta contar (responsable: inventarios). En 48 h: conteo cíclico y ajuste con hora registrada (tienda y almacén). Esta semana: revisar sincronización POS a plataforma y stock de seguridad de Tecnología.</p>'
  +'<p><b>5. Riesgos.</b> Si sigue: más cancelaciones por stock, caída del NPS y reclamos con plazo de 15 días hábiles. En campañas, el efecto se multiplica.</p>'
  +'<p><b>6. Próximo reporte.</b> Repetir cortes por tienda y categoría en 7 días, más histórico de ajustes con fecha y hora para validar la causa.</p>';
}},
quiz:null,
src:[['https://sourceday.com/blog/otif/','SourceDay: OTIF'],['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: reservas e inventario']],
ver:['Todos los datos de este caso son sintéticos. Ninguna cifra corresponde a una empresa real.']}
]});
var AREAS=['Operaciones / tienda','Inventario','Logística / transporte','Servicio al cliente','Finanzas','E-commerce / catálogo','TI / sistemas','Comercial / compras','Proveedor o seller'];
MODS.push({id:'6',title:'6. Gestión operativa e-commerce',short:'Incidencias, excepciones, escalamiento, mesa de control y casos',blurb:'Ya conoces los conceptos: aquí operas. Clasifica, prioriza, escala y resuelve con casos y un simulador de 20 incidencias.',ch:[
{id:'6.1',title:'El ciclo de una incidencia, de punta a punta',min:20,
goal:'Recorrer las etapas de una incidencia (detectar, clasificar, priorizar, asignar, resolver, comunicar, cerrar y analizar) y aplicarlas a un caso.',
body:`<p>Una incidencia (capítulo 2.4) no termina cuando alguien la «arregla». Una gestión ordenada recorre estas etapas:</p>
${T(['Etapa','Qué haces','Qué registras'],[
['1 Detectar','Alguien o algo la nota: picker, cliente, alerta, reporte','Cómo y cuándo se detectó'],
['2 Registrar','La anotas una sola vez, completa','Pedido, SKU, tienda, hora, descripción'],
['3 Clasificar','Le asignas un tipo (stock, picking, logística, cliente, sistema, pago, catálogo…)','Tipo'],
['4 Severidad y prioridad','Decides cuánto daño hace y qué atender primero','Severidad, prioridad'],
['5 Asignar','Responsable y plazo (SLA de resolución)','Responsable, fecha límite'],
['6 Investigar','Buscas la causa, no solo el síntoma','Evidencia y hallazgos'],
['7 Resolver','Corriges el caso concreto','Acción tomada'],
['8 Comunicar','Avisas a quien corresponda, incluido el cliente','Mensaje y hora'],
['9 Cerrar','Con causa raíz y sin pendientes','Causa raíz, fecha de cierre'],
['10 Analizar recurrencia','¿Se repite en el mismo SKU, tienda o turno?','Etiquetas para reportes']])}
<p><b>Severidad</b> es cuánto daño causa (a clientes, ventas, cumplimiento). <b>Prioridad</b> es el orden en que la atiendes: combina severidad con urgencia (cuánto tiempo queda). Una incidencia de severidad media puede ser la primera si su plazo vence en una hora.</p>
<p>El <b>SLA de resolución</b> es el tiempo objetivo para resolver según la severidad. Los tiempos los define cada empresa; los del ejercicio son inventados ${V('SLA de resolución de tu empresa')}. Lo que separa a un buen operador de uno regular casi siempre es el paso 9: cerrar con causa raíz, porque de ahí sale el análisis del capítulo 6.2 y de tu reporte semanal.</p>`,
example:`<p>En «Retail Andino» (ficticio), la incidencia «producto no encontrado» del pedido PED-10231 se registra con SKU, tienda y stock del sistema. Si se cierra con la causa «stock desalineado por recepción sin ingresar», tres semanas después alguien puede ver que ese SKU acumula seis casos y corregir la raíz.</p>`,
ex:{type:'scenario',intro:'Caso guiado. Decide en cada paso y lee el razonamiento.',cases:[{t:'Producto no encontrado en picking',sit:'<p>Son las 14:10. En la tienda Surco, el pedido <b>PED-10231</b> (1 televisor, campaña Cyber) no se encuentra en su ubicación. El sistema muestra 2 unidades. El SLA del pedido vence en 1 hora.</p>',steps:[
{q:'¿Cuál es tu primera acción?',o:[{t:'Cancelar el pedido de inmediato para no incumplir el SLA',p:0,f:'Cancelar es el último recurso: todavía no sabes si el producto existe.'},{t:'Registrar la incidencia con pedido, SKU, tienda y stock del sistema, y avisar al responsable de tienda',p:2,f:'Registrar primero deja evidencia y permite que otros ayuden.'},{t:'Avisar al cliente que su pedido se retrasa',p:1,f:'Puede ser necesario más tarde, pero sin registro ni datos aún no sabes qué decirle.'}]},
{q:'¿Cómo la clasificas?',o:[{t:'Stock (sistema y físico no coinciden)',p:2,f:'El picking es donde se detecta, pero la causa probable es de stock.'},{t:'Logística',p:0,f:'Todavía no hay problema de transporte.'},{t:'Picking, porque el picker no lo encontró',p:1,f:'Válido como síntoma, pero clasificar por causa probable ayuda más al análisis.'}]},
{q:'¿Qué severidad y prioridad le das?',o:[{t:'Alta: el SLA vence en una hora y es un pedido de campaña',p:2,f:'Combina daño posible con poco tiempo restante.'},{t:'Baja: es un solo pedido',p:0,f:'Un pedido de campaña con una hora de margen no es de baja prioridad.'},{t:'Media: se ve después del almuerzo',p:1,f:'La urgencia no depende del horario de almuerzo.'}]},
{q:'Antes de cancelar, ¿qué haces?',o:[{t:'Búsqueda ampliada acotada y conteo puntual; si no aparece, evaluar reasignar a otra tienda o sustituir según las reglas',p:2,f:'Es el orden correcto: buscar, confirmar, reasignar o sustituir y solo al final cancelar.'},{t:'Esperar a que el turno siguiente lo busque',p:0,f:'Con una hora de SLA, esperar es perder el pedido.'},{t:'Marcarlo como entregado y resolverlo después',p:0,f:'Falsear un estado rompe la confianza en los reportes.'}]},
{q:'¿Cómo cierras?',o:[{t:'Registrar la causa raíz (por ejemplo, stock desalineado), ajustar el inventario, comunicar la nueva promesa o cancelación y cerrar',p:2,f:'Un cierre completo alimenta el análisis de recurrencia.'},{t:'Cerrar sin causa para ganar tiempo',p:0,f:'Sin causa no hay análisis: el problema volverá.'},{t:'Avisar al cliente solo si reclama',p:0,f:'Comunicar proactivamente evita reclamos.'}]}],
cierre:'<p><b>Resumen del razonamiento:</b> registrar, clasificar por causa probable, priorizar por daño y tiempo, agotar alternativas (buscar, reasignar, sustituir), comunicar y cerrar con causa raíz. Ese es el hilo del módulo entero.</p>'}]},
quiz:[
{q:'Severidad y prioridad…',o:['Son lo mismo','Son distintas: severidad es el daño y prioridad es el orden de atención','La prioridad no depende del tiempo','La severidad solo la define el cliente'],a:1,w:'La prioridad combina severidad y urgencia.'},
{q:'¿Por qué es clave cerrar una incidencia con causa raíz?',o:['Por formalidad','Porque permite detectar recurrencias y actuar sobre el origen','Para que aparezca cerrada','Para reducir el aging'],a:1,w:'Sin causa, el análisis posterior no es posible.'},
{q:'¿Qué haces antes de cancelar por producto sin ubicar?',o:['Cancelar de inmediato','Buscar, confirmar, reasignar o sustituir según reglas','Esperar al día siguiente','Cambiar el estado a entregado'],a:1,w:'La cancelación es el último recurso.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: estados del pedido y cancelación']],
ver:['El ciclo de etapas es práctica general de gestión de incidencias, sin norma. Los SLA de resolución y las categorías de tipo los define cada empresa.','Caso y cifras ficticios.']},

{id:'6.2',title:'Catálogo de excepciones: 24 situaciones que sí ocurren',min:20,
goal:'Analizar 24 excepciones frecuentes con el mismo esquema: causa probable, impacto, qué investigar, responsable, KPI y acción.',
body:`<p>Una excepción es cualquier caso que sale del flujo normal (pedido, picking, despacho, entrega). Cada una se analiza igual: <b>causa probable → impacto → qué investigar → responsable → KPI afectado → acción inmediata</b>. Ese esquema es el que un entrevistador espera cuando pregunta «¿qué harías si…?».</p>
<p>Usa el catálogo de dos formas. Primero, en <b>modo práctica</b>: lee solo el título, piensa tu respuesta en voz alta y revela cada campo. Después, filtra por categoría y repasa las que fallaste. Recuerda que en cada empresa las áreas se llaman distinto y el responsable puede variar: lo que importa es el razonamiento.</p>
<p>Cuidado con dos errores frecuentes: tratar el síntoma como causa (cancelar porque «no hay stock», sin preguntar por qué el sistema decía que sí había) y no dejar registrado el motivo, lo que impide ver patrones después.</p>`,
example:`<p>«Retail Andino» (ficticio) nota que «producto no encontrado» aparece siempre en Surco y en Tecnología. Al revisar la excepción con el esquema de arriba, el equipo pasa de «cancelar el pedido» a «revisar recepciones y ajustes de ese SKU». Es el hilo del caso final del curso base.</p>`,
