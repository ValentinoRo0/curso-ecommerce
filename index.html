<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operaciones E-commerce Retail Perú — curso de 2 semanas</title>
<meta name="theme-color" content="#0E5C63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curso E-commerce">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script>window.__PWA=1</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F5F4;--surface:#FFFFFF;--ink:#15262E;--ink2:#4A5C65;--line:#D3DCDE;--brand:#0E5C63;--brand2:#E3EFF0;
  --onbrand:#FFFFFF;--tape:#F2C500;--ok:#1B7A4B;--okbg:#E2F3EA;--bad:#B3261E;--badbg:#FBE7E5;--code:#EAF0F1;
  --shadow:0 1px 0 rgba(21,38,46,.06);
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D;--surface:#16252C;--ink:#E5EDEF;--ink2:#9DB0B7;--line:#2A3C44;--brand:#5CC2C8;--brand2:#173238;
    --onbrand:#0E181D;--ok:#55C990;--okbg:#153426;--bad:#FF8F86;--badbg:#3B1D1B;--code:#0E181D;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D;--surface:#16252C;--ink:#E5EDEF;--ink2:#9DB0B7;--line:#2A3C44;--brand:#5CC2C8;--brand2:#173238;
  --onbrand:#0E181D;--ok:#55C990;--okbg:#153426;--bad:#FF8F86;--badbg:#3B1D1B;--code:#0E181D;--shadow:none;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--fb);-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .brand{font:800 18px var(--fd);letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.top .grow{flex:1}
.pbar{width:min(220px,28vw);height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .4s}
.top small{color:var(--ink2);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);color:var(--onbrand);border-color:var(--brand);font-weight:600}
.btn.sm{padding:3px 9px;font-size:14px}
#menu{display:none}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:calc(100vh - 53px)}
nav#nav{padding:18px 14px 40px 18px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;position:sticky;top:calc(53px + env(safe-area-inset-top,0px));height:calc(100vh - 53px - env(safe-area-inset-top,0px))}
nav a{text-decoration:none;color:inherit}
.homelink{display:block;font-weight:600;margin-bottom:14px}
.stop{margin-bottom:14px}
.mtitle{display:flex;align-items:center;gap:10px;font:700 15px/1.25 var(--fd);margin-bottom:4px}
.mtitle small{margin-left:auto;font:400 12px var(--fb);color:var(--ink2)}
.node{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink2);background:var(--surface);display:inline-block}
.node.m{width:16px;height:16px;border-width:3px;border-color:var(--brand)}
.node.done{background:var(--brand);border-color:var(--brand)}
nav ul{list-style:none;margin:0 0 0 7px;padding:0 0 0 17px;border-left:3px solid var(--line)}
nav li a{display:flex;align-items:flex-start;gap:9px;padding:5px 6px 5px 3px;margin-left:-26px;border-radius:8px;font-size:14px;line-height:1.35;color:var(--ink2)}
nav li a .node{margin-top:3px;margin-left:-0px}
nav li a span:nth-child(2){flex:1}
nav li a em{font-style:normal;font-size:12px;white-space:nowrap;padding-top:1px}
nav li a:hover{background:var(--brand2)}
nav li.on a{background:var(--brand2);color:var(--ink);font-weight:600}
nav li.on .node{border-color:var(--brand);box-shadow:0 0 0 3px var(--tape)}
nav li.done .node{background:var(--brand);border-color:var(--brand)}
main{padding:32px clamp(16px,4vw,56px) 80px;min-width:0}
.wrap{max-width:820px;margin:0 auto}
.crumb{color:var(--ink2);margin:0 0 6px;font-size:14px}
.chap h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;margin-bottom:6px}
.meta{color:var(--ink2);margin:0 0 20px;font-size:14px}
.goal{border-left:5px solid var(--brand);background:var(--brand2);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:22px}
.chap h2{font-size:22px;margin:34px 0 12px;letter-spacing:-.01em}
.chap h3{font-size:17px;margin:18px 0 6px}
.body p,.body li{max-width:70ch}
.body ul,.body ol{padding-left:22px}
.body li{margin:4px 0}
.pe{margin:22px 0;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--tape);border-radius:0 10px 10px 0}
.pe h3{margin-top:0}
mark.ver{background:var(--tape);color:#15262E;padding:0 6px;border-radius:3px;font-size:.86em;font-weight:600;background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.09) 6px 9px)}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:13.5px/1.5 ui-monospace,Consolas,Menlo,monospace}
pre{background:var(--code);border:1px solid var(--line);padding:12px 14px;border-radius:8px;overflow-x:auto;font:13px/1.5 ui-monospace,Consolas,Menlo,monospace;margin:10px 0}
pre code{background:none;padding:0;font:inherit}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--brand2);font-weight:600}
tr:last-child td{border-bottom:0}
.body td,.body th{white-space:normal;min-width:110px;vertical-align:top}
td.n,th.n{text-align:right}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.ex p{margin:6px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
input[type=text],input[type=number],select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=number],input[type=text]{width:130px}
textarea{width:100%;min-height:150px;resize:vertical}
.fb{margin:6px 0;font-size:14.5px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.sol{margin-top:10px;padding:10px 14px;background:var(--okbg);border-radius:8px}
.sol[hidden]{display:none}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q p{margin:0 0 8px;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:8px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.opt:hover:not([disabled]){border-color:var(--brand)}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{font-size:14.5px;color:var(--ink2);margin:6px 0 0}
.src ul{padding-left:20px;margin:6px 0}
.src li{margin:3px 0;font-size:14.5px;overflow-wrap:anywhere}
.pager{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;align-items:center}
.pager .grow{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tab{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:14px}
.tab.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.tabp{padding:12px 14px;background:var(--brand2);border-radius:8px;min-height:64px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:12px 0}
.kpi{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.kpi b{display:block;font:800 26px var(--fd);letter-spacing:-.02em}
.kpi span{font-size:13px;color:var(--ink2)}
.bars{display:grid;grid-template-columns:minmax(90px,150px) 1fr 58px;gap:5px 10px;align-items:center;font-size:14px;margin:8px 0}
.bar{height:14px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.red{background:var(--bad)}
.lab{border:1px dashed var(--ink2);border-radius:10px;padding:10px 14px;margin:12px 0}
.lab h3{margin:0 0 6px}
.flash{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--bg);min-height:120px;margin:8px 0}
.timer{font:800 28px var(--fd);letter-spacing:.02em}
.hero{padding:6px 0 10px}
.hero h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.03em;font-weight:800;max-width:15ch}
.hero p.lead{font-size:19px;max-width:56ch;color:var(--ink2);margin:14px 0 20px}
.route{list-style:none;margin:30px 0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);position:relative;counter-reset:s}
.route::before{content:"";position:absolute;left:0;right:0;top:14px;height:4px;background:var(--line)}
.route li{position:relative;padding-top:38px;padding-right:10px;font-size:14px;line-height:1.3}
.route li::before{content:"";position:absolute;top:6px;left:0;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--brand)}
.route li.done::before{background:var(--brand)}
.route li b{display:block;font:700 15px var(--fd)}
.route li span{color:var(--ink2)}
.route li.here::after{content:"";position:absolute;top:-14px;left:-3px;width:26px;height:22px;background:var(--tape);border:3px solid var(--ink);border-radius:3px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:14px 0}
.mcard{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);padding:14px 16px;border-radius:12px}
.mcard:hover{border-color:var(--brand)}
.mcard h3{font-size:18px;margin-bottom:4px}
.mcard p{margin:0;color:var(--ink2);font-size:14.5px}
.plan td:first-child{font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--surface);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.small{font-size:13.5px;color:var(--ink2)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav#nav{position:fixed;left:0;top:calc(53px + env(safe-area-inset-top,0px));bottom:0;width:min(340px,88vw);height:auto;z-index:30;transform:translateX(-102%);transition:transform .25s}
  nav#nav.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  #menu{display:inline-block}
  .route{grid-template-columns:1fr;gap:14px;margin-left:8px}
  .route::before{left:9px;right:auto;top:0;bottom:0;width:4px;height:auto}
  .route li{padding:0 0 0 38px}
  .route li::before{top:0}
  .route li.here::after{top:-2px;left:-34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

.route.r3{grid-template-columns:repeat(3,1fr)}
.navsep{margin:18px 0 8px;padding-top:12px;border-top:2px solid var(--tape);font:700 14px var(--fd);color:var(--ink)}
.fstep{border:1px solid var(--line);border-left:6px solid var(--brand);border-radius:8px;background:var(--surface)}
.fstep.k-trigger{border-left-color:var(--tape)}
.fstep.k-cond,.fstep.k-loop,.fstep.k-ctrl{border-left-color:var(--ink2)}
.fstep.k-end{border-left-color:var(--ok)}
.fhead{width:100%;text-align:left;background:none;border:0;padding:9px 12px;display:flex;gap:12px;align-items:baseline}
.fkind{font-size:13px;color:var(--ink2);min-width:82px}
.fdet{padding:0 14px 12px 106px;font-size:14.5px}
.fdet[hidden]{display:none}
.farrow{height:14px;margin-left:26px;border-left:2px solid var(--line)}
.checks{display:grid;gap:6px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chk input{margin-top:5px}
.wire{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.wire div{border:2px dashed var(--ink2);border-radius:8px;padding:10px;font-size:13.5px;min-height:56px;background:var(--bg)}
.wire .w2{grid-column:span 2}.wire .w4{grid-column:span 4}
@media (max-width:900px){.route.r3{grid-template-columns:1fr}.fdet{padding-left:14px}.wire{grid-template-columns:repeat(2,1fr)}.wire .w4{grid-column:span 2}}

.route.r2{grid-template-columns:repeat(2,1fr)}.route.r4{grid-template-columns:repeat(4,1fr)}
.bbar,#scrim,.navclose{display:none}
.lg{display:inline}.sm{display:none}
.idea{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:8px 0}
.idea summary{cursor:pointer;padding:10px 12px;list-style:none}
.idea summary::-webkit-details-marker{display:none}
.idea summary::before{content:"+";display:inline-block;width:18px;font-weight:700;color:var(--brand)}
.idea[open] summary::before{content:"−"}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0 18px}
.chip{font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--brand2);color:var(--ink2)}
.chip.warn{background:var(--tape);color:#15262E}
.ibody{padding:0 14px 10px 30px;font-size:14.5px}
.ibody p{margin:6px 0}.ibody ol{margin:4px 0;padding-left:20px}
@media (max-width:900px){
  html{-webkit-text-size-adjust:100%}
  .top{gap:8px;padding:8px 12px}
  .top .brand{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
  #ptxt{display:none}.pbar{width:64px}
  #menu{display:none!important}
  .lg{display:none}.sm{display:inline}
  .btn{min-height:44px;padding:8px 14px;touch-action:manipulation}
  .top .btn{min-height:40px;padding:6px 10px}
  .bbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:22;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
  .bbar .btn{flex:1;display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
  .bbar .btn.pri{color:var(--onbrand)}
  .bbar [hidden]{display:none}
  #scrim{display:block;position:fixed;inset:0;background:rgba(10,20,25,.5);z-index:25}
  #scrim[hidden]{display:none}
  nav#nav{z-index:30;padding-bottom:110px}
  .navclose{display:block;margin-bottom:12px}
  nav li a{padding:10px 6px 10px 3px;font-size:15px}
  main{padding:20px 14px calc(96px + env(safe-area-inset-bottom,0px))}
  .pager .pn{display:none}
  #donebtn{width:100%;min-height:48px}
  .opt{padding:12px 14px}
  .tab{min-height:40px;padding:8px 14px}
  .row{gap:8px}
  .row label{flex:1 1 46%;display:flex;flex-direction:column;gap:4px}
  input[type=text],input[type=number],select{width:100%;min-height:44px}
  select{flex:1 1 46%}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .bars{grid-template-columns:minmax(72px,110px) 1fr 46px;font-size:13.5px}
  .tw{-webkit-overflow-scrolling:touch}
  table{font-size:13px}th,td{padding:5px 8px}
  .body td,.body th{min-width:96px}
  pre{font-size:12px}
  .overlay{padding:6px}.modal{max-height:94vh;padding:16px}
  .hero h1{font-size:34px}.hero p.lead{font-size:17px}
  .chap h1{font-size:28px}
  .fhead{flex-wrap:wrap;gap:4px}.fkind{min-width:0}
  .pe{padding:12px 14px;border-left-width:6px}
  textarea{min-height:120px}
  .route.r2,.route.r3,.route.r4{grid-template-columns:1fr}
  .ibody{padding-left:14px}
}
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="menu" aria-label="Abrir el mapa del curso">Mapa</button>
  <a class="brand" href="#/home">Operaciones E-commerce Perú</a>
  <span class="grow"></span>
  <small id="ptxt"></small>
  <div class="pbar" aria-hidden="true"><i id="pfill"></i></div>
  <button class="btn sm" id="dbtn"><span class="lg">Datos sintéticos</span><span class="sm">Datos</span></button>
  <button class="btn sm" id="tbtn" aria-label="Cambiar tema claro u oscuro"><span class="lg">Tema</span><span class="sm">Tema</span></button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Mapa del curso"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<div class="bbar" id="bbar"><a class="btn" id="bprev" href="#/home">‹ Anterior</a><button class="btn" id="bmap">Mapa</button><a class="btn pri" id="bnext" href="#/home">Siguiente ›</a></div>
<div id="scrim" hidden></div>
<div class="overlay" id="ov" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<script>
function V(t){return '<mark class="ver">verificar'+(t?': '+t:'')+'</mark>'}
function T(cols,rows,num){return '<div class="tw"><table><thead><tr>'+cols.map(function(c,i){return '<th'+(num&&num.indexOf(i)>-1?' class="n"':'')+'>'+c+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(num&&num.indexOf(i)>-1?' class="n"':'')+'>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
var MODS=[];
</script>
<script>
/* ===== Dataset sintético (retailer ficticio "Retail Andino") ===== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function isoAdd(iso,n){var d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
var DATA=(function(){
  var R=mulberry32(20260919);
  function pick(arr,w){var s=0,i;for(i=0;i<w.length;i++)s+=w[i];var t=R()*s;for(i=0;i<arr.length;i++){t-=w[i];if(t<0)return arr[i]}return arr[arr.length-1]}
  var days=[];for(var i=0;i<14;i++)days.push(isoAdd('2026-09-01',i));
  var dw=days.map(function(d){return (d==='2026-09-12'||d==='2026-09-13')?2.2:1});
  var tiendas=['Surco','San Miguel','Los Olivos','Chorrillos'];
  var cats=['Tecnología','Hogar','Moda','Belleza'];
  var price={'Tecnología':[180,1600],'Hogar':[60,420],'Moda':[40,260],'Belleza':[25,190]};
  var sellers={'Tecnología':'Tecnoandes','Hogar':'Hogar Sur','Moda':'Moda Rímac','Belleza':'Belleza Lima'};
  var sla={'Domicilio':2,'Retiro en tienda':1,'Mismo día':0};
  var rows=[];
  for(var n=0;n<320;n++){
    var fecha=pick(days,dw);
    var canal=pick(['Web','App','Marketplace'],[.53,.32,.15]);
    var mp=canal==='Marketplace';
    var tienda=mp?'Seller':pick(tiendas,[.32,.24,.2,.24]);
    var cat=pick(cats,tienda==='Surco'?[.46,.2,.2,.14]:[.3,.25,.28,.17]);
    var mod=pick(['Domicilio','Retiro en tienda','Mismo día'],mp?[.9,.0,.1]:[.55,.32,.13]);
    var uds=pick([1,2,3],[.62,.28,.10]);
    var p=price[cat];var monto=Math.round((p[0]+R()*(p[1]-p[0]))*uds);
    var zona=(!mp&&tienda==='Surco'&&fecha>='2026-09-08');
    var zonaTec=zona&&cat==='Tecnología';
    var cancel=R()<(zonaTec?0.5:0.04);
    var estado=cancel?'Cancelado':'Entregado';
    var motivo='';
    if(cancel){
      if(zonaTec&&R()<0.88)motivo=pick(['Producto sin ubicar','Sobreventa'],[.62,.38]);
      else motivo=pick(['Cliente desiste','Pago rechazado','Dirección/cobertura','Producto sin ubicar'],[.42,.24,.24,.10]);
    }
    var prom=isoAdd(fecha,sla[mod]);
    var ent='',ue=0;
    if(!cancel){
      var pl=mp?0.12:0.07;
      if(zona)pl=(mod==='Domicilio')?0.32:0.20;
      var late=R()<pl;
      var delay=late?(mod==='Mismo día'?1:pick([1,2],[.65,.35])):0;
      ent=isoAdd(prom,delay);
      var pp=zona?0.22:0.03;
      ue=(uds>1&&R()<pp)?uds-1:uds;
    }
    rows.push({fecha:fecha,canal:canal,vendedor:mp?sellers[cat]:'Retail Andino 1P',tienda:tienda,modalidad:mod,categoria:cat,uds:uds,uds_ent:ue,monto:monto,estado:estado,motivo:motivo,prometida:prom,entrega:ent});
  }
  rows.sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0});
  rows.forEach(function(r,i){r.id='RA-'+(100001+i);});
  return rows;
})();
var CSV_COLS=['id','fecha','canal','vendedor','tienda','modalidad','categoria','uds','uds_ent','monto','estado','motivo','prometida','entrega'];
function toCSV(rows){return [CSV_COLS.join(',')].concat(rows.map(function(r){return CSV_COLS.map(function(c){return r[c]}).join(',')})).join('\n')}
var K={
  ent:function(rs){return rs.filter(function(r){return r.estado==='Entregado'})},
  can:function(rs){return rs.filter(function(r){return r.estado==='Cancelado'})},
  ontime:function(rs){var e=K.ent(rs);return e.length?100*e.filter(function(r){return r.entrega<=r.prometida}).length/e.length:0},
  cancelPct:function(rs){return rs.length?100*K.can(rs).length/rs.length:0},
  fill:function(rs){var p=0,e=0;rs.forEach(function(r){p+=r.uds;e+=r.uds_ent});return p?100*e/p:0},
  otif:function(rs){var e=K.ent(rs);return e.length?100*e.filter(function(r){return r.entrega<=r.prometida&&r.uds_ent===r.uds}).length/e.length:0},
  by:function(rs,key){var m={};rs.forEach(function(r){(m[r[key]]=m[r[key]]||[]).push(r)});return m},
  leadDays:function(rs){var e=K.ent(rs);if(!e.length)return 0;var s=0;e.forEach(function(r){s+=(new Date(r.entrega)-new Date(r.fecha))/864e5});return s/e.length},
  ticket:function(rs){var e=K.ent(rs);if(!e.length)return 0;var s=0;e.forEach(function(r){s+=r.monto});return s/e.length}
};
function r1(x){return Math.round(x*10)/10}
function fmt(x,d){d=(d==null?1:d);var p=Math.pow(10,d);return (Math.round(x*p)/p).toString().replace('.',',')}
/* helpers estadísticos (equivalentes a PROMEDIO, MEDIANA, PERCENTIL.INC, DESVEST.M) */
function sortedNums(a){return a.slice().sort(function(x,y){return x-y})}
function mean(a){var s=0;a.forEach(function(x){s+=x});return a.length?s/a.length:0}
function pctl(a,p){var s=sortedNums(a),n=s.length;if(!n)return 0;var r=p*(n-1),i=Math.floor(r),f=r-i;return i+1<n?s[i]+f*(s[i+1]-s[i]):s[i]}
function median(a){return pctl(a,0.5)}
function sdS(a){var n=a.length;if(n<2)return 0;var m=mean(a),s=0;a.forEach(function(x){s+=(x-m)*(x-m)});return Math.sqrt(s/(n-1))}
/* pronósticos simples */
function maFc(a,k){var f=[];for(var i=0;i<a.length;i++)f.push(i>=k?mean(a.slice(i-k,i)):null);return {f:f,next:mean(a.slice(a.length-k))}}
function sesFc(a,al){var f=[null],l=a[0];for(var i=1;i<a.length;i++){f.push(l);l=al*a[i]+(1-al)*l}return {f:f,next:l}}
function fcErr(a,f){var n=0,ae=0,b=0,ap=0,nb=0;for(var i=0;i<a.length;i++){if(f[i]==null)continue;n++;ae+=Math.abs(a[i]-f[i]);b+=a[i]-f[i];if(a[i]!==0){ap+=Math.abs(a[i]-f[i])/a[i];nb++}}return {n:n,mae:n?ae/n:NaN,bias:n?b/n:NaN,mape:nb?100*ap/nb:NaN}}
MODS.push({id:'1',title:'1. Mapa del e-commerce retail',short:'Sistemas, flujo, entregas, canales, sellers',blurb:'Qué hace cada sistema, cómo viaja un pedido y quién hace qué en 1P y 3P.',ch:[
{id:'1.1',title:'Los siete sistemas y qué hace cada uno',min:18,
goal:'Ubicar plataforma, OMS, WMS, ERP, TMS, POS y CRM en un mismo mapa y saber a cuál preguntarle según el problema.',
body:`<p>Un pedido online toca varios sistemas. Casi todos los problemas operativos nacen en la <b>frontera</b> entre dos de ellos: el stock que ve el cliente no coincide con el de la tienda, o un estado no baja del OMS al despacho.</p>
${T(['Sistema','Qué resuelve','Dato que manda'],[
['Plataforma e-commerce','Vitrina, carrito, checkout, catálogo y precios visibles','Precio, promoción, stock mostrado'],
['OMS (gestión de pedidos)','Recibe el pedido, lo asigna a una tienda o almacén, reserva inventario y controla estados y cancelaciones','Estado del pedido'],
['WMS (gestión de almacén)','Ubicaciones, picking, packing, recepción e inventario físico','Ubicación y stock físico'],
['ERP','Compras, finanzas, inventario contable, maestro de productos, facturación','Costo, stock contable'],
['TMS (transporte)','Rutas, transportistas, tracking y costo de despacho','Ruta y estado de entrega'],
['POS','Caja de la tienda física; vende y descuenta stock de tienda','Ventas de tienda'],
['CRM','Cliente, historial, campañas y atención (incluye reclamos)','Ficha del cliente']])}
<p>En la práctica los límites se mezclan: muchas empresas resuelven OMS y TMS en un solo sistema interno, y las tiendas hacen de mini almacén. Por eso, lo primero que haces en un trabajo nuevo es dibujar <i>tu</i> mapa: qué sistema es la fuente de verdad de cada dato.</p>
<p>VTEX, por ejemplo, documenta el OMS como el módulo donde vive el flujo de estados del pedido (pago, ventana de cancelación, ready for handling, facturado). Es una buena referencia para hablar en entrevista aunque tu empresa use otro nombre.</p>`,
example:`<p>Un cliente de Chorrillos compra un televisor en la app de «Retail Andino» (retailer ficticio). La <b>plataforma</b> cobra. El <b>OMS</b> elige la tienda de Surco y reserva la unidad. El <b>WMS</b> o el sistema de tienda guía el picking. Cuando el <b>ERP</b> emite la factura o boleta, el <b>TMS</b> asigna ruta. Si a las 6 pm el <b>POS</b> de la tienda vende esa misma unidad, el OMS y la plataforma se enteran tarde: ahí nace una sobreventa.</p>`,
ex:{type:'match',intro:'Elige el sistema principal para cada situación.',opts:['Plataforma','OMS','WMS','ERP','TMS','POS','CRM'],items:[
{t:'El cliente ve el precio promocional y paga con tarjeta',a:'Plataforma'},
{t:'Decide que el pedido sale de la tienda Surco y reserva la unidad',a:'OMS'},
{t:'Indica al picker el pasillo y la ubicación del SKU',a:'WMS'},
{t:'Registra la compra al proveedor y el costo del producto',a:'ERP'},
{t:'Asigna la ruta y el transportista y da el tracking',a:'TMS'},
{t:'El cajero vende la última unidad en tienda',a:'POS'},
{t:'Guarda el reclamo y el historial de contactos del cliente',a:'CRM'}],
sol:'<p>Bien. Fíjate en el POS: es el único que puede <b>quitar stock por fuera del canal online</b>, y por eso es fuente clásica de desalineación.</p>'},
quiz:[
{q:'El pedido figura «Entregado» para el cliente pero el stock del SKU no bajó en el almacén. ¿Dónde empiezas a revisar?',o:['En el CRM','En la integración entre OMS/despacho y WMS o ERP','En el precio de la plataforma','En el TMS'],a:1,w:'Un dato que no viaja entre sistemas es un problema de integración, no del sistema individual.'},
{q:'¿Qué sistema suele ser la fuente de verdad del estado de un pedido online?',o:['POS','ERP contable','OMS','CRM'],a:2,w:'El OMS orquesta el ciclo de vida del pedido.'},
{q:'Tu empresa usa un sistema interno de despacho. ¿Qué haces primero?',o:['Asumir que es un TMS','Mapear qué funciones cubre (OMS, TMS, ambas) y qué datos son fuente de verdad','Pedir que lo cambien','Ignorarlo'],a:1,w:'Los nombres cambian entre empresas; las funciones no.'}],
src:[['https://help.vtex.com/en/tutorial/order-flow-on-the-oms','VTEX Help Center: order flow on the OMS'],['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: order flow and status']],
ver:['Las definiciones de WMS, TMS, ERP, POS y CRM son de práctica general de la industria, sin cita normativa; compáralas con la arquitectura real de cada empleador.']},

{id:'1.2',title:'Del clic a la puerta: flujo pedido-a-entrega',min:20,
goal:'Recorrer las etapas del pedido, saber qué sistema y qué KPI mira cada una, y dónde suelen atorarse.',
body:`<p>El flujo estándar tiene ocho paradas. Recórrelas en la caja de abajo y mira qué cambia entre etapas.</p>
<p>VTEX documenta estados como <code>Payment pending</code>, <code>Payment approved</code>, <code>Cancellation window</code>, <code>Ready for handling</code>, <code>Verifying invoice</code> e <code>Invoiced</code>, con <code>Canceling</code> y <code>Canceled</code> como salida. Dos detalles útiles: el pedido queda en <i>Ready for handling</i> hasta que el vendedor confirma que empezó a atenderlo, y al confirmar asume la responsabilidad de reservar los ítems.</p>
<p>Tu sistema interno tendrá otros nombres. Ejercicio mental de entrevista: traduce cada estado tuyo a este flujo.</p>`,
example:`<p>Pedido de «Retail Andino» a las 15:40 con entrega mismo día. Si el corte de mismo día es 16:00 y el pago se aprueba a las 16:05, el pedido ya no entra al corte y pasa a entrega del día siguiente. El cliente verá «mañana», y en tu reporte de On Time cuenta contra la promesa que se le mostró, no contra la hora de compra.</p>`,
ex:{type:'tabs',intro:'Toca cada etapa.',items:[
{t:'1 Compra',d:'<b>Sistema:</b> plataforma. <b>Qué pasa:</b> el cliente elige modalidad y franja. <b>Se atora:</b> stock mostrado que no existe. <b>KPI:</b> conversión, pedidos creados.'},
{t:'2 Pago',d:'<b>Sistema:</b> plataforma y pasarela. <b>Estados:</b> payment pending, payment approved. <b>Se atora:</b> pago rechazado o en revisión antifraude. <b>KPI:</b> cancelación por pago.'},
{t:'3 Ventana de cancelación',d:'<b>Sistema:</b> OMS. El cliente puede cancelar sin aprobación de la tienda durante un periodo configurado. <b>KPI:</b> cancelaciones tempranas.'},
{t:'4 Asignación y reserva',d:'<b>Sistema:</b> OMS. Elige tienda o almacén y reserva. <b>Se atora:</b> asignación a tienda sin stock físico. <b>KPI:</b> reasignaciones.'},
{t:'5 Picking y packing',d:'<b>Sistema:</b> WMS o app de tienda. <b>Se atora:</b> producto sin ubicar, sustitutos, falta de personal. <b>KPI:</b> tiempo de picking, fill rate.'},
{t:'6 Facturación',d:'<b>Sistema:</b> ERP/OMS. Se genera el comprobante y el pedido pasa a facturado. <b>Se atora:</b> error de datos del cliente (RUC, DNI). <b>KPI:</b> pedidos sin comprobante.'},
{t:'7 Despacho o retiro',d:'<b>Sistema:</b> TMS o módulo de despacho. Ruta, transportista, o aviso «listo para retiro». <b>Se atora:</b> capacidad de franja, direcciones. <b>KPI:</b> On Time.'},
{t:'8 Entrega y postventa',d:'<b>Sistema:</b> TMS, CRM. Prueba de entrega, encuesta NPS, cambios y devoluciones. <b>KPI:</b> NPS, tasa de devolución.'}],
task:'Un pedido lleva 6 horas en «Ready for handling». Lista tus 4 primeras verificaciones en orden.',
sol:'<ol><li>¿La tienda o el almacén confirmó el inicio de atención? En VTEX el pedido no avanza hasta esa confirmación.</li><li>¿La integración OMS-tienda está viva o hubo un error de sincronización?</li><li>¿La tienda asignada tiene el stock físico y personal en turno?</li><li>¿Es un problema aislado o hay decenas de pedidos igual? Si son muchos, escala como incidente.</li></ol>'},
quiz:[
{q:'En el flujo de VTEX, ¿cuándo puede el cliente cancelar sin que la tienda lo apruebe?',o:['Después de facturado','Durante la ventana de cancelación','Nunca','Solo con reclamo'],a:1,w:'Después de la ventana la tienda debe autorizar la cancelación, según la documentación de VTEX.'},
{q:'¿En qué etapa aparece típicamente un «producto sin ubicar»?',o:['Compra','Pago','Picking y packing','Postventa'],a:2,w:'El picker no lo encuentra aunque el sistema diga que hay stock.'},
{q:'Un pedido con corte a las 16:00 se paga a las 16:05. Contra qué promesa mides On Time?',o:['La hora de compra','La promesa vigente mostrada al cliente','La que prefiera la tienda','No se mide'],a:1,w:'La promesa es la fecha o franja confirmada al cliente.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: order flow and status'],['https://newhelp.vtex.com/docs/tracks/order-flow','VTEX Help Center: order flow (track)']],
ver:['Los nombres y el orden exacto de estados de tu sistema (por ejemplo el sistema interno de despacho) pueden diferir de VTEX. '+V('mapear estados propios')]},

{id:'1.3',title:'Despacho a domicilio, retiro en tienda y mismo día',min:18,
goal:'Distinguir las tres modalidades, entender corte y capacidad por franja, y calcular sobreventa de franjas.',
body:`<ul><li><b>Despacho a domicilio:</b> sale de tienda o centro de distribución con promesa de fecha y a veces franja horaria.</li><li><b>Retiro en tienda (click and collect):</b> el cliente recoge; el hito clave es «pedido listo para retiro» y el plazo máximo de espera. No hay TMS de por medio.</li><li><b>Mismo día (express):</b> promesa en horas. Depende de un <b>corte horario</b>, del radio de cobertura y de que la tienda tenga stock y picker disponibles.</li></ul>
<p>La <b>capacidad por franja</b> es cuántos pedidos puede atender la operación en una ventana. Si el OMS o la plataforma vende más pedidos que la capacidad, algunos llegarán tarde aunque no falle nadie. Es un problema de planificación, no de ejecución.</p>
<p>Shopify documenta algo parecido: si un pedido no puede cumplirse con el inventario de una sola ubicación, se divide en varias entregas por ubicación, y su flujo de entrega local pasa por estados como sin preparar, listo para entrega y entregado.</p>`,
example:`<p>En Lima, entre Surco y Chorrillos hay pocos kilómetros pero tráfico variable. Un radio de mismo día pensado sobre el mapa puede fallar en hora punta. Por eso muchos equipos miden On Time <b>por modalidad y por franja</b> y no solo global. Los números del ejercicio son inventados.</p>`,
ex:{type:'calc',intro:'Franjas de domicilio de un día en la tienda Surco (datos sintéticos).',cols:['Franja','Capacidad','Pedidos asignados'],rows:[['09:00-12:00',40,46],['12:00-15:00',40,38],['15:00-18:00',40,44],['18:00-21:00',30,25]],num:[1,2],
task:'Calcula el exceso total sobre capacidad (solo franjas que se pasan) y la ocupación total.',
parts:[{l:'Pedidos que exceden capacidad',u:'pedidos',tol:0,fn:function(r){return r.reduce(function(a,x){return a+Math.max(0,x[2]-x[1])},0)}},{l:'Ocupación total',u:'%',tol:0.1,fn:function(r){var c=0,p=0;r.forEach(function(x){c+=x[1];p+=x[2]});return 100*p/c}}],
sol:function(v){return '<p>Excesos: 6 en la mañana y 4 en la tarde = <b>'+v[0]+'</b>. Ocupación total = 153 / 150 = <b>'+fmt(v[1])+'%</b>. Ojo: la ocupación total parece casi normal, pero la operación falla por franja. Por eso mira el detalle, no el promedio.</p>'}},
quiz:[
{q:'Un retiro en tienda con demora es sobre todo un problema de…',o:['Ruta del transportista','Preparación del pedido en tienda','Facturación','Precio'],a:1,w:'En retiro no hay transporte; el hito es «listo para retiro».'},
{q:'Ocupación total de 98% con dos franjas en 120%. ¿Qué conclusión sacas?',o:['Todo bien','Hay cuellos de botella por franja','Falta stock','Hay que subir precios'],a:1,w:'Los promedios esconden picos.'},
{q:'¿Qué define principalmente si un pedido entra en mismo día?',o:['El color del pedido','El corte horario, la cobertura y la disponibilidad en tienda','El ERP','El NPS'],a:1,w:'Corte, cobertura y disponibilidad operativa.'}],
src:[['https://help.shopify.com/en/manual/locations/managing-orders','Shopify Help: fulfilling orders by location'],['https://help.shopify.com/en/manual/fulfillment/fulfilling-orders/local-delivery-fulfillment','Shopify Help: local delivery fulfillment']],
ver:['Los cortes, radios y ventanas de cancelación reales dependen de cada empresa: '+V('preguntar en entrevista cuáles maneja')]},

{id:'1.4',title:'Banderas y canales',min:15,
goal:'Diferenciar bandera (marca o formato comercial) de canal (por dónde entra el pedido) y usar ambos como cortes de reporte.',
body:`<p>Un grupo retail puede operar varias <b>banderas</b>: marcas o formatos como supermercado, hogar, moda o especializados. El <b>canal</b> es por donde entra el pedido: web, app, marketplace, WhatsApp o call center.</p>
<p>Por qué te importa como analista: cada bandera puede tener su catálogo, sus promociones, su ventana de entrega y hasta su razón social. Si mezclas banderas en un solo On Time, escondes al que arrastra el resultado. En un reporte útil siempre puedes contestar «¿en qué bandera y en qué canal?».</p>
<p>Un ejemplo real de bandera múltiple: CAPECE describe que un seller de Intercorp Marketplaces puede vender casi automáticamente en Plaza Vea, Oechsle, Promart y Shopstar. Es un texto de 2024, así que confirma si sigue vigente ${V('estructura de banderas 2026')}.</p>`,
example:`<p>Para «Retail Andino» ficticio: un pedido de moda por app y otro de supermercado por web tienen SLA, picking y devoluciones distintos. Un dashboard con filtros de bandera y canal te evita tener que explicar «el promedio mejoró pero supermercado empeoró».</p>`,
ex:{type:'calc',intro:'Pedidos de una semana por bandera y canal (datos sintéticos).',cols:['Bandera','Web','App','Marketplace'],rows:[['Fresh (supermercado)',520,380,0],['Hogar',210,90,150],['Moda',160,140,230]],num:[1,2,3],
task:'Calcula el total de pedidos, el % que entra por App y el % de Marketplace dentro de la bandera Moda.',
parts:[{l:'Total de pedidos',tol:0,fn:function(r){var s=0;r.forEach(function(x){s+=x[1]+x[2]+x[3]});return s}},{l:'% por App',u:'%',fn:function(r){var a=0,s=0;r.forEach(function(x){a+=x[2];s+=x[1]+x[2]+x[3]});return 100*a/s}},{l:'% Marketplace en Moda',u:'%',fn:function(r){var x=r[2];return 100*x[3]/(x[1]+x[2]+x[3])}}],
sol:function(v){return '<p>Total = <b>'+v[0]+'</b>. App = 610 / '+v[0]+' = <b>'+fmt(v[1])+'%</b>. Moda tiene 230 de 530 pedidos en Marketplace = <b>'+fmt(v[2])+'%</b>: casi la mitad depende de sellers, así que su On Time depende de ellos.</p>'}},
quiz:[
{q:'La app móvil es…',o:['Una bandera','Un canal','Un sistema ERP','Una modalidad de entrega'],a:1,w:'La bandera es la marca o formato; la app es un canal de entrada.'},
{q:'¿Por qué no mezclar banderas en un solo KPI?',o:['Porque es ilegal','Porque un promedio puede ocultar a la bandera problemática','Porque el ERP lo prohíbe','Por estética'],a:1,w:'Simpson en pequeño: el agregado engaña.'},
{q:'¿Qué corte añadirías primero a un reporte de On Time?',o:['Solo el mes','Bandera, canal y modalidad','Color de logo','Ninguno'],a:1,w:'Son los cortes que explican las diferencias operativas.'}],
src:[['https://www.capece.org.pe/blog/marketplaces-peru/','CAPECE: marketplaces en Perú (incluye Intercorp Marketplaces)']],
ver:['Estructura de banderas y de marketplace de cada grupo: '+V('cambia con frecuencia')]},

{id:'1.5',title:'Marketplace: 1P, 3P y sellers',min:20,
goal:'Explicar la diferencia entre 1P y 3P, quién cobra, quién despacha y cómo cambia tu reporte de sellers.',
body:`<ul><li><b>1P (first party):</b> el retailer compra el producto, lo almacena y lo vende. Gana margen y controla stock y entrega.</li><li><b>3P (third party):</b> un <b>seller</b> externo publica en el marketplace y el retailer cobra una <b>comisión</b>. El seller pone inventario, a menudo despacha, y responde por el cumplimiento.</li></ul>
<p>Variantes de fulfillment 3P: el seller despacha él mismo, o el marketplace opera su almacén y despacha por él. En cada caso cambia quién responde ante un retraso.</p>
<p>En VTEX, cuando un pedido lo atiende un seller externo, el marketplace recibe el pago y el seller debe confirmar que empezó a atender: hasta ese momento el estado queda en Ready for handling. Gestión (2023) reportó, según un vocero citado, comisiones aproximadas de 20% en ropa y de 6 a 8% en celulares y computación; son cifras de esa nota, no vigentes para 2026 ${V('comisiones actuales')}.</p>
<p>Por eso existe el <b>reporte semanal de sellers</b>: mide quién cumple, quién cancela y a quién hay que llamar.</p>`,
example:`<p>«Moda Rímac», seller ficticio, vende una casaca. El cliente paga al marketplace, el seller entrega, y a fin de mes el marketplace liquida el monto menos la comisión. Si el seller cancela por falta de stock, el cliente culpa al marketplace, no al seller.</p>`,
ex:{type:'calc',intro:'Supuestos sintéticos por unidad de un mismo producto: precio S/ 500. En 1P el costo es S/ 380. En 3P la comisión es 12% del precio y el costo lo asume el seller.',
task:'Calcula el margen por unidad en 1P, el ingreso por unidad en 3P y cuántas unidades 3P hacen falta para igualar el margen de 100 unidades 1P.',
parts:[{l:'Margen 1P por unidad',u:'S/',tol:0.01,fn:function(){return 500-380}},{l:'Comisión 3P por unidad',u:'S/',tol:0.01,fn:function(){return 500*0.12}},{l:'Unidades 3P para igualar 100 de 1P',tol:0,fn:function(){return Math.round(100*(500-380)/(500*0.12))}}],

MODS.push({id:'2',title:'2. Operación diaria y stock',short:'Estados, picking, despacho, devoluciones, stock',blurb:'Lo que pasa entre el pago y la entrega, y por qué el stock se desalinea.',ch:[
{id:'2.1',title:'Estados del pedido y pedidos atorados',min:18,
goal:'Leer el ciclo de vida de un pedido, distinguir estado de pedido, de picking y de despacho, y detectar pedidos atorados por antigüedad.',
body:`<p>Un pedido tiene <b>un estado principal</b> en el OMS, y a la vez estados de subprocesos: el picking (por atender, en preparación, listo) y el despacho (asignado, en ruta, entregado, fallido). Confundirlos es la causa de muchos reportes contradictorios.</p>
<p>VTEX documenta que solo hay dos estados finales: <code>Invoiced</code> y <code>Canceled</code>. Todo lo demás es tránsito, y un pedido en tránsito no debería quedarse horas sin moverse.</p>
<p>La herramienta clave es la <b>antigüedad en estado</b> (aging): horas que lleva el pedido en cada estado. El reporte diario útil no solo cuenta pedidos: lista los que superan el umbral. Los umbrales los define cada operación; los del ejercicio son inventados.</p>`,
example:`<p>A las 10 de la mañana, en «Retail Andino» (ficticio), la lista de atorados muestra 14 pedidos de la tienda Surco en «Ready for handling». No es 14 problemas distintos: es una tienda sin picker o una integración caída. Agrupar por tienda te dice dónde llamar.</p>`,
ex:{type:'calc',intro:'Doce pedidos y su antigüedad en el estado actual (datos sintéticos). Regla del ejercicio: es atorado si Ready for handling supera 4 h, Verifying invoice supera 2 h, o Payment pending supera 24 h.',cols:['Pedido','Estado','Horas en el estado'],rows:[['P1','Ready for handling',1.5],['P2','Ready for handling',6],['P3','Payment pending',0.5],['P4','Ready for handling',9],['P5','Verifying invoice',3],['P6','Verifying invoice',12],['P7','Cancellation window',0.2],['P8','Ready for handling',2],['P9','Invoiced',20],['P10','Ready for handling',5],['P11','Verifying invoice',1],['P12','Payment pending',26]],num:[2],
task:'¿Cuántos pedidos están atorados y qué porcentaje son del total?',
parts:[{l:'Pedidos atorados',tol:0,fn:function(r){var lim={'Ready for handling':4,'Verifying invoice':2,'Payment pending':24};return r.filter(function(x){return lim[x[1]]!=null&&x[2]>lim[x[1]]}).length}},{l:'% del total',u:'%',tol:0.1,fn:function(r){var lim={'Ready for handling':4,'Verifying invoice':2,'Payment pending':24};return 100*r.filter(function(x){return lim[x[1]]!=null&&x[2]>lim[x[1]]}).length/r.length}}],
sol:function(v){return '<p>Atorados: P2, P4, P10 (Ready for handling), P5 y P6 (Verifying invoice) y P12 (Payment pending) = <b>'+v[0]+'</b>, o <b>'+fmt(v[1])+'%</b>. P9 está en un estado final y no cuenta. En Excel: <code>=CONTAR.SI.CONJUNTO(B:B;"Ready for handling";C:C;">4")</code> y sumas los otros dos estados.</p>'}},
quiz:[
{q:'¿Cuáles son los estados finales en VTEX?',o:['Ready for handling y Invoiced','Invoiced y Canceled','Payment approved y Canceled','Solo Invoiced'],a:1,w:'La documentación de VTEX indica que hay solo dos estados finales.'},
{q:'¿Qué mide la antigüedad en estado?',o:['El precio','Cuántas horas lleva el pedido en su estado actual','La edad del cliente','El NPS'],a:1,w:'Sirve para detectar pedidos que no avanzan.'},
{q:'14 pedidos atorados, todos de una tienda. ¿Qué haces?',o:['Los cancelas','Investigas primero causa común: personal, integración o stock de esa tienda','Los reasignas a ciegas','Esperas'],a:1,w:'Buscar el patrón antes de tocar pedidos uno por uno.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: order flow and status'],['https://newhelp.vtex.com/docs/tracks/order-flow','VTEX Help Center: solo dos estados finales']],
ver:['Umbrales de horas: los de tu empresa. Los del ejercicio son inventados.']},

{id:'2.2',title:'Picking y packing',min:18,
goal:'Comparar métodos de picking y calcular productividad (UPH) y tasa de error por picker.',
body:`<p><b>Picking</b> es recoger los productos en sus ubicaciones; <b>packing</b> es embalar y etiquetar. Métodos habituales:</p>
<ul><li><b>Por pedido:</b> un picker, un pedido. Simple, lento con muchos pedidos.</li><li><b>Por lote (batch):</b> varios pedidos a la vez con el mismo picker, luego se separan.</li><li><b>Por zona:</b> cada picker cubre una zona y el pedido pasa de zona en zona.</li><li><b>Por oleada (wave):</b> se lanzan grupos de pedidos en horarios fijos, alineados al corte de despacho.</li></ul>
<p>Métricas base: <b>UPH</b> (unidades por hora) y <b>tasa de error</b> (pedidos con error de preparación sobre pedidos preparados, o errores sobre unidades: define cuál usas). Decisión de fondo: qué haces cuando el picker no encuentra un producto: búsqueda ampliada por tiempo limitado, reasignación a otra tienda, sustituto con autorización del cliente, o cancelación parcial o total. Adelantarse y cancelar antes de iniciar el picking, cuando el sistema ya sabe que no hay stock, evita horas de espera.</p>`,
example:`<p>En una tienda de barrio grande de Lima, el picking de supermercado tiene frágiles, refrigerados y secos. Se suele preparar por zona para no mezclar temperaturas. En moda o tecnología el picking es corto pero el riesgo es el <b>error de variante</b> (talla, color, modelo).</p>`,
ex:{type:'calc',intro:'Turno de picking en una tienda (datos sintéticos).',cols:['Picker','Unidades','Horas','Errores'],rows:[['A',240,6,3],['B',180,5,9],['C',300,6,3]],num:[1,2,3],
task:'Calcula el UPH del picker B, el UPH global del turno y la tasa de error global sobre unidades.',
parts:[{l:'UPH de B',tol:0.1,fn:function(r){return r[1][1]/r[1][2]}},{l:'UPH global',tol:0.1,fn:function(r){var u=0,h=0;r.forEach(function(x){u+=x[1];h+=x[2]});return u/h}},{l:'Tasa de error',u:'%',tol:0.05,fn:function(r){var u=0,e=0;r.forEach(function(x){u+=x[1];e+=x[3]});return 100*e/u}}],
sol:function(v){return '<p>B = 180 / 5 = <b>'+fmt(v[0])+'</b>. Global = 720 / 17 = <b>'+fmt(v[1])+'</b> (no promedies los UPH de cada picker: pondera por horas). Error = 15 / 720 = <b>'+fmt(v[2],2)+'%</b>. B es el más lento y el que más falla: mira si tiene zona difícil o falta capacitación.</p>'}},
quiz:[
{q:'¿Por qué no se promedian los UPH individuales para obtener el UPH del turno?',o:['Porque es más lento','Porque hay que ponderar por horas trabajadas','No pasa nada si se promedian','Porque UPH no existe'],a:1,w:'El promedio simple ignora que cada picker trabajó distinto tiempo.'},
{q:'Picking por lote sirve sobre todo cuando…',o:['Hay pocos pedidos','Muchos pedidos comparten ubicaciones','El cliente pide factura','El stock es cero'],a:1,w:'Agrupas recorridos y ahorras tiempo.'},
{q:'El picker no encuentra el producto. La primera opción razonable es…',o:['Cancelar de inmediato','Búsqueda ampliada acotada, luego reasignar o sustituir según reglas','Marcar entregado','Ignorar'],a:1,w:'Cancelar es último recurso.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX: el seller asume la reserva de ítems al confirmar el inicio de atención']],
ver:['Métodos de picking y definiciones de UPH y tasa de error: práctica general de logística, sin norma. Confirma la definición interna de cada empresa.']},

{id:'2.3',title:'Despachos, rutas y capacidad',min:17,
goal:'Entender cortes, consolidación y rutas, y calcular cuántas rutas hacen falta.',
body:`<p>El despacho agrupa pedidos listos en <b>rutas</b> y los entrega con vehículos propios o de un operador logístico. Tres conceptos:</p>
<ul><li><b>Corte:</b> hora límite para que el pedido entre en la ruta de hoy.</li><li><b>Consolidación:</b> juntar pedidos cercanos en una misma ruta para bajar costo.</li><li><b>Capacidad:</b> paradas o volumen máximo por vehículo y por franja.</li></ul>
<p>Consolidar tiene un límite: si dos distritos están lejos, unirlos ahorra vehículos en el papel pero alarga el tiempo y puede romper la promesa. La pregunta correcta del analista es cuánto cuesta el ahorro en términos de On Time.</p>
<p>Los incidentes típicos de despacho: pedido preparado pero sin ruta asignada, ruta cerrada tarde, dirección incompleta, cliente ausente y reprogramación.</p>`,
example:`<p>Rutas de «Retail Andino» (ficticio) que salen de Surco hacia Chorrillos y San Miguel: un vehículo con 20 paradas puede completar Chorrillos, pero si se le suman paradas de San Miguel a última hora, las últimas se entregan fuera de franja.</p>`,
ex:{type:'calc',intro:'Paradas por distrito para el turno de la tarde (datos sintéticos). Capacidad: 20 paradas por vehículo.',cols:['Distrito','Paradas'],rows:[['Surco',38],['Chorrillos',22],['San Miguel',30],['Los Olivos',26]],num:[1],
task:'Calcula las rutas necesarias si cada distrito va por separado y si se consolidan todas las paradas.',
parts:[{l:'Rutas por distrito',tol:0,fn:function(r){return r.reduce(function(a,x){return a+Math.ceil(x[1]/20)},0)}},{l:'Rutas consolidadas',tol:0,fn:function(r){var s=0;r.forEach(function(x){s+=x[1]});return Math.ceil(s/20)}}],
sol:function(v){return '<p>Por distrito: 2+2+2+2 = <b>'+v[0]+'</b>. Consolidado: 116 / 20 = 5,8, sube a <b>'+v[1]+'</b>. Ahorras '+(v[0]-v[1])+' rutas, pero Los Olivos queda lejos de Surco: el ahorro solo es real si las rutas mixtas respetan la promesa. Mide On Time antes y después de consolidar.</p>'}},
quiz:[
{q:'El corte de despacho es…',o:['El precio final','La hora límite para entrar en la ruta del día','La hora de entrega','La firma del cliente'],a:1,w:'Define qué pedidos salen hoy.'},
{q:'Consolidar distritos lejanos puede…',o:['Mejorar siempre el On Time','Ahorrar vehículos pero poner en riesgo la promesa','No tener efecto','Cancelar pedidos automáticamente'],a:1,w:'Costo contra servicio.'},
{q:'Un pedido «preparado» sin ruta asignada es un problema de…',o:['Picking','Despacho o integración con TMS','Precio','Marketing'],a:1,w:'Se quedó entre la preparación y la ruta.'}],
src:[['https://help.shopify.com/en/manual/fulfillment/fulfilling-orders/local-delivery-fulfillment','Shopify Help: flujo de entrega local (sin preparar, listo para entrega, entregado)']],
ver:['Capacidad de 20 paradas y todos los números del ejercicio: inventados. Los cortes reales los define cada operación.']},

{id:'2.4',title:'Incidencias, cambios y devoluciones',min:18,
goal:'Clasificar incidencias, entender la logística inversa y usar un Pareto para priorizar causas.',
body:`<p>Una <b>incidencia</b> es cualquier desvío entre lo prometido y lo ocurrido: cliente ausente, dirección errada, producto dañado, faltante, demora. Un <b>cambio</b> reemplaza el producto; una <b>devolución</b> lo regresa y normalmente genera reembolso. El camino del producto de vuelta se llama <b>logística inversa</b>.</p>
<p>Para el analista lo importante es <b>tipificar</b> bien: causa, responsable (cliente, tienda, transporte, seller, sistema) y costo. Sin causa clara no hay acción. Un <b>Pareto</b> ordena causas de mayor a menor y muestra el acumulado: suele revelar que pocas causas explican la mayoría de incidencias.</p>
<p>Conexión tributaria: cuando un pedido facturado se devuelve, el comprobante se corrige con una nota de crédito (lo verás en el capítulo 5.1). Y las <b>mermas</b> (producto dañado o vencido que no se puede vender) se registran aparte de las devoluciones vendibles.</p>`,
example:`<p>En Lima, «cliente ausente» y «dirección incompleta» suelen dominar las fallas de última milla en departamentos y edificios sin referencia clara. Un campo obligatorio de referencia y un mensaje previo por WhatsApp pueden bajar ambas causas. Las cifras del ejercicio son inventadas.</p>`,
ex:{type:'calc',intro:'Incidencias de entrega de una semana (datos sintéticos).',cols:['Causa','Casos'],rows:[['Cliente ausente',58],['Dirección incompleta',39],['Producto dañado',15],['Faltante',10],['Demora de ruta',3]],num:[1],
task:'Calcula el total, y el % acumulado de las dos primeras causas.',
parts:[{l:'Total de incidencias',tol:0,fn:function(r){return r.reduce(function(a,x){return a+x[1]},0)}},{l:'% acumulado de las 2 primeras',u:'%',tol:0.1,fn:function(r){var t=0,s=r.map(function(x){t+=x[1];return x[1]}).sort(function(a,b){return b-a});return 100*(s[0]+s[1])/t}}],
sol:function(v){return '<p>Total = <b>'+v[0]+'</b>. Las dos primeras suman 97 casos = <b>'+fmt(v[1])+'%</b>. Prioriza ahí. En Excel: ordenas descendente y calculas acumulado con <code>=SUMA($B$2:B2)/SUMA($B$2:$B$6)</code>.</p>'}},
quiz:[
{q:'¿Qué es logística inversa?',o:['Enviar más rápido','El flujo de retorno de productos del cliente al retailer','Un tipo de picking','Un sistema ERP'],a:1,w:'Cambios, devoluciones y mermas.'},
{q:'¿Para qué sirve un Pareto?',o:['Para calcular NPS','Para priorizar las pocas causas que explican la mayoría de casos','Para facturar','Para medir stock'],a:1,w:'Ordena causas y muestra acumulado.'},
{q:'Producto dañado que no se puede volver a vender se registra como…',o:['Devolución vendible','Merma','Cambio','Sobreventa'],a:1,w:'Es pérdida de inventario por daño o vencimiento.'}],
src:[['https://cpe.sunat.gob.pe/informacion_general/obligados_cpe','SUNAT: comprobantes de pago electrónicos (notas de crédito y débito)']],
ver:['Tipificación de incidencias y responsables: la de cada empresa. La nota de crédito para devoluciones se explica en el capítulo 5.1 '+V('casos concretos en SUNAT')]},

{id:'2.5',title:'Stock físico, disponible, ajustes y mermas',min:20,
goal:'Calcular stock disponible a partir del físico, entender ajustes y medir precisión de inventario.',
body:`<p>El <b>stock físico</b> es lo que realmente hay en la ubicación. El <b>stock disponible</b> es lo que se puede ofrecer online:</p>
<pre><code>Disponible publicado = máx(0, Físico − Reservado − Bloqueado − Stock de seguridad)</code></pre>
<p><b>Reservado</b> son unidades comprometidas a pedidos en curso. <b>Bloqueado</b> son unidades dañadas, en revisión o apartadas. El <b>stock de seguridad</b> es un colchón que se resta a propósito para absorber desalineaciones. Cada empresa decide sus reglas.</p>
<p>Un <b>ajuste</b> corrige la diferencia entre el sistema y la realidad: positivo si sobra, negativo si falta. Salen de conteos cíclicos, mermas, errores de recepción o hallazgos de picking. Un ajuste solo sirve si el stock corregido llega a la plataforma a tiempo.</p>
<p>VTEX advierte algo útil: al confirmar el inicio de atención, el seller asume la reserva de los ítems; si hay actualizaciones de inventario después, la plataforma descarta la reserva de esos SKU, por eso recomienda actualizar el inventario solo después de facturar el pedido, para evitar discrepancias con el backoffice.</p>
<p>La <b>precisión de inventario</b> (IRA) suele medirse como SKUs o ubicaciones contadas sin diferencia sobre el total contado.</p>`,
example:`<p>Una tienda de «Retail Andino» (ficticia) recibe 30 unidades de una licuadora. Recepción registra 30, pero llegaron 3 con caja rota. Si nadie bloquea esas 3, el sistema ofrece 30, se venden 30 y tres pedidos se caen en picking. La causa no está en el picking: está en <b>no haber bloqueado la merma</b>.</p>`,
ex:{type:'calc',intro:'Stock de cuatro SKU (datos sintéticos).',cols:['SKU','Físico','Reservado','Bloqueado','Seguridad'],rows:[['A',12,5,1,2],['B',3,3,0,1],['C',25,4,2,3],['D',0,0,0,0]],num:[1,2,3,4],
task:'Calcula el disponible publicado total y cuántos SKU quedan con disponible cero.',
parts:[{l:'Disponible publicado total',tol:0,fn:function(r){return r.reduce(function(a,x){return a+Math.max(0,x[1]-x[2]-x[3]-x[4])},0)}},{l:'SKU con disponible 0',tol:0,fn:function(r){return r.filter(function(x){return Math.max(0,x[1]-x[2]-x[3]-x[4])===0}).length}}],
sol:function(v){return '<p>A = 4, B = máx(0, -1) = 0, C = 16, D = 0. Total = <b>'+v[0]+'</b>; SKU en cero = <b>'+v[1]+'</b> (B y D). B tiene 3 unidades físicas pero todas están reservadas más el colchón: si vendes una más, es sobreventa.</p>'}},
quiz:[
{q:'¿Para qué sirve el stock de seguridad online?',o:['Para subir el precio','Para absorber desalineaciones entre sistemas y evitar sobreventa','Para el marketing','Para el TMS'],a:1,w:'Es un colchón deliberado.'},
{q:'Según VTEX, ¿cuándo conviene actualizar el inventario tras iniciar la atención?',o:['Antes de facturar','Después de que el pedido esté facturado','Nunca','Cuando llegue el cliente'],a:1,w:'Evita que la plataforma descarte reservas y genere discrepancias.'},
{q:'Un ajuste negativo aparece cuando…',o:['Sobra stock','El sistema dice más de lo que hay físicamente','Baja el precio','Sube el NPS'],a:1,w:'Se corrige una diferencia contra el conteo real.'}],
src:[['https://help.vtex.com/en/docs/tutorials/order-flow-and-status','VTEX Help Center: reserva de ítems y actualización de inventario']],
ver:['La fórmula de disponible publicado es un modelo didáctico. Tu sistema puede sumar o restar otros conceptos. '+V('confirmar reglas de stock de seguridad en cada empresa')]},

{id:'2.6',title:'Sobreventa y cancelaciones por producto sin ubicar',min:20,
goal:'Encadenar causa raíz de una cancelación por stock y medir cuánto pesa en el total de cancelaciones.',
body:`<p><b>Sobreventa:</b> se vendió más de lo que realmente existe. <b>Producto sin ubicar:</b> el picker no lo encuentra donde el sistema dice. Son el mismo problema visto desde dos lados: el sistema cree que hay stock y la tienda no lo tiene disponible.</p>
<h3>Causas frecuentes</h3>
<ul><li><b>Stock fantasma:</b> físicamente no está (merma, hurto, error de recepción) y nadie ajustó.</li><li><b>Producto mal ubicado:</b> existe, pero en otra ubicación.</li><li><b>Ventas por fuera del online:</b> el POS vende y el OMS se entera tarde.</li><li><b>Ajustes tardíos:</b> se corrigió en almacén pero la plataforma no lo refleja.</li><li><b>Picos:</b> promoción o campaña que consume stock más rápido que la sincronización.</li></ul>
<h3>Qué hacer antes de cancelar</h3>
<ol><li>Búsqueda ampliada con tiempo tope.</li><li>Conteo puntual y ajuste inmediato.</li><li>Reasignar a otra tienda si el plazo lo permite.</li><li>Sustituto con autorización del cliente.</li><li>Recién entonces, cancelar y registrar el motivo correcto.</li></ol>
<p>Mide: % de cancelación por sin ubicar y sobreventa sobre cancelaciones totales, y sobre pedidos creados; tiempo hasta detección; y SKU y tienda repetidos.</p>`,
example:`<p>Si en un mes «Retail Andino» (ficticio) recibe muchas cancelaciones por «sin ubicar» en el mismo SKU y la misma tienda, no son 20 problemas de picking: es una entrada de inventario mal registrada. Corriges el ajuste una vez y las cancelaciones desaparecen.</p>`,
ex:{type:'calc',data:true,intro:'Practica con el CSV de pedidos sintéticos.',
task:'Cuenta las cancelaciones con motivo «Producto sin ubicar» o «Sobreventa» y calcula qué porcentaje son del total de cancelaciones.',
parts:[{l:'Cancelaciones por stock',tol:0,fn:function(d){return d.filter(function(r){return r.estado==='Cancelado'&&(r.motivo==='Producto sin ubicar'||r.motivo==='Sobreventa')}).length}},{l:'% del total de cancelaciones',u:'%',tol:0.1,fn:function(d){var c=d.filter(function(r){return r.estado==='Cancelado'});var s=c.filter(function(r){return r.motivo==='Producto sin ubicar'||r.motivo==='Sobreventa'}).length;return 100*s/c.length}}],
sol:function(v){return '<p>Son <b>'+v[0]+'</b> cancelaciones, un <b>'+fmt(v[1])+'%</b> del total. En Excel: <code>=CONTAR.SI.CONJUNTO(K:K;"Cancelado";L:L;"Producto sin ubicar")+CONTAR.SI.CONJUNTO(K:K;"Cancelado";L:L;"Sobreventa")</code>. En el caso final descubrirás dónde se concentran.</p>'}},
quiz:[
{q:'«Producto sin ubicar» y «sobreventa» son…',o:['Causas sin relación','Dos manifestaciones de stock desalineado','Un tipo de merma','Errores de facturación'],a:1,w:'Ambos nacen de que el sistema y la tienda no coinciden.'},
{q:'¿Qué haces antes de cancelar un pedido por sin ubicar?',o:['Cancelas de inmediato','Buscas, ajustas, reasignas o sustituyes según regla','Lo marcas entregado','Llamas al cliente para que espere'],a:1,w:'La cancelación es el último recurso.'},
