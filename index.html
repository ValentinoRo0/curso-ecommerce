sol:function(v){return '<p>Fallidas = 15% de 40 = <b>'+v[0]+'</b>. Costo por parada = 180/40 = 4,50. Costo total = 180 + 6 × 4,50 = <b>S/ '+fmt(v[1],2)+'</b>. Por entrega = <b>S/ '+fmt(v[2],3)+'</b>, un <b>'+fmt(v[3])+'%</b> más que los 4,50 de una ruta perfecta. Y no incluye el costo de atención al cliente ni el impacto en el NPS.</p>'}},
quiz:[
{q:'El éxito al primer intento mide…',o:['Entregas hechas al primer intento sobre pedidos despachados','Pedidos creados sobre despachados','El ticket promedio','La rapidez del picking'],a:0,w:'Es un KPI clave de la última milla.'},
{q:'¿Qué puede reducir los fallos por dirección?',o:['Cobrar más','Direcciones validadas y con referencia, y aviso previo','Más motos siempre','Menos ventanas'],a:1,w:'Ataca la causa, no el síntoma.'},
{q:'Una cifra de otro país sobre costos de última milla…',o:['Se copia a tu reporte','Solo sirve como referencia de magnitud, no como dato propio','Es un dato oficial de Perú','No existe'],a:1,w:'Usa datos de tu operación.'}],
src:[['https://andina.pe/agencia/noticia-cinco-desafios-debe-superar-sector-logistico-peru-para-continuar-su-crecimiento-1034330.aspx','Andina (2025): desafíos del sector logístico en Perú, incluida la última milla'],['https://www.elmostrador.cl/agenda-pais/2020/08/05/la-ultima-milla-el-talon-de-aquiles-del-e-commerce/','El Mostrador (Chile, 2020): indicadores para exigir a operadores de última milla'],['https://mercado.com.ar/tendencias/entregas-fallidas-y-ultima-milla-el-costo-operativo-de-la-logistica-de-excepciones','Mercado (México): estimaciones sobre entregas fallidas y costo de última milla'],['https://cpe.sunat.gob.pe/node/122','SUNAT: preguntas frecuentes de guía de remisión electrónica']],
ver:['Las notas de prensa son opinión sectorial y estimaciones de terceros: '+V('datos oficiales o de tu empresa'),'Los costos de flota y las cifras del ejercicio son ficticios.']},

{id:'6.5',title:'Costos logísticos y costo por pedido',min:20,
goal:'Descomponer el costo logístico, calcular el costo y la contribución por pedido y fijar un ticket mínimo para envío gratis.',
body:`<p>El <b>costo por pedido</b> (cost-to-serve) reúne lo que cuesta atender un pedido después de venderlo: <b>picking y packing</b> (mano de obra), <b>materiales de embalaje</b>, <b>almacenamiento</b>, <b>transporte</b>, <b>devoluciones</b>, <b>atención al cliente</b> y <b>mermas</b>. Parte es variable (por pedido) y parte fija (alquiler, supervisores).</p>
<pre><code>Costo por pedido       = costos logísticos del periodo / pedidos del periodo
Margen bruto por pedido = ticket promedio × margen bruto %
Contribución por pedido = margen bruto por pedido − costo por pedido
Ticket mínimo para envío gratis ≈ costo de envío / margen bruto %</code></pre>
<p>La última fórmula es un punto de partida: indica el ticket en que el margen bruto de la compra cubre el costo del envío. En la práctica también se consideran comisiones de pago, devoluciones y el efecto de subir el ticket (más unidades por pedido).</p>
<h3>Qué mueve el costo por pedido</h3>
<ul><li><b>Ticket y unidades por pedido:</b> más productos por pedido diluyen el costo fijo de despacho.</li><li><b>Modalidad:</b> el retiro en tienda evita el transporte.</li><li><b>Devoluciones y cancelaciones tardías:</b> un pedido cancelado en picking ya consumió trabajo.</li><li><b>Zona:</b> las rutas más dispersas cuestan más.</li></ul>`,
example:`<p>«Retail Andino» (ficticio) analiza si ofrecer envío gratis desde S/ 50. Con los números del ejercicio, el envío cuesta S/ 12 y el margen es 28%: el punto en que la compra cubre el envío es cerca de S/ 43. Pedir S/ 50 deja un pequeño colchón.</p>`,
ex:{type:'calc',intro:'Costos del mes (datos sintéticos) para 1000 pedidos. Ticket promedio: S/ 180. Margen bruto: 28%. Costo de envío por pedido: S/ 12.',cols:['Concepto','Costo del mes (S/)'],rows:[['Picking y packing',5200],['Materiales de embalaje',1800],['Transporte',11500],['Devoluciones',1500],['Atención al cliente',1000]],num:[1],
task:'Calcula el costo por pedido, la contribución por pedido, el ticket mínimo para envío gratis y el costo logístico como % del ticket.',
parts:[{l:'Costo por pedido',u:'S/',tol:0.01,fn:function(r){return r.reduce(function(a,x){return a+x[1]},0)/1000}},{l:'Contribución por pedido',u:'S/',tol:0.01,fn:function(r){return 180*0.28-r.reduce(function(a,x){return a+x[1]},0)/1000}},{l:'Ticket mínimo (envío gratis)',u:'S/',tol:0.1,fn:function(){return 12/0.28}},{l:'Costo logístico sobre el ticket',u:'%',tol:0.1,fn:function(r){return 100*(r.reduce(function(a,x){return a+x[1]},0)/1000)/180}}],
sol:function(v){return '<p>Costo total = 21 000 → por pedido = <b>S/ '+fmt(v[0],2)+'</b>. Margen bruto = 180 × 0,28 = 50,40, contribución = <b>S/ '+fmt(v[1],2)+'</b>. Ticket mínimo = 12 / 0,28 ≈ <b>S/ '+fmt(v[2])+'</b>. Costo logístico = <b>'+fmt(v[3])+'%</b> del ticket. Si el ticket cayera a 100 con el mismo costo, la contribución sería negativa: por eso el ticket importa.</p>'}},
quiz:[
{q:'Costo por pedido =',o:['Ventas / pedidos','Costos logísticos del periodo / pedidos del periodo','Margen / ticket','Pedidos / costos'],a:1,w:'Todo lo que cuesta atender pedidos, sobre el número de pedidos.'},
{q:'Para que el envío gratis no destruya el margen…',o:['Se ignora el ticket','Se fija un ticket mínimo cercano al costo de envío / margen bruto %','Se sube el costo del envío','Se elimina el picking'],a:1,w:'El margen de la compra debe cubrir el envío.'},
{q:'Un pedido cancelado durante el picking…',o:['No cuesta nada','Ya consumió trabajo y suma al costo','Genera ganancia','No se registra'],a:1,w:'El trabajo de preparación ya se hizo.'}],
src:[],
ver:['Fórmulas de costo por pedido: práctica general de finanzas y logística; el detalle de conceptos lo define la empresa.','Todas las cifras son ficticias.']},

{id:'6.6',title:'Operadores logísticos y acuerdos de servicio (SLA)',min:18,
goal:'Decidir cuándo tercerizar, qué debe decir un SLA y cómo evaluar a un operador con indicadores por zona.',
body:`<p><b>Tercerizar</b> (3PL) da flexibilidad ante volumen variable, cobertura y menos inversión; <b>internalizar</b> da control y calidad de servicio, pero exige costos fijos y capacidad de gestión. Las notas del sector peruano describen a retailers que internalizan por falta de operadores confiables; es una tendencia que debes contrastar con tu empresa.</p>
<h3>Qué debe incluir un SLA</h3>
<ul><li><b>Cobertura y tiempos por zona</b> y ventanas horarias.</li><li><b>Indicadores:</b> entrega a tiempo, éxito al primer intento, fallos, rechazos, daños y extravíos, con su fórmula exacta.</li><li><b>Prueba de entrega y tracking</b> compartidos con tu sistema.</li><li><b>Reportes</b> semanales por zona, no solo un total.</li><li><b>Penalidades o incentivos</b> y proceso de reclamos.</li><li><b>Capacidad en campañas</b> reservada con anticipación.</li></ul>
<p>Un error común: contratar al operador y revisar solo los casos con retraso del día, sin exigir indicadores por zona. Así se detectan los focos problemáticos y se corrigen con el operador.</p>
<p>Conecta con lo que ya sabes: el scorecard de sellers (capítulo 4.4) y el reporte semanal (capítulo 3.6) se adaptan a operadores; y la propuesta de automatización de seguimiento semanal está en el catálogo del capítulo 10.7.</p>`,
example:`<p>El operador de «Retail Andino» (ficticio) reporta 93% de entrega a tiempo en el mes. Al abrir por zona, Lima Sur tiene 87% y arrastra el resultado. Sin el corte por zona, el reporte parecía aceptable.</p>`,
ex:{type:'calc',intro:'Reporte mensual de un operador (datos sintéticos). Objetivo de On Time: 92% por zona.',cols:['Zona','Entregas','A tiempo','Primer intento','Daños o extravíos'],rows:[['Lima Norte',420,397,360,3],['Lima Centro',380,366,351,1],['Lima Sur',300,262,240,5]],num:[1,2,3,4],
task:'Calcula el On Time global, el éxito al primer intento global y cuántas zonas están bajo el objetivo de 92%.',
parts:[{l:'On Time global',u:'%',tol:0.1,fn:function(r){var e=0,a=0;r.forEach(function(x){e+=x[1];a+=x[2]});return 100*a/e}},{l:'Primer intento global',u:'%',tol:0.1,fn:function(r){var e=0,a=0;r.forEach(function(x){e+=x[1];a+=x[3]});return 100*a/e}},{l:'Zonas bajo 92%',tol:0,fn:function(r){return r.filter(function(x){return 100*x[2]/x[1]<92}).length}}],
sol:function(v){return '<p>On Time global = 1025/1100 = <b>'+fmt(v[0])+'%</b>. Primer intento = 951/1100 = <b>'+fmt(v[1])+'%</b>. Zonas bajo 92%: solo Lima Sur (87,3%) = <b>'+v[2]+'</b>. El global esconde el foco: hay que negociar un plan concreto para esa zona.</p>'}},
quiz:[
{q:'¿Qué debe exigirse en el reporte de un operador?',o:['Solo un total mensual','Indicadores por zona con su fórmula','Solo fotos','Nada'],a:1,w:'Permite ubicar dónde falla.'},
{q:'Tercerizar frente a internalizar…',o:['Siempre es más barato','Da flexibilidad y menos inversión, con menos control directo','Elimina el SLA','Reduce el volumen'],a:1,w:'Hay trade-offs.'},
{q:'Capacidad en campañas: ¿cuándo se negocia?',o:['El mismo día','Con anticipación, dentro del acuerdo','Nunca','Solo si hay problema'],a:1,w:'La capacidad no aparece de un día para otro.'}],
src:[['https://www.elmostrador.cl/agenda-pais/2020/08/05/la-ultima-milla-el-talon-de-aquiles-del-e-commerce/','El Mostrador: indicadores por zona a exigir a operadores'],['https://andina.pe/agencia/noticia-cinco-desafios-debe-superar-sector-logistico-peru-para-continuar-su-crecimiento-1034330.aspx','Andina (2025): dificultades de tercerización en última milla']],
ver:['Contenido de SLA y penalidades: lo define cada contrato; lo que ves aquí es una guía didáctica.','Todas las cifras son ficticias.']}
]});
var DEM8=[120,132,128,140,135,150,145,160];
MODS.push({id:'7',grp:'log',title:'7. Planificación de inventario y demanda',short:'Pronóstico, ABC, stock de seguridad, EOQ, cobertura, caso de campaña',blurb:'Cuánto pedir, cuándo pedir y cuánto stock proteger: fórmulas, calculadoras y un caso de campaña de alta demanda.',ch:[
{id:'7.1',title:'Demanda y pronóstico simple',min:20,
goal:'Construir un pronóstico con promedio móvil y suavizamiento exponencial, y medir su error con MAE, MAPE y sesgo.',
body:`<p>Una serie de demanda combina un <b>nivel</b> (lo normal), una posible <b>tendencia</b>, <b>estacionalidad</b> (semanas o meses que se repiten) y <b>ruido</b>. En Perú hay picos comerciales recurrentes, como Cyber Wow, Día de la Madre o Navidad; las fechas cambian, así que confírmalas cada año ${V('calendario de campañas del año')}.</p>
<h3>Dos métodos simples</h3>
<ul><li><b>Promedio móvil de k periodos:</b> el pronóstico es el promedio de los últimos k datos. Simple y estable, pero reacciona lento a los cambios.</li><li><b>Suavizamiento exponencial simple:</b> <code>nivel nuevo = α × dato + (1 − α) × nivel anterior</code>. Da más peso a lo reciente. α cercano a 1 reacciona rápido y con ruido; cercano a 0, lento y suave.</li></ul>
<p>El libro de Hyndman y Athanasopoulos, referencia habitual, recomienda preferir modelos simples que capturen bien el patrón y evaluar la precisión con datos que el modelo no usó para ajustarse.</p>
<h3>Medir el error</h3>
<pre><code>MAE  = promedio de |real − pronóstico|
MAPE = promedio de |real − pronóstico| / real   (no sirve si real = 0)
Sesgo = promedio de (real − pronóstico)          (positivo: pronosticas de menos)</code></pre>
<p>Reglas de trabajo: separa las <b>promociones</b> de la demanda base, no pronostiques con ventas cuando hubo quiebre (subestimas la demanda real), y no uses un método simple para SKUs con demanda intermitente (muchos ceros).</p>`,
example:`<p>«Retail Andino» (ficticio) vende cada semana unas 130 a 160 unidades de una licuadora. Un promedio móvil de tres semanas dice 152 para la próxima. Si viene una promoción, el método no lo sabe: hay que sumarle el efecto esperado aparte.</p>`,
ex:{type:'fc',intro:'Prueba dos métodos con la demanda semanal de un SKU (datos sintéticos). Cambia el método y el parámetro y mira cómo cambian el pronóstico y el error.',sample:DEM8.join(', '),
also:{type:'calc',intro:'Con la serie 120, 132, 128, 140, 135, 150, 145, 160:',task:'Calcula el pronóstico de la semana 9 con promedio móvil de 3 semanas y con suavizamiento exponencial α = 0,5 (nivel inicial = primer dato), y el MAE del promedio móvil.',
parts:[{l:'Promedio móvil (3)',tol:0.05,fn:function(){return maFc(DEM8,3).next}},{l:'Suavizamiento (α = 0,5)',tol:0.05,fn:function(){return sesFc(DEM8,0.5).next}},{l:'MAE del promedio móvil (3)',tol:0.05,fn:function(){return fcErr(DEM8,maFc(DEM8,3).f).mae}}],
sol:function(v){return '<p>Promedio móvil = (150 + 145 + 160)/3 = <b>'+fmt(v[0],2)+'</b>. Suavizamiento: nivel inicial 120 y se actualiza cada semana hasta <b>'+fmt(v[1],2)+'</b>. MAE del promedio móvil (5 periodos evaluables) = <b>'+fmt(v[2],2)+'</b>. La serie sube de forma sostenida: ambos métodos van por detrás de la tendencia y tienden a subestimar; ese es el sesgo que verás en la calculadora.</p>'}}},
quiz:[
{q:'α alto en el suavizamiento exponencial…',o:['Reacciona más lento','Da más peso a lo reciente, con más ruido','Elimina el error','No cambia'],a:1,w:'Más sensible a los últimos datos.'},
{q:'Si hubo quiebre de stock en una semana, esas ventas…',o:['Son la demanda real','Subestiman la demanda real','No importan','Se duplican'],a:1,w:'No vendiste lo que el cliente quería comprar.'},
{q:'Un sesgo positivo (real − pronóstico) significa…',o:['Pronosticas de más','Pronosticas de menos','No hay error','El MAPE es cero'],a:1,w:'El real fue mayor que el pronóstico.'}],
src:[['https://otexts.com/fpp3/','Hyndman y Athanasopoulos: Forecasting: Principles and Practice (libro en línea)'],['https://www.cleverence.com/articles/for-business/how-to-calculate-reorder-point-with-safety-stock-5829/','Cleverence: sobre demanda restringida por quiebres (fuente comercial)']],
ver:['Enlace del libro: '+V('comprobar que sigue disponible'),'Nombres de funciones y herramientas de previsión de Excel: '+V('probar en tu Excel'),'Los datos son sintéticos.']},

{id:'7.2',title:'Clasificación ABC y XYZ',min:20,
goal:'Clasificar SKUs por valor y por variabilidad para decidir dónde poner atención y cuánto stock proteger.',
body:`<p><b>ABC</b> ordena los SKU por valor anual (demanda × costo, o ventas, o margen) y acumula: típicamente <b>A</b> hasta cerca del 80% del valor acumulado, <b>B</b> hasta cerca del 95% y <b>C</b> el resto. Es una regla de partida: algunas empresas usan 70/20/10 o 75/20/5. Suele ocurrir que pocos SKU (alrededor de 10 a 20%) aportan la mayor parte del valor.</p>
<p><b>XYZ</b> mide la <b>variabilidad de la demanda</b> con el coeficiente de variación (desviación estándar / media): un corte habitual es X si es menor a 0,5, Y si está entre 0,5 y 1,0 y Z si es mayor a 1,0. Lo ideal es medirlo sobre datos sin promociones y con estacionalidad controlada.</p>
<p>Juntas dan una matriz de nueve celdas. Ejemplos: <b>AX</b> (valioso y estable) admite reposición ajustada; <b>AZ</b> (valioso y errático) exige más colchón y seguimiento; <b>CZ</b> puede simplificarse con reglas mínimas.</p>
<h3>Qué cambia con la clase</h3>
<ul><li>Frecuencia de conteo cíclico y precisión de inventario (capítulo 2.5): más en A.</li><li>Slotting: A cerca del packing (capítulo 6.2).</li><li>Nivel de servicio y stock de seguridad (capítulo 7.3).</li><li>Frecuencia de revisión y automatización de alertas (capítulo 10.7).</li></ul>`,
example:`<p>En «Retail Andino» (ficticio), tres SKU de tecnología explican casi 80% del valor. Un quiebre en cualquiera de ellos se nota en el reporte de ventas. Los SKU C, en cambio, se reponen con reglas simples y revisión mensual.</p>`,
ex:{type:'calc',lab:{t:'Laboratorio: coeficiente de variación',fields:[{k:'m',l:'Media semanal',v:24},{k:'s',l:'Desviación estándar',v:5}],out:[{l:'CV',f:function(v){return v.m?v.s/v.m:0},d:2}]},
intro:'Diez SKU con su valor anual en soles (datos sintéticos): 420 000, 260 000, 110 000, 70 000, 45 000, 30 000, 25 000, 20 000, 12 000 y 8 000. Regla del ejercicio: A si el % acumulado es ≤ 80%, B si es ≤ 95%, C el resto.',
task:'Calcula cuántos SKU son clase A, qué % del valor aportan y cuántos son clase C.',
parts:[{l:'SKU clase A',tol:0,fn:function(){var v=[420000,260000,110000,70000,45000,30000,25000,20000,12000,8000],t=1000000,c=0,n=0;v.forEach(function(x){c+=x;if(c/t<=0.8)n++});return n}},{l:'% del valor de los A',u:'%',tol:0.1,fn:function(){var v=[420000,260000,110000,70000,45000,30000,25000,20000,12000,8000],t=1000000,c=0,l=0;v.forEach(function(x){c+=x;if(c/t<=0.8)l=100*c/t});return l}},{l:'SKU clase C',tol:0,fn:function(){var v=[420000,260000,110000,70000,45000,30000,25000,20000,12000,8000],t=1000000,c=0,n=0;v.forEach(function(x){c+=x;if(c/t>0.95)n++});return n}}],
sol:function(v){return '<p>Acumulados: 42%, 68%, 79%, 86%, 90,5%, 93,5%, 96%, 98%, 99,2%, 100%. A: los tres primeros = <b>'+v[0]+'</b>, que aportan <b>'+fmt(v[1])+'%</b> del valor. B: del 4.º al 6.º. C: <b>'+v[2]+'</b> SKU. Con otras convenciones (por ejemplo incluir el SKU que cruza el 80%) el resultado cambia, por eso se documenta la regla.</p>'}},
quiz:[
{q:'ABC clasifica por…',o:['Variabilidad de la demanda','Valor anual acumulado','Color','Proveedor'],a:1,w:'XYZ es la que mide variabilidad.'},
{q:'Un SKU AZ es…',o:['Poco valioso y estable','Valioso y de demanda errática','Sin valor','Descontinuado'],a:1,w:'Alta importancia y difícil de pronosticar.'},
{q:'Los cortes 80/95 y CV 0,5/1,0 son…',o:['Leyes','Puntos de partida ajustables','Obligatorios por SUNAT','Iguales para todos los rubros'],a:1,w:'Se adaptan a la cartera y al riesgo.'}],
src:[['https://www.cleverence.com/articles/for-business/inventory-classification-methods-4721/','Cleverence: métodos de clasificación de inventario (fuente comercial)'],['https://metricgate.com/docs/abc-inventory-classification','Metricgate: pasos del análisis ABC'],['https://imperiascm.com/supply-chain-tools/abc-xyz-inventory-calculator','Imperia SCM: matriz ABC-XYZ']],
ver:['Los porcentajes de corte y los umbrales de CV son convenciones de fuentes comerciales: '+V('definir criterios con tu empresa'),'Datos sintéticos.']},

{id:'7.3',title:'Stock de seguridad y punto de reorden',min:20,
goal:'Calcular cuánto colchón necesitas para un nivel de servicio y en qué nivel de stock conviene reponer.',
body:`<p>El <b>stock de seguridad</b> (SS) protege contra la variabilidad de la demanda y del tiempo de reposición. El <b>punto de reorden</b> (ROP) responde «¿cuándo pido?».</p>
<pre><code>Demanda en el lead time = d × L
SS (solo varía la demanda)      = z × σd × √L
ROP = d × L + SS
SS (varían demanda y lead time) = z × √( L × σd² + d² × σL² )</code></pre>
<p>Donde <b>d</b> es la demanda media por periodo, <b>σd</b> su desviación, <b>L</b> el lead time medio en los mismos periodos, <b>σL</b> la desviación del lead time y <b>z</b> el valor de la distribución normal para el nivel de servicio. Valores usuales: 90% → 1,28; 95% → 1,65; 97,5% → 1,96; 99% → 2,33. En Excel: <code>DISTR.NORM.ESTAND.INV(0,95)</code> (nombre en español a confirmar).</p>
<h3>Cuidado con los supuestos</h3>
<ul><li><b>Misma unidad de tiempo:</b> si el lead time está en días, σd debe ser de demanda diaria. Mezclar meses con días infla el resultado.</li><li><b>Lead times reales, no prometidos:</b> calcula σL con fechas de recepción, no con lo que dice el proveedor.</li><li><b>Distribución normal:</b> no sirve para SKU con muchos ceros; ahí se usan otros métodos.</li><li>Subir el nivel de servicio encarece el stock cada vez más: pasar de 95% a 99% no cuesta lo mismo que de 90% a 95%.</li></ul>`,
example:`<p>Un SKU de «Retail Andino» (ficticio) vende 40 unidades diarias con desviación de 12, y el proveedor tarda 7 días. Con 95% de servicio, el colchón cubre las semanas en que la demanda se dispara. Si además el proveedor a veces tarda 9 días, el colchón debe ser mucho mayor.</p>`,
ex:{type:'calc',lab:{t:'Laboratorio: stock de seguridad',fields:[{k:'d',l:'Demanda diaria',v:40},{k:'s',l:'Desv. diaria',v:12},{k:'L',l:'Lead time (días)',v:7},{k:'z',l:'z',v:1.65}],out:[{l:'SS (demanda variable)',f:function(v){return v.z*v.s*Math.sqrt(v.L)},d:1},{l:'ROP',f:function(v){return v.d*v.L+v.z*v.s*Math.sqrt(v.L)},d:1}]},
intro:'SKU con demanda media de 40 unidades por día, desviación de 12, lead time de 7 días y nivel de servicio de 95% (z = 1,65). El lead time varía con una desviación de 2 días.',
task:'Calcula el stock de seguridad si solo varía la demanda, el ROP correspondiente, y el stock de seguridad si también varía el lead time.',
parts:[{l:'SS (solo demanda)',u:'uds',tol:0.1,fn:function(){return 1.65*12*Math.sqrt(7)}},{l:'ROP (solo demanda)',u:'uds',tol:0.1,fn:function(){return 40*7+1.65*12*Math.sqrt(7)}},{l:'SS (demanda y lead time)',u:'uds',tol:0.2,fn:function(){return 1.65*Math.sqrt(7*144+1600*4)}}],
sol:function(v){return '<p>SS = 1,65 × 12 × √7 = <b>'+fmt(v[0])+'</b> unidades. ROP = 280 + SS = <b>'+fmt(v[1])+'</b>. Con lead time variable: √(7 × 144 + 1600 × 4) = √7408 ≈ 86,07 y SS = <b>'+fmt(v[2])+'</b>. La variabilidad del proveedor casi triplica el colchón: por eso conviene mejorar el lead time antes de comprar más stock.</p>'}},
quiz:[
{q:'El ROP =',o:['d × L','d × L + SS','SS × z','σd × L'],a:1,w:'Demanda esperada en el lead time más el colchón.'},
{q:'σd de demanda mensual con un lead time en días…',o:['Está bien mezclar','Infla el stock de seguridad: usa la misma unidad','No importa','Reduce el stock'],a:1,w:'Unidades de tiempo consistentes.'},
{q:'Subir de 95% a 99% de nivel de servicio…',o:['Cuesta lo mismo','Aumenta el stock necesario más que proporcionalmente','Reduce el stock','No cambia z'],a:1,w:'z sube de 1,65 a 2,33.'}],
src:[['https://www.cleverence.com/articles/for-business/calculating-reorder-point-with-safety-stock-6283/','Cleverence: ROP, stock de seguridad y casos especiales (fuente comercial)'],['https://ecosire.com/pt/blog/eoq-safety-stock-reorder-point-guide','Ecosire: EOQ, SS y ROP: tabla de z (fuente comercial)']],
ver:['Fórmulas estándar de teoría de inventarios; las fuentes son guías comerciales, no textos académicos '+V('contrastar con un texto de gestión de operaciones'),'Nombre en español de la función de Excel para z.']},

{id:'7.4',title:'Lote económico y frecuencia de reposición',min:20,
goal:'Calcular el lote económico (EOQ) y entender su lógica y sus límites en e-commerce.',
body:`<p>El <b>lote económico de pedido (EOQ)</b> minimiza la suma del costo de pedir y del costo de mantener inventario:</p>
<pre><code>EOQ = √( 2 × D × S / H )
Costo total anual = (D / Q) × S + (Q / 2) × H</code></pre>
<p>Con <b>D</b> demanda anual, <b>S</b> costo de emitir y recibir un pedido y <b>H</b> costo de mantener una unidad un año (capital inmovilizado, espacio, seguros, obsolescencia). Responde «¿cuánto pido?», mientras que el ROP responde «¿cuándo pido?».</p>
<p>Supuestos del modelo: demanda estable, costos conocidos y constantes, sin descuentos por volumen. Los desvíos son frecuentes en e-commerce: <b>cantidades mínimas del proveedor</b>, camiones o contenedores completos, capacidad de almacén y demanda estacional. El EOQ sirve como <b>referencia</b>, no como orden. Una propiedad útil: cerca del óptimo, el costo total es poco sensible a pequeñas variaciones del lote.</p>`,
example:`<p>«Retail Andino» (ficticio) compra una licuadora a un proveedor que exige múltiplos de 100 unidades. El EOQ da 671; se pide 700, el múltiplo más cercano. La diferencia de costo es mínima.</p>`,
ex:{type:'calc',lab:{t:'Laboratorio: EOQ',fields:[{k:'D',l:'Demanda anual',v:12000},{k:'S',l:'Costo por pedido (S/)',v:150},{k:'H',l:'Costo de mantener (S/ por unidad y año)',v:8}],out:[{l:'EOQ (unidades)',f:function(v){return Math.sqrt(2*v.D*v.S/v.H)},d:1},{l:'Pedidos por año',f:function(v){return v.D/Math.sqrt(2*v.D*v.S/v.H)},d:1}]},
intro:'Demanda anual 12 000 unidades, costo de cada pedido S/ 150, costo de mantener S/ 8 por unidad por año (datos sintéticos).',
task:'Calcula el EOQ, el número de pedidos por año, el costo total anual en el EOQ y el costo total si se pide de a 1000 unidades.',
parts:[{l:'EOQ',u:'uds',tol:0.1,fn:function(){return Math.sqrt(2*12000*150/8)}},{l:'Pedidos por año',tol:0.1,fn:function(){return 12000/Math.sqrt(2*12000*150/8)}},{l:'Costo total en el EOQ',u:'S/',tol:1,fn:function(){var q=Math.sqrt(2*12000*150/8);return 12000/q*150+q/2*8}},{l:'Costo total con lotes de 1000',u:'S/',tol:0.5,fn:function(){return 12000/1000*150+1000/2*8}}],
sol:function(v){return '<p>EOQ = √(2 × 12000 × 150 / 8) = √450000 = <b>'+fmt(v[0])+'</b> unidades, unos <b>'+fmt(v[1])+'</b> pedidos al año. Costo en el EOQ = <b>S/ '+fmt(v[2],0)+'</b> (mitad pedir, mitad mantener). Con lotes de 1000 = 12 × 150 + 500 × 8 = <b>S/ '+fmt(v[3],0)+'</b>, cerca de 8% más. Poca diferencia, por eso los múltiplos comerciales rara vez rompen el modelo.</p>'}},
quiz:[
{q:'El EOQ responde…',o:['¿Cuándo pido?','¿Cuánto pido por pedido?','¿A quién compro?','¿Cuánto cuesta el flete?'],a:1,w:'El ROP responde cuándo.'},
{q:'En el EOQ óptimo, el costo de pedir y el de mantener…',o:['Son iguales','Son muy distintos','El de pedir es cero','El de mantener es cero'],a:0,w:'Se igualan en el mínimo del costo total.'},
{q:'Cantidades mínimas del proveedor…',o:['Anulan el modelo','Obligan a ajustar el EOQ al múltiplo permitido','Reducen los costos','No existen'],a:1,w:'El EOQ es una referencia.'}],
src:[['https://ecosire.com/pt/blog/eoq-safety-stock-reorder-point-guide','Ecosire: fórmula del EOQ y costo total (fuente comercial)']],
ver:['El modelo EOQ es estándar; la fuente es una guía comercial '+V('contrastar con un texto de gestión de operaciones'),'Datos sintéticos.']},

{id:'7.5',title:'Rotación, cobertura y salud del inventario',min:20,
goal:'Calcular rotación, días de inventario y cobertura, y detectar inventario inmovilizado.',
body:`<pre><code>Rotación de inventario = costo de ventas del periodo / inventario promedio
Días de inventario     = días del periodo / rotación
Cobertura (días)       = stock actual / demanda diaria promedio
Sell-through           = unidades vendidas / unidades disponibles (definición según la empresa)</code></pre>
<p>La <b>rotación</b> dice cuántas veces «se renueva» el inventario; los <b>días de inventario</b>, cuánto tarda en venderse. La <b>cobertura</b> es más operativa: si cubre menos días que el lead time, hay riesgo de quiebre. Cuidado con la base: rotación y días usan <b>costo</b>, no precio de venta.</p>
<h3>Señales de mala salud</h3>
<ul><li><b>Cobertura menor al lead time</b> en SKU A: quiebre casi seguro.</li><li><b>Stock sin movimiento</b> por un periodo definido (inventario muerto o de lenta rotación).</li><li><b>Sobrestock</b> de SKU C: capital atado sin retorno.</li><li><b>IRA bajo</b> (capítulo 6.2): el número del sistema no es confiable.</li></ul>
<p>Estas alertas se pueden automatizar (idea de cobertura baja del capítulo 10.7).</p>`,
example:`<p>Un SKU de «Retail Andino» (ficticio) tiene 900 unidades y vende 45 por día: cubre 20 días. Su proveedor tarda 14 días en reponer. El margen es de 6 días: cualquier retraso lo deja sin stock.</p>`,
ex:{type:'calc',intro:'Datos sintéticos. Costo de ventas del año: S/ 2 400 000. Inventario promedio: S/ 600 000. Un SKU tiene 900 unidades en stock, vende 45 por día y su lead time de reposición es de 14 días.',
task:'Calcula la rotación, los días de inventario (año de 365 días), la cobertura del SKU y su margen de seguridad frente al lead time (en días).',
parts:[{l:'Rotación',u:'veces',tol:0.01,fn:function(){return 2400000/600000}},{l:'Días de inventario',u:'días',tol:0.1,fn:function(){return 365/(2400000/600000)}},{l:'Cobertura del SKU',u:'días',tol:0.01,fn:function(){return 900/45}},{l:'Margen frente al lead time',u:'días',tol:0.01,fn:function(){return 900/45-14}}],
sol:function(v){return '<p>Rotación = 2 400 000 / 600 000 = <b>'+fmt(v[0])+'</b> veces al año. Días = 365/4 = <b>'+fmt(v[1])+'</b>. Cobertura = 900/45 = <b>'+fmt(v[2])+'</b> días. Frente a un lead time de 14 días, el margen es de <b>'+fmt(v[3])+'</b> días. Una rotación de 4 no es «buena» ni «mala» por sí sola: compárala con tu categoría y tu historial.</p>'}},
quiz:[
{q:'Rotación de inventario se calcula con…',o:['Ventas a precio de venta','Costo de ventas / inventario promedio','Solo unidades','El stock final'],a:1,w:'Se usa costo, no precio.'},
{q:'Cobertura menor que el lead time significa…',o:['Que sobra stock','Riesgo de quiebre antes de que llegue la reposición','Que se debe bajar el precio','Nada'],a:1,w:'El stock se acaba antes de reponer.'},
{q:'El stock sin movimiento por mucho tiempo…',o:['Es ideal','Es capital inmovilizado que hay que revisar','Aumenta la rotación','No cuenta'],a:1,w:'Candidato a liquidación o devolución al proveedor.'}],
src:[['https://www.cleverence.com/articles/for-business/what-is-abc-analysis-of-inventory-5827/','Cleverence: ABC, FSN y su uso para detectar inmovilizado (fuente comercial)']],
ver:['Definiciones de rotación, sell-through y de inventario inmovilizado: práctica general, con variantes por empresa '+V('definición interna'),'Datos sintéticos.']},

{id:'7.6',title:'Caso: preparar una campaña de alta demanda',min:20,
goal:'Encadenar demanda, personal, transporte e inventario para detectar el cuello de botella antes de que una campaña empiece.',
body:`<p><b>Situación.</b> «Retail Andino» (ficticio) prepara una campaña de tres días. Debes revisar si la operación resiste. Datos sintéticos:</p>
${T(['Dato','Valor'],[['Pedidos diarios normales','300'],['Multiplicador de campaña (por día)','2,5'],['Factor de pico del primer día','1,2'],['Capacidad contratada de última milla','900 entregas por día'],['Líneas por pedido','2,2'],['Productividad de picking','60 líneas por hora'],['Horas efectivas por turno','7'],['Ausentismo','6%'],['SKU estrella: demanda normal','60 unidades por día'],['SKU estrella: multiplicador en campaña','3'],['SKU estrella: stock actual','700 unidades'],['Lead time de reposición del SKU','7 días (no se puede acelerar)']],[1])}
<h3>Ruta de análisis</h3>
<ol><li><b>Demanda del día pico</b> = pedidos normales × multiplicador × factor de pico. Compárala con la capacidad de última milla.</li><li><b>Personal de picking</b> para el día pico (capítulo 6.3), con ausentismo.</li><li><b>SKU estrella</b>: demanda de los tres días de campaña frente al stock, y cuántos días de demanda normal cubre el saldo (capítulo 7.5).</li><li><b>Riesgo de quiebre</b> frente al lead time de reposición.</li></ol>`,
example:`<p>El mensaje para el jefe de operaciones debe ser corto: «el primer día llegamos al 100% de la capacidad de transporte, necesitamos seis pickers y el SKU estrella se queda sin stock unos cuatro días después de la campaña si no pedimos ya». Un resumen así vale más que diez tablas.</p>`,
ex:{type:'calc',intro:'',task:'Calcula el pedido pico, la utilización de la última milla, los pickers necesarios (con ausentismo, redondeados), la demanda de campaña del SKU estrella, la cobertura restante después de la campaña y los días de posible quiebre.',
parts:[{l:'Pedidos del día pico',tol:0,fn:function(){return 300*2.5*1.2}},{l:'Utilización de última milla',u:'%',tol:0.1,fn:function(){return 100*(300*2.5*1.2)/900}},{l:'Pickers necesarios',tol:0,fn:function(){return Math.ceil(300*2.5*1.2*2.2/(60*7)/0.94)}},{l:'Demanda del SKU en la campaña (3 días)',u:'uds',tol:0,fn:function(){return 60*3*3}},{l:'Cobertura tras la campaña',u:'días',tol:0.05,fn:function(){return (700-60*3*3)/60}},{l:'Días de posible quiebre',u:'días',tol:0.05,fn:function(){return 7-(700-60*3*3)/60}}],
sol:function(v){return '<p><b>1)</b> Pico = 300 × 2,5 × 1,2 = <b>'+v[0]+'</b> pedidos, o sea <b>'+fmt(v[1])+'%</b> de la capacidad de 900: sin margen. <b>2)</b> Líneas = 900 × 2,2 = 1980; productividad = 60 × 7 = 420; 1980/420 = 4,71; con 6% de ausentismo = 5,01 → <b>'+v[2]+'</b> pickers. <b>3)</b> SKU estrella: 60 × 3 × 3 = <b>'+v[3]+'</b> unidades, quedan 160, que cubren <b>'+fmt(v[4],2)+'</b> días de demanda normal. <b>4)</b> Con lead time de 7 días, hay unos <b>'+fmt(v[5],2)+'</b> días de posible quiebre.</p><h3>Decisiones</h3><ul><li><b>Transporte:</b> negociar capacidad adicional o limitar franjas del primer día.</li><li><b>Picking:</b> contratar y capacitar personal con anticipación.</li><li><b>Stock:</b> pedir ya la reposición del SKU estrella y proteger su stock en la tienda que más lo vende.</li><li><b>Control:</b> alertas de cobertura y de pedidos atorados durante la campaña (capítulo 10.7).</li></ul>'}},
quiz:[
{q:'Si el primer día usa 100% de la capacidad de transporte, el riesgo es…',o:['Ninguno','Que cualquier imprevisto genere retrasos','Que sobre capacidad','Que baje el costo'],a:1,w:'No hay margen para absorber variaciones.'},
{q:'¿Cuándo debe decidirse la reposición de un SKU estrella con lead time de 7 días?',o:['El último día de la campaña','Antes de la campaña','Al terminar el stock','Nunca'],a:1,w:'Después ya no hay tiempo de compensar.'},
{q:'¿Qué resume mejor un análisis para el jefe de operaciones?',o:['Diez tablas sin conclusión','Los cuellos de botella con cifras y una decisión propuesta','Solo gráficos','Solo la fórmula'],a:1,w:'Cifra, riesgo y acción.'}],
src:[['https://www.cleverence.com/articles/for-business/calculating-reorder-point-with-safety-stock-6283/','Cleverence: ROP y lead time (fuente comercial)']],
ver:['El caso es didáctico y todas las cifras son inventadas.','La lógica reúne fórmulas de los capítulos 6.3, 7.3 y 7.5.']}
]});

{id:'8.1',title:'Modelo de datos para operaciones: hechos y dimensiones',min:18,
goal:'Clasificar campos como hechos o dimensiones, elegir el grano de una tabla y evitar el error de sumar de más.',
body:`<p>La guía de Microsoft para Power BI recomienda el <b>esquema en estrella</b>: las <b>dimensiones</b> describen entidades (tienda, producto, fecha, seller) y sirven para <b>filtrar y agrupar</b>; los <b>hechos</b> registran eventos o mediciones (pedidos, entregas, movimientos de stock) y sirven para <b>resumir</b>. Las relaciones suelen ser de uno a muchos, de la dimensión al hecho. La dimensión más constante de todas es la de <b>fecha</b>.</p>
<h3>El grano</h3>
<p>El <b>grano</b> es lo que representa una fila. Decídelo antes de nada:</p>
${T(['Tabla de hechos','Una fila es…','Sirve para'],[
['Pedidos','Un pedido','On Time, cancelación, ticket'],
['Líneas de pedido','Un producto dentro de un pedido','Fill Rate por unidades, productos más cancelados'],
['Historial de estados','Un cambio de estado con hora','Antigüedad en estado, cuellos de botella'],
['Stock (foto diaria)','Un SKU por tienda por día','Quiebres, desalineación'],
['Incidencias','Una incidencia','Pareto de causas, tiempo de resolución']])}
<p>Errores comunes: mezclar granos en una misma tabla y sumar un monto de pedido después de unirlo a las líneas (se repite una vez por línea y el total se infla). Esa es la trampa del <b>abanico</b> (fan-out) en un JOIN uno a muchos.</p>
<p>Si ya diseñaste un modelo con dimensiones y hechos para tu proyecto Origen, úsalo como ejemplo en entrevistas: explica el grano de cada tabla y por qué.</p>`,
example:`<p>«Retail Andino» (ficticio) reporta ventas de 1300 soles un día en que la caja dice 600. La causa: el monto del pedido se unió a la tabla de líneas y se sumó por cada línea. El arreglo es sumar el monto en la tabla de pedidos, o repartirlo por línea desde el origen.</p>`,
ex:{type:'match',intro:'¿Es un hecho o una dimensión?',opts:['Hecho (se suma o se cuenta)','Dimensión (filtra o agrupa)'],items:[
{t:'Monto del pedido',a:'Hecho (se suma o se cuenta)'},
{t:'Unidades entregadas',a:'Hecho (se suma o se cuenta)'},
{t:'Horas que estuvo el pedido en un estado',a:'Hecho (se suma o se cuenta)'},
{t:'Nombre de la tienda',a:'Dimensión (filtra o agrupa)'},
{t:'Categoría del producto',a:'Dimensión (filtra o agrupa)'},
{t:'Mes y día de la semana',a:'Dimensión (filtra o agrupa)'},
{t:'Descripción del motivo de cancelación',a:'Dimensión (filtra o agrupa)'}],
sol:'<p>Bien. Regla práctica: si lo sumas o promedias, es un hecho; si lo usas para cortar, es una dimensión.</p>',
also:{type:'calc',intro:'Abanico: tres pedidos con su monto y su número de líneas (datos sintéticos).',cols:['Pedido','Monto del pedido (S/)','Líneas'],rows:[['P1',300,3],['P2',200,1],['P3',100,2]],num:[1,2],
task:'Calcula la suma correcta de montos, la suma que resulta si unes a las líneas y la sumas por cada línea, y cuántas veces se infla.',
parts:[{l:'Suma correcta',u:'S/',tol:0,fn:function(r){return r.reduce(function(a,x){return a+x[1]},0)}},{l:'Suma inflada',u:'S/',tol:0,fn:function(r){return r.reduce(function(a,x){return a+x[1]*x[2]},0)}},{l:'Factor de inflado',u:'veces',tol:0.01,fn:function(r){var c=0,i=0;r.forEach(function(x){c+=x[1];i+=x[1]*x[2]});return i/c}}],
sol:function(v){return '<p>Correcto: <b>S/ '+v[0]+'</b>. Inflado: 300×3 + 200×1 + 100×2 = <b>S/ '+v[1]+'</b>, unas <b>'+fmt(v[2],2)+'</b> veces. Antes de sumar después de un JOIN, comprueba el grano y cuenta filas.</p>'}}},
quiz:[
{q:'En un esquema en estrella, las dimensiones sirven para…',o:['Sumar montos','Filtrar y agrupar','Guardar contraseñas','Emitir comprobantes'],a:1,w:'Y los hechos, para resumir.'},
{q:'¿Qué es el «grano» de una tabla de hechos?',o:['El tamaño del archivo','Lo que representa una fila','El color','El número de columnas'],a:1,w:'Se define antes de construir el modelo.'},
{q:'Sumaste un monto de pedido tras unirlo a las líneas y el total se duplicó. Causa probable:',o:['Error de tipeo','Fan-out por unir un uno-a-muchos','Falla del servidor','El IGV'],a:1,w:'El monto se repite por cada línea.'}],
src:[['https://learn.microsoft.com/power-bi/guidance/star-schema','Microsoft Learn: esquema en estrella y su importancia para Power BI'],['https://learn.microsoft.com/en-us/training/modules/build-power-bi-report/2-build-data-model','Microsoft Learn: construir el modelo de datos']],
ver:['Los granos propuestos son una guía didáctica; el diseño final depende de tus preguntas de negocio.']},

{id:'8.2',title:'SQL analítico: JOIN, CTE y funciones de ventana',min:20,
goal:'Escribir consultas que respondan preguntas de operaciones: tendencias, rankings y comparaciones con el día anterior.',
body:`<p>Además de <code>GROUP BY</code>, hay tres herramientas que un analista usa todos los días.</p>
<h3>CTE: dividir en pasos legibles</h3>
<pre><code>WITH diario AS (
  SELECT CAST(fecha AS date) AS dia,
         COUNT(*) AS creados,
         SUM(CASE WHEN estado = 'Cancelado' THEN 1 ELSE 0 END) AS cancelados
  FROM pedidos
  GROUP BY CAST(fecha AS date)
)
SELECT dia, creados, cancelados,
       CAST(100.0 * cancelados / creados AS DECIMAL(5,1)) AS pct_cancel,
       LAG(cancelados) OVER (ORDER BY dia) AS cancelados_dia_anterior,
       SUM(cancelados) OVER (ORDER BY dia ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cancelados_acum
FROM diario
ORDER BY dia;</code></pre>
<p><code>LAG</code> accede a una fila anterior del mismo resultado sin auto-JOIN; en su forma <code>OVER (PARTITION BY ... ORDER BY ...)</code> el <code>ORDER BY</code> es obligatorio. Con <code>PARTITION BY</code> reinicias el cálculo por grupo (por tienda, por ejemplo).</p>
<h3>Top N por grupo con ROW_NUMBER</h3>
<pre><code>SELECT tienda, sku, cancelaciones
FROM (
  SELECT tienda, sku, COUNT(*) AS cancelaciones,
         ROW_NUMBER() OVER (PARTITION BY tienda ORDER BY COUNT(*) DESC) AS rn
  FROM pedidos
  WHERE estado = 'Cancelado'
  GROUP BY tienda, sku
) t
WHERE rn &lt;= 3;</code></pre>
<h3>Percentil por modalidad</h3>
<pre><code>SELECT DISTINCT modalidad,
       PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY horas_entrega)
         OVER (PARTITION BY modalidad) AS p90_horas
FROM entregas;</code></pre>
<h3>JOIN sin trampas</h3>
<ul><li><code>INNER JOIN</code> descarta filas sin pareja; <code>LEFT JOIN</code> las conserva.</li><li>Si haces <code>LEFT JOIN</code> y luego filtras en <code>WHERE</code> una columna de la tabla derecha, lo conviertes en un INNER JOIN; pon la condición en el <code>ON</code>.</li><li>Cuenta filas antes y después de cada JOIN (capítulo 8.1).</li></ul>`,
example:`<p>Tu jefe pregunta: «¿en qué tienda se repiten las mismas cancelaciones?». Con el Top 3 por tienda ves los SKU que más se cancelan en cada una, y si un SKU aparece en varias tiendas, sospechas de un problema de catálogo o de stock del proveedor.</p>`,
ex:{type:'calc',intro:'Resultado del CTE diario de la consulta anterior (datos sintéticos).',cols:['dia','creados','cancelados'],rows:[['01',20,1],['02',25,2],['03',22,0],['04',30,4]],num:[1,2],
task:'¿Qué devuelven las columnas calculadas en la fila del día 04?',
parts:[{l:'cancelados_dia_anterior',tol:0,fn:function(r){return r[2][2]}},{l:'cancelados_acum',tol:0,fn:function(r){return r.reduce(function(a,x){return a+x[2]},0)}},{l:'pct_cancel',u:'%',tol:0.1,fn:function(r){return 100*r[3][2]/r[3][1]}}],
sol:function(v){return '<p>En el día 04, <code>LAG</code> trae los cancelados del día 03 = <b>'+v[0]+'</b>. El acumulado 1+2+0+4 = <b>'+v[1]+'</b>. El porcentaje = 4/30 = <b>'+fmt(v[2])+'%</b>. En la fila del día 01, <code>LAG</code> devuelve NULL porque no hay día anterior.</p>'}},
quiz:[
{q:'¿Qué hace <code>LAG(cancelados) OVER (ORDER BY dia)</code>?',o:['Suma los cancelados','Devuelve el valor de la fila anterior según el orden','Borra la fila','Ordena la tabla al final'],a:1,w:'Compara la fila actual con la anterior.'},
{q:'LEFT JOIN + WHERE sobre una columna de la tabla derecha…',o:['Mantiene todas las filas siempre','Puede convertirlo en un INNER JOIN','No cambia nada','Es un error de sintaxis'],a:1,w:'Filtra las filas sin pareja (NULL). Pon la condición en el ON.'},
{q:'Para «los 3 SKU con más cancelaciones por tienda» usas…',o:['ROW_NUMBER() OVER (PARTITION BY tienda ORDER BY COUNT(*) DESC)','Solo COUNT','Solo SUM','UNION'],a:0,w:'Numeras dentro de cada grupo.'}],
src:[['https://learn.microsoft.com/pl-pl/sql/t-sql/functions/lag-transact-sql','Microsoft Learn: LAG (Transact-SQL)']],
ver:['Sintaxis de PERCENTILE_CONT y de la ventana con ROWS según tu versión de SQL Server: '+V('probar en tu servidor')]},

{id:'8.3',title:'DAX esencial sin miedo: medidas para operaciones',min:20,
goal:'Escribir las medidas básicas de un tablero de operaciones y entender por qué cambian según el filtro.',
body:`<p>Una <b>medida</b> en Power BI es una fórmula que se recalcula según los filtros del visual (tienda, fecha, categoría). Una <b>columna calculada</b> se calcula fila por fila al cargar los datos. Regla práctica: si necesitas un porcentaje, un total o una comparación, usa una medida; si necesitas etiquetar filas (a tiempo sí o no), usa una columna, mejor creada en Power Query.</p>
<pre><code>Pedidos            = COUNTROWS(Pedidos)
Cancelados         = CALCULATE([Pedidos], Pedidos[estado] = "Cancelado")
% Cancelación      = DIVIDE([Cancelados], [Pedidos])
Entregados         = CALCULATE([Pedidos], Pedidos[estado] = "Entregado")
A tiempo           = CALCULATE(SUM(Pedidos[a_tiempo]), Pedidos[estado] = "Entregado")
% On Time          = DIVIDE([A tiempo], [Entregados])
% On Time sem. ant.= CALCULATE([% On Time], DATEADD(Calendario[Fecha], -7, DAY))
Variación (pp)     = [% On Time] - [% On Time sem. ant.]</code></pre>
<p>Ideas clave:</p>
<ul><li><code>CALCULATE</code> evalúa una medida cambiando el filtro.</li><li><code>DIVIDE</code> evita errores por cero.</li><li>Las comparaciones de fechas (<code>DATEADD</code>) requieren una tabla <b>Calendario</b> continua, marcada como tabla de fechas ${V('requisitos de la tabla de fechas en tu versión')}.</li><li>Guarda las medidas en una tabla propia («Medidas») para tenerlas ordenadas.</li></ul>
<p>Las medidas deben coincidir con la definición de KPI del capítulo 3.1. Anota la definición en la descripción de cada medida.</p>`,
example:`<p>El mismo <code>% On Time</code> muestra 88% en la tarjeta general, y al elegir «Surco» en el segmentador muestra 82%. No cambiaste la fórmula: cambió el filtro. Eso es el <b>contexto de filtro</b>, y explica la mayoría de sorpresas al empezar con DAX.</p>`,
ex:{type:'reveal',intro:'Ejercicio de escritura. Usa tu tabla <code>Pedidos</code> con las columnas del CSV.',task:'Escribe (a) la medida de % OTIF y (b) la medida de participación de cada tienda en el total de cancelaciones.',
sol:'<p><b>(a)</b> Primero, en Power Query, una columna <code>otif</code>:</p><pre><code>if [estado]="Entregado" and [entrega] &lt;= [prometida] and [uds_ent] = [uds] then 1 else 0</code></pre><pre><code>% OTIF = DIVIDE(SUM(Pedidos[otif]), [Entregados])</code></pre><p><b>(b)</b> Con la medida <code>Cancelados</code> de arriba:</p><pre><code>% del total de cancelados =\nDIVIDE([Cancelados], CALCULATE([Cancelados], ALL(Pedidos[tienda])))</code></pre><p><code>ALL</code> quita el filtro de tienda en el denominador, así cada tienda se compara con el total de cancelaciones. Verifica la sintaxis en tu Power BI.</p>'},
quiz:[
{q:'Una medida frente a una columna calculada:',o:['La medida se calcula una vez al cargar','La medida se recalcula según el filtro del visual','Son idénticas','La medida no puede dividir'],a:1,w:'Por eso reacciona a los segmentadores.'},

{id:'8.4',title:'Diseño de un dashboard operativo que se lee en 10 segundos',min:18,
goal:'Diseñar un tablero que responda preguntas concretas, con los visuales adecuados y sin ruido.',
body:`<p><b>Empieza por la decisión</b>, no por el gráfico: ¿quién lo mira, cada cuánto, y qué acción debe poder tomar? Un tablero para el jefe de operaciones (diario, excepciones) es distinto de uno para gerencia (semanal, tendencia) y del de un seller (sus pedidos).</p>
<div class="wire" aria-label="Boceto de dashboard operativo"><div class="w4"><b>Filtros:</b> fecha, tienda, bandera, canal, modalidad</div><div>Pedidos<br><small>vs sem. ant.</small></div><div>On Time<br><small>vs meta / sem. ant.</small></div><div>Cancelación<br><small>vs sem. ant.</small></div><div>OTIF<br><small>vs sem. ant.</small></div><div class="w2">Tendencia diaria de On Time con límites de control</div><div class="w2">Cancelaciones por motivo (barras ordenadas)</div><div class="w2">Matriz tienda × categoría (mapa de calor)</div><div class="w2">Tabla de excepciones: pedidos atorados, con formato condicional</div></div>
<h3>Reglas de diseño (criterios propios, no una norma)</h3>
<ul><li><b>Una página, una pregunta.</b> Si necesitas explicar la página con más de dos frases, divídela.</li><li><b>KPIs con contexto:</b> valor, comparación y denominador escritos. Un número solo no dice si es bueno.</li><li><b>Barras ordenadas</b> para rankings, <b>líneas</b> para tiempo, <b>tabla</b> para casos concretos. Evita gráficos circulares con muchas categorías.</li><li><b>Color solo para señalar</b> (semáforo, excepción) y con cuidado para personas con daltonismo; agrega iconos o texto.</li><li><b>Definiciones a un clic:</b> descripción del KPI en la información sobre herramientas.</li><li><b>Menos visuales:</b> cada uno debe responder una pregunta.</li></ul>
<p>Looker Studio aplica los mismos principios y suele ser más simple para fuentes como Hojas de cálculo de Google ${V('conectores y límites vigentes')}. Si ya sabes uno, aprende las ideas: cambian los botones, no el criterio.</p>`,
example:`<p>El jefe de operaciones de «Retail Andino» (ficticio) abre el tablero a las 8:30. En diez segundos quiere saber si hoy hay algo que atender: las tarjetas le dicen que la cancelación subió, la matriz le muestra dónde, y la tabla de excepciones le da los pedidos a los que debe llamar.</p>`,
ex:{type:'match',intro:'Une cada pregunta con el visual más adecuado.',opts:['Tarjeta KPI','Línea de tendencia','Barras ordenadas','Matriz o mapa de calor','Tabla de excepciones'],items:[
{t:'¿Cómo va el On Time de hoy frente a la semana pasada?',a:'Tarjeta KPI'},
{t:'¿Cómo evoluciona la cancelación día a día?',a:'Línea de tendencia'},
{t:'¿Qué motivo explica más cancelaciones?',a:'Barras ordenadas'},
{t:'¿En qué tienda y categoría se concentra el problema?',a:'Matriz o mapa de calor'},
{t:'¿A qué pedidos debo llamar hoy?',a:'Tabla de excepciones'}],
sol:'<p>Bien. Con esas cinco piezas ya tienes el esqueleto del tablero del caso final.</p>'},
quiz:[
{q:'Antes de elegir gráficos, definimos…',o:['La paleta de colores','Quién lo usa y qué decisión toma','El tamaño de la pantalla','El logo'],a:1,w:'La decisión manda.'},
{q:'Para mostrar el ranking de motivos de cancelación usas…',o:['Un gráfico circular con 12 porciones','Barras ordenadas','Un mapa','Una línea'],a:1,w:'Las barras ordenadas se comparan mejor.'},
{q:'Un KPI sin comparación ni denominador…',o:['Es suficiente','No permite saber si el valor es bueno ni cómo se calculó','Es mejor','Es ilegal'],a:1,w:'Falta contexto.'}],
src:[['https://learn.microsoft.com/power-bi/guidance/star-schema','Microsoft Learn: guía de modelado (base para tableros consistentes)']],
ver:['Las reglas de diseño son criterios de práctica, sin norma formal. Detalles de Looker Studio (conectores, límites, precios): '+V('documentación de Google')]}
]});

MODS.push({id:'11',grp:'tools',title:'11. Integración y proyecto final',short:'Alertas, automatización y proyecto de portafolio',blurb:'Une datos, dashboards y automatización en un proyecto guiado para tu portafolio.',ch:[
{id:'11.1',title:'Actualización, alertas y Power BI con Power Automate',min:20,
goal:'Mantener el tablero actualizado y conectar una alerta de Power BI con un flujo que avise y registre.',
body:`<h3>Actualización de datos</h3>
<ul><li>Con modo <b>Importar</b> los datos se guardan en el modelo y se actualizan por horario. Con <b>DirectQuery</b> o conexión en vivo, la mayoría de los datos no dependen de la actualización programada.</li><li>Para una base <b>SQL Server local</b> hace falta una <b>puerta de enlace de datos</b> (gateway); Microsoft tiene un tutorial paso a paso.</li><li>En capacidad compartida hay un máximo de horarios diarios de actualización (la documentación menciona hasta ocho) y la actualización programada se pausa tras dos meses de inactividad del modelo ${V('límites vigentes según licencia')}.</li><li>Power BI no ofrece intervalo mensual; con Power Automate puedes crear uno personalizado.</li></ul>
<h3>Alertas de datos</h3>
<p>Las alertas se crean en el <b>servicio</b> de Power BI (no en Desktop), sobre mosaicos de un <b>dashboard</b> anclados desde visuales de tipo <b>tarjeta, KPI o medidor</b>. Puedes integrarlas con Power Automate: el disparador «Cuando se activa una alerta basada en datos» arranca un flujo que envía a Teams, correo o crea un elemento en una lista. Límites documentados: hasta 250 alertas por persona y sin co-propiedad (si cambias de dueño hay que recrear la alerta y el flujo) ${V('licencias necesarias para usar alertas con Power Automate')}.</p>
<h3>Cuidado con la fatiga de alertas</h3>
<p>Microsoft advierte que el uso excesivo de alertas degrada la efectividad de un flujo. Para evitarlo: umbrales basados en el <b>límite de control</b> (capítulo 9.5), no en la intuición; una alerta por problema, no cinco; un dueño claro; y revisar trimestralmente cuáles se ignoran.</p>`,
example:`<p>«Retail Andino» (ficticio) fija una alerta cuando el On Time diario cae por debajo del LCL. El flujo publica en el canal de operaciones y crea una incidencia en la lista de incidencias con estado «Nuevo». Así cierras el ciclo del capítulo 10.1: la alerta se convierte en un registro con responsable.</p>`,
ex:{type:'flow',intro:'Flujo de referencia: de la alerta de Power BI a una incidencia registrada.',steps:[
{k:'trigger',t:'Cuando se activa una alerta basada en datos (Power BI)',d:'Elige la alerta creada sobre la tarjeta de On Time del dashboard. Recuerda que las alertas no se crean en Desktop.'},
{k:'action',t:'Obtener el valor y la hora',d:'Usa el contenido dinámico de la alerta y <code>convertTimeZone(...)</code> para hora de Lima.'},
{k:'cond',t:'¿Valor bajo el umbral crítico?',d:'Sí: avisa al canal y crea incidencia. No: solo registra, sin avisar (evita ruido).'},
{k:'action',t:'Publicar mensaje en Teams',d:'Incluye KPI, valor, umbral y enlace al tablero. Sin datos personales.'},
{k:'action',t:'Crear elemento en la lista de incidencias',d:'Categoría «Alerta de KPI», estado «Nuevo», responsable de turno.'},
{k:'end',t:'Resultado: alerta con dueño y trazabilidad',d:'Falta el bloque Try/Catch del capítulo 10.5 para saber si el flujo falla.'}],
task:'Define umbral, destinatarios y horario para no generar fatiga de alertas.',
sol:'<ul><li><b>Umbral:</b> el LCL del On Time diario calculado con un periodo estable (capítulo 9.5), no un número «que se ve mal».</li><li><b>Destinatarios:</b> el responsable de turno primero; escalar al jefe si no se atiende en un tiempo definido.</li><li><b>Horario:</b> solo en horario operativo, y una sola alerta por día por el mismo problema.</li><li><b>Revisión:</b> cada trimestre, retirar las alertas que nadie usa.</li></ul>'},
quiz:[
{q:'¿Dónde se crean las alertas de datos de Power BI?',o:['En Power BI Desktop','En el servicio de Power BI, sobre mosaicos de un dashboard','En Excel','En Outlook'],a:1,w:'No están disponibles en Desktop.'},
{q:'Para actualizar automáticamente datos desde una base SQL Server local se usa…',o:['Una puerta de enlace de datos','Un correo','Un PDF','Nada'],a:0,w:'El gateway conecta el servicio con la fuente local.'},
{q:'¿Cómo reduces la fatiga de alertas?',o:['Más alertas','Umbrales basados en límites de control, un dueño y revisión periódica','Alertas cada minuto','Sin dueño'],a:1,w:'Menos alertas, mejor definidas.'}],
src:[['https://learn.microsoft.com/en-us/power-bi/refresh-scheduled-refresh','Microsoft Learn: actualización programada de Power BI'],['https://learn.microsoft.com/en-us/power-bi/connect-data/service-gateway-sql-tutorial','Microsoft Learn: actualizar desde SQL Server local con gateway'],['https://learn.microsoft.com/en-nz/power-bi/create-reports/service-set-data-alerts','Microsoft Learn: alertas de datos en el servicio de Power BI'],['https://learn.microsoft.com/en-us/power-automate/guidance/coding-guidelines/error-handling','Microsoft Learn: advertencia sobre uso excesivo de alertas']],
ver:['Requisitos de licencia (Pro, Premium) para alertas con Power Automate: '+V('consultar la documentación y a TI'),'Nombres de los disparadores y acciones de Power BI en el conector de Power Automate: '+V('probar en tu entorno')]},

{id:'11.2',title:'Mini proyecto integrador: incidencias de punta a punta',min:20,
goal:'Armar una pieza de portafolio que una Forms, Lists, Power Automate, un modelo de datos y Power BI, con datos ficticios.',
body:`<p>Este capítulo no explica algo nuevo: te pide <b>construir</b>. Es el proyecto que puedes enseñar en una entrevista y que demuestra juntos los módulos de datos, estadística y automatización.</p>
<p><b>El caso:</b> un retailer ficticio necesita registrar incidencias operativas, medir cuánto tardan en resolverse y alertar cuando algo se sale de lo normal.</p>
<h3>Reglas del proyecto</h3>
<ul><li><b>Datos ficticios.</b> Genera unas 200 incidencias con una historia oculta (por ejemplo, una causa que se concentra en una tienda desde cierta fecha). No uses datos reales de ningún empleador.</li><li><b>Sin datos personales.</b> Número de pedido ficticio, sin nombres ni teléfonos.</li><li><b>Documenta límites.</b> Qué no hace tu proyecto y qué asumiste.</li></ul>
<h3>Cómo presentarlo (90 segundos)</h3>
<p><b>Problema</b> (una frase), <b>solución</b> (Forms + Lists + flujo + tablero), <b>resultado medible</b> (tiempo de registro, tiempo medio y p90 de resolución) y <b>aprendizaje</b> (qué harías distinto). Si lo puedes contar sin mirar la pantalla, lo dominas.</p>`,
example:`<p>Entrevistador: «¿Qué construiste con Power Automate?» Tú: «Un flujo que registra incidencias desde un formulario en una lista con causa, tienda y severidad, y avisa al responsable. Sobre esa lista armé un tablero con un Pareto de causas y una alerta basada en límites de control. Con datos ficticios, el registro pasó de unos 4 minutos a 1. Lo que haría distinto: añadir un cierre de ciclo con aprobación para las incidencias graves.»</p>`,
ex:{type:'check',id:'11.2',intro:'Checklist del proyecto. Marca a medida que avances.',items:[
'Definí el problema y quién usará el tablero, y qué decisión tomará',
'Formulario con listas desplegables y sin datos personales',
'Lista con columnas tipadas: categoría, causa, tienda, severidad, estado, fecha de registro y de cierre',
'Flujo con Try/Catch, aviso de error y ficha del flujo',
'Datos ficticios suficientes (unas 200 filas) con una concentración que se pueda descubrir',
'Modelo simple: hecho de incidencias más dimensiones de fecha, tienda, categoría y causa',
'Medidas: total, % por causa, tiempo medio y p90 de resolución, variación frente a la semana anterior',
'Tablero de una página con filtros, tarjetas, tendencia, Pareto y tabla de excepciones',
'Alerta con umbral basado en un límite de control, conectada a un flujo',
'README: problema, decisiones, límites, datos ficticios y cómo reproducirlo',
'Guion de 90 segundos ensayado en voz alta'],
also:{type:'reveal',intro:'Cuando termines, compara tu enfoque.',task:'¿Qué historia oculta pondrías en los datos ficticios para que el análisis tenga algo que descubrir?',
sol:'<p>Ideas: una causa («producto sin ubicar») que se concentra en una tienda y una categoría a partir de una fecha; un aumento del tiempo de resolución en un turno; o un responsable que acumula incidencias abiertas. Lo importante es que <b>la historia exista y esté oculta</b>, para que tu tablero y tu análisis la descubran, como en el caso final del curso base.</p>'}},
quiz:[
{q:'¿Puedes usar datos reales de un empleador anterior en tu proyecto?',o:['Sí','No; usa datos ficticios','Solo los de este año','Solo sin fechas'],a:1,w:'Confidencialidad y riesgo legal.'},
{q:'Un buen resultado para el proyecto es…',o:['«Quedó bonito»','Un dato medible, como el tiempo de registro o de resolución','Muchas páginas','Muchos colores'],a:1,w:'Concreto y verificable.'},
{q:'¿Qué añade valor a un proyecto de portafolio?',o:['Ocultar los límites','Explicar decisiones y límites con honestidad','Copiar plantillas sin entenderlas','Usar muchos visuales'],a:1,w:'Muestra criterio.'}],
src:[['https://learn.microsoft.com/power-bi/guidance/star-schema','Microsoft Learn: esquema en estrella'],['https://learn.microsoft.com/en-us/power-automate/guidance/coding-guidelines/error-handling','Microsoft Learn: manejo de errores'],['https://learn.microsoft.com/en-nz/power-bi/create-reports/service-set-data-alerts','Microsoft Learn: alertas de datos']],
ver:['Cómo conectar Power BI a una lista de SharePoint o de Microsoft Lists en tu tenant: '+V('probar en tu entorno')]}
]});
var LT15=[22,24,25,26,26,27,28,28,29,30,31,33,36,48,96];
var LT10=[30,32,33,35,36,38,40,41,44,150];
function me95(p,n){return 100*1.96*Math.sqrt(p*(1-p)/n)}
function surcoRows(d,post){return d.filter(function(r){return r.tienda==='Surco'&&(post?r.fecha>='2026-09-08':r.fecha<'2026-09-08')})}
