{id:'9.3',title:'DAX esencial sin miedo: medidas para operaciones',min:20,
goal:'Escribir las medidas básicas de un tablero de operaciones y entender por qué cambian según el filtro.',
body:`<p>Una <b>medida</b> en Power BI es una fórmula que se recalcula según los filtros del visual (tienda, fecha, categoría). Una <b>columna calculada</b> se calcula fila por fila al cargar los datos. Regla práctica: si necesitas un porcentaje, un total o una comparación, usa una medida; si necesitas etiquetar filas (a tiempo sí o no), usa una columna, mejor creada en Power Query.</p>
<pre><code>Pedidos            = COUNTROWS(Pedidos)
Cancelados         = CALCULATE([Pedidos], Pedidos[estado] = "Cancelado")
% Cancelación      = DIVIDE([Cancelados], [Pedidos])
Entregados         = CALCULATE([Pedidos], Pedidos[estado] = "Entregado")
A tiempo           = CALCULATE(SUM(Pedidos[a_tiempo]), Pedidos[estado] = "Entregado")
% On Time          = DIVIDE([A tiempo], [Entregados])
% On Time sem. ant.= CALCULATE([% On Time], DATEADD(Calendario[Fecha], -7, DAY))
Variación (pp)     = [% On Time] - [% On Time sem. ant.]</code></pre>
<p>Ideas clave:</p>
<ul><li><code>CALCULATE</code> evalúa una medida cambiando el filtro.</li><li><code>DIVIDE</code> evita errores por cero.</li><li>Las comparaciones de fechas (<code>DATEADD</code>) requieren una tabla <b>Calendario</b> continua, marcada como tabla de fechas ${V('requisitos de la tabla de fechas en tu versión')}.</li><li>Guarda las medidas en una tabla propia («Medidas») para tenerlas ordenadas.</li></ul>
<p>Las medidas deben coincidir con la definición de KPI del capítulo 3.1. Anota la definición en la descripción de cada medida.</p>`,
example:`<p>El mismo <code>% On Time</code> muestra 88% en la tarjeta general, y al elegir «Surco» en el segmentador muestra 82%. No cambiaste la fórmula: cambió el filtro. Eso es el <b>contexto de filtro</b>, y explica la mayoría de sorpresas al empezar con DAX.</p>`,
ex:{type:'reveal',intro:'Ejercicio de escritura. Usa tu tabla <code>Pedidos</code> con las columnas del CSV.',task:'Escribe (a) la medida de % OTIF y (b) la medida de participación de cada tienda en el total de cancelaciones.',
sol:'<p><b>(a)</b> Primero, en Power Query, una columna <code>otif</code>:</p><pre><code>if [estado]="Entregado" and [entrega] &lt;= [prometida] and [uds_ent] = [uds] then 1 else 0</code></pre><pre><code>% OTIF = DIVIDE(SUM(Pedidos[otif]), [Entregados])</code></pre><p><b>(b)</b> Con la medida <code>Cancelados</code> de arriba:</p><pre><code>% del total de cancelados =\nDIVIDE([Cancelados], CALCULATE([Cancelados], ALL(Pedidos[tienda])))</code></pre><p><code>ALL</code> quita el filtro de tienda en el denominador, así cada tienda se compara con el total de cancelaciones. Verifica la sintaxis en tu Power BI.</p>'},
quiz:[
{q:'Una medida frente a una columna calculada:',o:['La medida se calcula una vez al cargar','La medida se recalcula según el filtro del visual','Son idénticas','La medida no puede dividir'],a:1,w:'Por eso reacciona a los segmentadores.'},
{q:'¿Para qué sirve <code>DIVIDE</code>?',o:['Para restar','Para dividir sin errores por cero','Para filtrar','Para ordenar'],a:1,w:'Devuelve vacío o un valor alterno en lugar de un error.'},
{q:'La comparación con la semana anterior (<code>DATEADD</code>) requiere…',o:['Solo la tabla de pedidos','Una tabla Calendario continua marcada como tabla de fechas','Excel','Un premium'],a:1,w:'Sin una tabla de fechas adecuada, los resultados no son fiables.'}],
src:[['https://learn.microsoft.com/power-bi/guidance/star-schema','Microsoft Learn: medidas explícitas e implícitas en el modelo']],
ver:['Sintaxis DAX y comportamiento de DATEADD en tu versión de Power BI: '+V('probar en tu Power BI Desktop')]},

{id:'9.4',title:'Diseño de un dashboard operativo que se lee en 10 segundos',min:18,
goal:'Diseñar un tablero que responda preguntas concretas, con los visuales adecuados y sin ruido.',
body:`<p><b>Empieza por la decisión</b>, no por el gráfico: ¿quién lo mira, cada cuánto, y qué acción debe poder tomar? Un tablero para el jefe de operaciones (diario, excepciones) es distinto de uno para gerencia (semanal, tendencia) y del de un seller (sus pedidos).</p>
<div class="wire" aria-label="Boceto de dashboard operativo"><div class="w4"><b>Filtros:</b> fecha, tienda, bandera, canal, modalidad</div><div>Pedidos<br><small>vs sem. ant.</small></div><div>On Time<br><small>vs meta / sem. ant.</small></div><div>Cancelación<br><small>vs sem. ant.</small></div><div>OTIF<br><small>vs sem. ant.</small></div><div class="w2">Tendencia diaria de On Time con límites de control</div><div class="w2">Cancelaciones por motivo (barras ordenadas)</div><div class="w2">Matriz tienda × categoría (mapa de calor)</div><div class="w2">Tabla de excepciones: pedidos atorados, con formato condicional</div></div>
<h3>Reglas de diseño (criterios propios, no una norma)</h3>
<ul><li><b>Una página, una pregunta.</b> Si necesitas explicar la página con más de dos frases, divídela.</li><li><b>KPIs con contexto:</b> valor, comparación y denominador escritos. Un número solo no dice si es bueno.</li><li><b>Barras ordenadas</b> para rankings, <b>líneas</b> para tiempo, <b>tabla</b> para casos concretos. Evita gráficos circulares con muchas categorías.</li><li><b>Color solo para señalar</b> (semáforo, excepción) y con cuidado para personas con daltonismo; agrega iconos o texto.</li><li><b>Definiciones a un clic:</b> descripción del KPI en la información sobre herramientas.</li><li><b>Menos visuales:</b> cada uno debe responder una pregunta.</li></ul>
<p>Looker Studio aplica los mismos principios y suele ser más simple para fuentes como Hojas de cálculo de Google ${V('conectores y límites vigentes')}. Si ya sabes uno, aprende las ideas: cambian los botones, no el criterio.</p>`,
example:`<p>El jefe de operaciones de «Retail Andino» (ficticio) abre el tablero a las 8:30. En diez segundos quiere saber si hoy hay algo que atender: las tarjetas le dicen que la cancelación subió, la matriz le muestra dónde, y la tabla de excepciones le da los pedidos a los que debe llamar.</p>`,
ex:{type:'match',intro:'Une cada pregunta con el visual más adecuado.',opts:['Tarjeta KPI','Línea de tendencia','Barras ordenadas','Matriz o mapa de calor','Tabla de excepciones'],items:[
{t:'¿Cómo va el On Time de hoy frente a la semana pasada?',a:'Tarjeta KPI'},
{t:'¿Cómo evoluciona la cancelación día a día?',a:'Línea de tendencia'},
{t:'¿Qué motivo explica más cancelaciones?',a:'Barras ordenadas'},
{t:'¿En qué tienda y categoría se concentra el problema?',a:'Matriz o mapa de calor'},
{t:'¿A qué pedidos debo llamar hoy?',a:'Tabla de excepciones'}],
sol:'<p>Bien. Con esas cinco piezas ya tienes el esqueleto del tablero del caso final.</p>'},
quiz:[
{q:'Antes de elegir gráficos, definimos…',o:['La paleta de colores','Quién lo usa y qué decisión toma','El tamaño de la pantalla','El logo'],a:1,w:'La decisión manda.'},
{q:'Para mostrar el ranking de motivos de cancelación usas…',o:['Un gráfico circular con 12 porciones','Barras ordenadas','Un mapa','Una línea'],a:1,w:'Las barras ordenadas se comparan mejor.'},
{q:'Un KPI sin comparación ni denominador…',o:['Es suficiente','No permite saber si el valor es bueno ni cómo se calculó','Es mejor','Es ilegal'],a:1,w:'Falta contexto.'}],
src:[['https://learn.microsoft.com/power-bi/guidance/star-schema','Microsoft Learn: guía de modelado (base para tableros consistentes)']],
ver:['Las reglas de diseño son criterios de práctica, sin norma formal. Detalles de Looker Studio (conectores, límites, precios): '+V('documentación de Google')]}
]});

MODS.push({id:'12',grp:'tools',title:'12. Integración y proyecto final',short:'Alertas, automatización y proyecto de portafolio',blurb:'Une datos, dashboards y automatización en un proyecto guiado para tu portafolio.',ch:[
{id:'12.1',title:'Actualización, alertas y Power BI con Power Automate',min:20,
goal:'Mantener el tablero actualizado y conectar una alerta de Power BI con un flujo que avise y registre.',
body:`<h3>Actualización de datos</h3>
<ul><li>Con modo <b>Importar</b> los datos se guardan en el modelo y se actualizan por horario. Con <b>DirectQuery</b> o conexión en vivo, la mayoría de los datos no dependen de la actualización programada.</li><li>Para una base <b>SQL Server local</b> hace falta una <b>puerta de enlace de datos</b> (gateway); Microsoft tiene un tutorial paso a paso.</li><li>En capacidad compartida hay un máximo de horarios diarios de actualización (la documentación menciona hasta ocho) y la actualización programada se pausa tras dos meses de inactividad del modelo ${V('límites vigentes según licencia')}.</li><li>Power BI no ofrece intervalo mensual; con Power Automate puedes crear uno personalizado.</li></ul>
<h3>Alertas de datos</h3>
<p>Las alertas se crean en el <b>servicio</b> de Power BI (no en Desktop), sobre mosaicos de un <b>dashboard</b> anclados desde visuales de tipo <b>tarjeta, KPI o medidor</b>. Puedes integrarlas con Power Automate: el disparador «Cuando se activa una alerta basada en datos» arranca un flujo que envía a Teams, correo o crea un elemento en una lista. Límites documentados: hasta 250 alertas por persona y sin co-propiedad (si cambias de dueño hay que recrear la alerta y el flujo) ${V('licencias necesarias para usar alertas con Power Automate')}.</p>
<h3>Cuidado con la fatiga de alertas</h3>
<p>Microsoft advierte que el uso excesivo de alertas degrada la efectividad de un flujo. Para evitarlo: umbrales basados en el <b>límite de control</b> (capítulo 10.5), no en la intuición; una alerta por problema, no cinco; un dueño claro; y revisar trimestralmente cuáles se ignoran.</p>`,
example:`<p>«Retail Andino» (ficticio) fija una alerta cuando el On Time diario cae por debajo del LCL. El flujo publica en el canal de operaciones y crea una incidencia en la lista de incidencias con estado «Nuevo». Así cierras el ciclo del capítulo 11.1: la alerta se convierte en un registro con responsable.</p>`,
ex:{type:'flow',intro:'Flujo de referencia: de la alerta de Power BI a una incidencia registrada.',steps:[
{k:'trigger',t:'Cuando se activa una alerta basada en datos (Power BI)',d:'Elige la alerta creada sobre la tarjeta de On Time del dashboard. Recuerda que las alertas no se crean en Desktop.'},
{k:'action',t:'Obtener el valor y la hora',d:'Usa el contenido dinámico de la alerta y <code>convertTimeZone(...)</code> para hora de Lima.'},
{k:'cond',t:'¿Valor bajo el umbral crítico?',d:'Sí: avisa al canal y crea incidencia. No: solo registra, sin avisar (evita ruido).'},
{k:'action',t:'Publicar mensaje en Teams',d:'Incluye KPI, valor, umbral y enlace al tablero. Sin datos personales.'},
{k:'action',t:'Crear elemento en la lista de incidencias',d:'Categoría «Alerta de KPI», estado «Nuevo», responsable de turno.'},
{k:'end',t:'Resultado: alerta con dueño y trazabilidad',d:'Falta el bloque Try/Catch del capítulo 11.5 para saber si el flujo falla.'}],
task:'Define umbral, destinatarios y horario para no generar fatiga de alertas.',
sol:'<ul><li><b>Umbral:</b> el LCL del On Time diario calculado con un periodo estable (capítulo 10.5), no un número «que se ve mal».</li><li><b>Destinatarios:</b> el responsable de turno primero; escalar al jefe si no se atiende en un tiempo definido.</li><li><b>Horario:</b> solo en horario operativo, y una sola alerta por día por el mismo problema.</li><li><b>Revisión:</b> cada trimestre, retirar las alertas que nadie usa.</li></ul>'},
quiz:[
{q:'¿Dónde se crean las alertas de datos de Power BI?',o:['En Power BI Desktop','En el servicio de Power BI, sobre mosaicos de un dashboard','En Excel','En Outlook'],a:1,w:'No están disponibles en Desktop.'},
{q:'Para actualizar automáticamente datos desde una base SQL Server local se usa…',o:['Una puerta de enlace de datos','Un correo','Un PDF','Nada'],a:0,w:'El gateway conecta el servicio con la fuente local.'},
{q:'¿Cómo reduces la fatiga de alertas?',o:['Más alertas','Umbrales basados en límites de control, un dueño y revisión periódica','Alertas cada minuto','Sin dueño'],a:1,w:'Menos alertas, mejor definidas.'}],
src:[['https://learn.microsoft.com/en-us/power-bi/refresh-scheduled-refresh','Microsoft Learn: actualización programada de Power BI'],['https://learn.microsoft.com/en-us/power-bi/connect-data/service-gateway-sql-tutorial','Microsoft Learn: actualizar desde SQL Server local con gateway'],['https://learn.microsoft.com/en-nz/power-bi/create-reports/service-set-data-alerts','Microsoft Learn: alertas de datos en el servicio de Power BI'],['https://learn.microsoft.com/en-us/power-automate/guidance/coding-guidelines/error-handling','Microsoft Learn: advertencia sobre uso excesivo de alertas']],
ver:['Requisitos de licencia (Pro, Premium) para alertas con Power Automate: '+V('consultar la documentación y a TI'),'Nombres de los disparadores y acciones de Power BI en el conector de Power Automate: '+V('probar en tu entorno')]},

{id:'12.2',title:'Mini proyecto integrador: incidencias de punta a punta',min:20,
goal:'Armar una pieza de portafolio que una Forms, Lists, Power Automate, un modelo de datos y Power BI, con datos ficticios.',
body:`<p>Este capítulo no explica algo nuevo: te pide <b>construir</b>. Es el proyecto que puedes enseñar en una entrevista y que demuestra juntos los módulos de datos, estadística y automatización.</p>
<p><b>El caso:</b> un retailer ficticio necesita registrar incidencias operativas, medir cuánto tardan en resolverse y alertar cuando algo se sale de lo normal.</p>
<h3>Reglas del proyecto</h3>
<ul><li><b>Datos ficticios.</b> Genera unas 200 incidencias con una historia oculta (por ejemplo, una causa que se concentra en una tienda desde cierta fecha). No uses datos reales de ningún empleador.</li><li><b>Sin datos personales.</b> Número de pedido ficticio, sin nombres ni teléfonos.</li><li><b>Documenta límites.</b> Qué no hace tu proyecto y qué asumiste.</li></ul>
<h3>Cómo presentarlo (90 segundos)</h3>
<p><b>Problema</b> (una frase), <b>solución</b> (Forms + Lists + flujo + tablero), <b>resultado medible</b> (tiempo de registro, tiempo medio y p90 de resolución) y <b>aprendizaje</b> (qué harías distinto). Si lo puedes contar sin mirar la pantalla, lo dominas.</p>`,
example:`<p>Entrevistador: «¿Qué construiste con Power Automate?» Tú: «Un flujo que registra incidencias desde un formulario en una lista con causa, tienda y severidad, y avisa al responsable. Sobre esa lista armé un tablero con un Pareto de causas y una alerta basada en límites de control. Con datos ficticios, el registro pasó de unos 4 minutos a 1. Lo que haría distinto: añadir un cierre de ciclo con aprobación para las incidencias graves.»</p>`,
ex:{type:'check',id:'12.2',intro:'Checklist del proyecto. Marca a medida que avances.',items:[
'Definí el problema y quién usará el tablero, y qué decisión tomará',
'Formulario con listas desplegables y sin datos personales',
'Lista con columnas tipadas: categoría, causa, tienda, severidad, estado, fecha de registro y de cierre',
'Flujo con Try/Catch, aviso de error y ficha del flujo',
'Datos ficticios suficientes (unas 200 filas) con una concentración que se pueda descubrir',
'Modelo simple: hecho de incidencias más dimensiones de fecha, tienda, categoría y causa',
'Medidas: total, % por causa, tiempo medio y p90 de resolución, variación frente a la semana anterior',
'Tablero de una página con filtros, tarjetas, tendencia, Pareto y tabla de excepciones',
'Alerta con umbral basado en un límite de control, conectada a un flujo',
'README: problema, decisiones, límites, datos ficticios y cómo reproducirlo',
'Guion de 90 segundos ensayado en voz alta'],
also:{type:'reveal',intro:'Cuando termines, compara tu enfoque.',task:'¿Qué historia oculta pondrías en los datos ficticios para que el análisis tenga algo que descubrir?',
sol:'<p>Ideas: una causa («producto sin ubicar») que se concentra en una tienda y una categoría a partir de una fecha; un aumento del tiempo de resolución en un turno; o un responsable que acumula incidencias abiertas. Lo importante es que <b>la historia exista y esté oculta</b>, para que tu tablero y tu análisis la descubran, como en el caso final del curso base.</p>'}},
quiz:[
{q:'¿Puedes usar datos reales de un empleador anterior en tu proyecto?',o:['Sí','No; usa datos ficticios','Solo los de este año','Solo sin fechas'],a:1,w:'Confidencialidad y riesgo legal.'},
{q:'Un buen resultado para el proyecto es…',o:['«Quedó bonito»','Un dato medible, como el tiempo de registro o de resolución','Muchas páginas','Muchos colores'],a:1,w:'Concreto y verificable.'},
{q:'¿Qué añade valor a un proyecto de portafolio?',o:['Ocultar los límites','Explicar decisiones y límites con honestidad','Copiar plantillas sin entenderlas','Usar muchos visuales'],a:1,w:'Muestra criterio.'}],
src:[['https://learn.microsoft.com/power-bi/guidance/star-schema','Microsoft Learn: esquema en estrella'],['https://learn.microsoft.com/en-us/power-automate/guidance/coding-guidelines/error-handling','Microsoft Learn: manejo de errores'],['https://learn.microsoft.com/en-nz/power-bi/create-reports/service-set-data-alerts','Microsoft Learn: alertas de datos']],
ver:['Cómo conectar Power BI a una lista de SharePoint o de Microsoft Lists en tu tenant: '+V('probar en tu entorno')]}
]});
var LT15=[22,24,25,26,26,27,28,28,29,30,31,33,36,48,96];
var LT10=[30,32,33,35,36,38,40,41,44,150];
function me95(p,n){return 100*1.96*Math.sqrt(p*(1-p)/n)}
function surcoRows(d,post){return d.filter(function(r){return r.tienda==='Surco'&&(post?r.fecha>='2026-09-08':r.fecha<'2026-09-08')})}

MODS.push({id:'10',grp:'tools',title:'10. Estadística descriptiva aplicada',short:'Percentiles, dispersión, muestras, control',blurb:'Lo justo de estadística para no equivocarte al leer promedios, porcentajes y variaciones.',ch:[
{id:'10.1',title:'Media, mediana y percentiles: por qué el promedio engaña',min:20,
goal:'Elegir entre media, mediana y percentil según la distribución, y usar el percentil 90 para hablar de tiempos de entrega.',
body:`<p>El <b>promedio</b> resume bien datos simétricos. Los tiempos de entrega suelen tener una cola larga: casi todos entregan en un rango normal y unos pocos se demoran muchísimo. Esos pocos arrastran el promedio.</p>
<ul><li><b>Media:</b> suma / cantidad. Sensible a valores extremos.</li><li><b>Mediana:</b> el valor central; la mitad está por debajo y la mitad por encima. Resistente a extremos.</li><li><b>Percentil 90 (p90):</b> el valor que 9 de cada 10 observaciones no superan. Sirve para promesas realistas: «el 90% se entrega en 43 horas o menos».</li></ul>
<p>En Excel (versión en español; comprueba los nombres en tu equipo): <code>PROMEDIO</code>, <code>MEDIANA</code>, <code>PERCENTIL.INC</code>, <code>CUARTIL.INC</code>. En SQL Server: <code>PERCENTILE_CONT(0.9) WITHIN GROUP (ORDER BY x) OVER (PARTITION BY ...)</code>. En Power BI: <code>MEDIAN</code> y <code>PERCENTILE.INC</code> ${V('sintaxis y nombres en tu versión')}.</p>
<p>Cuándo reportar qué: <b>media</b> si la distribución es razonablemente simétrica; <b>mediana + p90</b> para tiempos con cola larga; y <b>siempre</b> el tamaño de muestra. Un promedio de lead time sin p90 esconde a los clientes que más esperaron, que además son los que más reclaman.</p>`,
example:`<p>«Retail Andino» (ficticio) prometía «entrega en 24 horas» porque el promedio era bajo. Al mirar el p90 vieron que 1 de cada 10 pedidos tardaba mucho más. Cambiaron la promesa de acuerdo con el p90 y bajaron los reclamos por retraso. Los números del ejercicio son inventados.</p>`,
ex:{type:'stats',intro:'Calculadora: edita la lista o carga datos del CSV. Muestra media, mediana, p90, dispersión y atípicos. Lista inicial: 15 tiempos de entrega en horas.',sample:LT15.join(', '),
loaders:[{t:'Cargar lead time (días) de entregados del CSV',f:function(){return entr(DATA).map(function(r){return Math.round((new Date(r.entrega)-new Date(r.fecha))/864e5)}).join(', ')}},{t:'Cargar montos (S/) de entregados del CSV',f:function(){return entr(DATA).map(function(r){return r.monto}).join(', ')}},{t:'Volver a la lista inicial',f:function(){return LT15.join(', ')}}],
also:{type:'calc',intro:'Con la lista inicial (22, 24, 25, 26, 26, 27, 28, 28, 29, 30, 31, 33, 36, 48, 96 horas):',task:'Calcula la media, la mediana y el percentil 90 (método inclusivo, como PERCENTIL.INC).',
parts:[{l:'Media',u:'h',tol:0.1,fn:function(){return mean(LT15)}},{l:'Mediana',u:'h',tol:0.1,fn:function(){return median(LT15)}},{l:'Percentil 90',u:'h',tol:0.1,fn:function(){return pctl(LT15,0.9)}}],
sol:function(v){return '<p>Media = <b>'+fmt(v[0])+' h</b>, mediana = <b>'+fmt(v[1])+' h</b>, p90 = <b>'+fmt(v[2])+' h</b>. El pedido de 96 horas empuja la media 6 horas por encima de la mediana. Percentil inclusivo: posición = 0,9 × (15 − 1) = 12,6; se interpola entre el 13.º valor (36) y el 14.º (48): 36 + 0,6 × 12 = 43,2.</p>'}}},
quiz:[
{q:'Los tiempos de entrega tienen una cola larga. ¿Qué reportas?',o:['Solo la media','Mediana y percentil 90, y el tamaño de muestra','Solo el máximo','Solo el mínimo'],a:1,w:'La media se distorsiona con extremos.'},
{q:'«P90 = 43 h» significa…',o:['El 90% tarda exactamente 43 h','El 90% de los pedidos tarda 43 h o menos','El 10% tarda 43 h o menos','Que la media es 43 h'],a:1,w:'Es un umbral de cobertura.'},
{q:'La mediana es…',o:['El valor más frecuente','El valor central que deja la mitad de los datos a cada lado','La suma dividida por n','El máximo'],a:1,w:'Resistente a extremos.'}],
src:[['https://itl.nist.gov/div898/handbook/pmc/section3/pmc32.htm','NIST/SEMATECH e-Handbook: media, desviación y control de procesos (referencia general)']],
ver:['Nombres de funciones de Excel en español, y de SQL Server y DAX, según tu versión: '+V('probar en tu equipo'),'Los cuadros de este capítulo son datos sintéticos.']},

{id:'10.2',title:'Dispersión: desviación estándar, RIQ y valores atípicos',min:18,
goal:'Medir cuánta variabilidad hay en un proceso y detectar valores atípicos con una regla simple.',
body:`<p>Dos tiendas pueden tener el mismo On Time promedio y ser muy distintas: una estable y otra que oscila entre 99% y 80%. La <b>dispersión</b> dice cuánto varía el proceso.</p>
<ul><li><b>Desviación estándar (muestral):</b> qué tanto se alejan, en promedio, los datos de la media. En Excel: <code>DESVEST.M</code> (muestral) y <code>DESVEST.P</code> (poblacional) ${V('nombres en tu Excel')}.</li><li><b>Coeficiente de variación:</b> desviación / media, en %. Sirve para comparar variabilidad entre cosas de distinta escala.</li><li><b>Rango intercuartil (RIQ):</b> Q3 − Q1. Mide la dispersión del 50% central y no se altera con extremos.</li><li><b>Atípicos (regla práctica de 1,5 × RIQ):</b> valores por debajo de Q1 − 1,5·RIQ o por encima de Q3 + 1,5·RIQ. Es una convención habitual, no una ley: un atípico se investiga, no se borra automáticamente.</li></ul>
<p>Pregunta útil ante un atípico: <b>¿es un error de datos, un caso real extremo o una señal de un problema nuevo?</b> Un pedido de 150 horas puede ser un dato mal cargado, un cliente ausente tres veces o un producto agotado que se repuso tarde.</p>`,
example:`<p>Si Surco y Chorrillos entregan ambos «en 30 horas de media», pero Surco tiene un RIQ el triple de grande, la promesa de Surco es menos confiable. Un p90 cercano a la mediana indica estabilidad; uno muy lejano indica una cola problemática.</p>`,
ex:{type:'stats',intro:'Diez tiempos de entrega en horas con un valor sospechoso. Pruébalo y cambia el último valor para ver cómo reaccionan la media y la desviación.',sample:LT10.join(', '),
also:{type:'calc',intro:'Lista: 30, 32, 33, 35, 36, 38, 40, 41, 44, 150.',task:'Calcula la desviación estándar muestral, el RIQ y cuántos atípicos hay con la regla de 1,5 × RIQ.',
parts:[{l:'Desviación estándar',u:'h',tol:0.1,fn:function(){return sdS(LT10)}},{l:'RIQ (Q3 − Q1)',u:'h',tol:0.05,fn:function(){return pctl(LT10,.75)-pctl(LT10,.25)}},{l:'Atípicos',tol:0,fn:function(){var q1=pctl(LT10,.25),q3=pctl(LT10,.75),i=q3-q1;return LT10.filter(function(x){return x<q1-1.5*i||x>q3+1.5*i}).length}}],
sol:function(v){return '<p>Desviación estándar = <b>'+fmt(v[0])+' h</b> (inflada por el 150). RIQ = 40,75 − 33,5 = <b>'+fmt(v[1],2)+' h</b>. Límite superior = 40,75 + 1,5 × 7,25 = 51,6: el 150 es el único atípico (<b>'+v[2]+'</b>). Sin el 150, la desviación cae mucho: un solo dato puede dominar la dispersión.</p>'}}},
quiz:[
{q:'El RIQ mide…',o:['La dispersión del 50% central de los datos','El promedio','El máximo menos el mínimo','La moda'],a:0,w:'Q3 − Q1.'},
{q:'Encuentras un pedido de 150 horas en tu reporte. Lo correcto es…',o:['Borrarlo sin más','Investigar si es error de datos o un caso real','Ignorarlo','Duplicarlo'],a:1,w:'Un atípico se investiga, no se elimina por reflejo.'},
{q:'Coeficiente de variación = …',o:['Media / desviación','Desviación / media','Máximo / mínimo','Mediana / media'],a:1,w:'Permite comparar variabilidad relativa.'}],
src:[['https://itl.nist.gov/div898/handbook/pmc/section3/pmc32.htm','NIST/SEMATECH e-Handbook: desviación estándar y límites de control']],
ver:['La regla de 1,5 × RIQ es una convención habitual; no la cito como norma '+V('confirmar criterio en tu equipo de datos')]},

{id:'10.3',title:'Muestras y margen de error: cuándo un número es solo ruido',min:20,
goal:'Calcular el margen de error de un porcentaje y saber cuándo una diferencia entre semanas o tiendas es probablemente real.',
body:`<p>Un On Time de 82% con 45 pedidos no es «exactamente 82%»: es una estimación con incertidumbre. Para una proporción, el margen de error al 95% de confianza es aproximadamente:</p>
<pre><code>Margen = 1,96 × √( p × (1 − p) / n )</code></pre>
<p>donde <code>p</code> es la proporción observada y <code>n</code> el número de pedidos. Dos ideas prácticas: el margen es mayor cuando <code>n</code> es pequeño y cuando <code>p</code> está cerca de 50%; y para reducir el margen a la mitad necesitas <b>cuatro veces</b> más datos.</p>
<p>Este margen solo cubre el <b>error de muestreo</b>. No corrige sesgos: una encuesta de NPS que contestan solo los clientes muy contentos o muy molestos no representa a todos, aunque tenga muchas respuestas. La aproximación además requiere <code>n</code> suficientemente grande (muchas guías piden al menos 5 o 10 casos de cada tipo) ${V('condiciones de la aproximación para muestras pequeñas')}.</p>
<p><b>Cómo lo usas:</b> si el On Time de una tienda pasa de 91% a 88% con 40 pedidos por semana, probablemente es ruido. Si pasa de 98% a 67% con 46 pedidos entregados en cada periodo, es casi seguro una señal.</p>`,
example:`<p>El gerente pregunta: «Surco bajó, ¿o es casualidad?». Con la calculadora de abajo compruebas si los intervalos de antes y después se superponen. Si no se superponen, hay evidencia fuerte de cambio; si se superponen, pide más datos o mira más días.</p>`,
ex:{type:'calc',data:true,lab:{t:'Laboratorio: margen de error',fields:[{k:'p',l:'On Time observado (%)',v:82},{k:'n',l:'Pedidos entregados',v:45}],out:[{l:'Margen (± puntos)',f:function(v){return me95(v.p/100,v.n)}},{l:'Límite inferior (%)',f:function(v){return v.p-me95(v.p/100,v.n)}},{l:'Límite superior (%)',f:function(v){return v.p+me95(v.p/100,v.n)}}]},
task:'Con el CSV: en Surco, calcula el On Time y el margen de error antes (1 al 7 sep) y después (8 al 14 sep). Responde con el margen de «después», el límite superior de «después» y el límite inferior de «antes».',
parts:[{l:'Margen «después»',u:'pp',tol:0.1,fn:function(d){var e=entr(surcoRows(d,true));return me95(K.ontime(e)/100,e.length)}},{l:'Límite superior «después»',u:'%',tol:0.1,fn:function(d){var e=entr(surcoRows(d,true)),p=K.ontime(e);return p+me95(p/100,e.length)}},{l:'Límite inferior «antes»',u:'%',tol:0.1,fn:function(d){var e=entr(surcoRows(d,false)),p=K.ontime(e);return p-me95(p/100,e.length)}}],
sol:function(v){return '<p>Margen «después» ≈ <b>±'+fmt(v[0])+' pp</b>. El límite superior de «después» es <b>'+fmt(v[1])+'%</b> y el inferior de «antes» es <b>'+fmt(v[2])+'%</b>. '+(v[2]>v[1]?'Como el mínimo plausible de «antes» supera al máximo plausible de «después», los intervalos no se superponen: hay evidencia fuerte de que el deterioro no es casualidad.':'Los intervalos se superponen: no hay evidencia suficiente.')+' Recuerda: los pedidos de un mismo día no son independientes del todo, así que esta cuenta es una guía, no una prueba formal.</p>'}},
quiz:[
{q:'Para reducir el margen de error a la mitad, necesitas…',o:['El doble de datos','Cuatro veces más datos','La misma cantidad','Diez veces menos datos'],a:1,w:'El margen depende de la raíz de n.'},
{q:'Una encuesta con muchas respuestas sesgadas…',o:['Es representativa igualmente','Puede seguir siendo engañosa: el margen no corrige el sesgo','Tiene margen cero','Es siempre válida'],a:1,w:'El margen mide solo error de muestreo.'},
{q:'On Time pasa de 91% a 88% con 40 pedidos por semana. ¿Conclusión prudente?',o:['Es una caída grave','Probablemente es ruido; mira más semanas','Hay que despedir a alguien','Es imposible'],a:1,w:'El margen con n=40 es de varios puntos.'}],
src:[['https://sol.utstat.utoronto.ca/modules/module-6/7-2-Confidence-Intervals-for-Proportions.pdf','Universidad de Toronto: intervalos de confianza para proporciones'],['https://www.calculate.co.nz/margin-of-error-calculator.php','Calculadora de margen de error: sobre sesgo y tamaño de muestra']],
ver:['Fórmula normal aproximada para proporciones; para n pequeño existen métodos exactos '+V('elegir método con un estadístico si el análisis es crítico')]},

{id:'10.4',title:'Correlación, causalidad y la paradoja de Simpson',min:20,
goal:'Distinguir «están relacionados» de «uno causa al otro» y detectar cuando un promedio global miente.',
body:`<p>La <b>correlación</b> (coeficiente r, de −1 a 1) mide cuánto se mueven dos variables juntas. En Excel: <code>COEF.DE.CORREL</code> ${V('nombre en tu Excel')}. Una correlación alta no prueba causa: dos variables pueden moverse juntas por una tercera (por ejemplo, ambas suben en campañas) o por casualidad.</p>
<p>Para sostener una causa necesitas: un <b>mecanismo</b> plausible, <b>orden temporal</b> (la causa antes del efecto), <b>descartar terceras variables</b> (segmentar por tienda, categoría, modalidad) y, si puedes, un <b>experimento</b> o comparación antes/después con un grupo de control.</p>
<h3>La paradoja de Simpson</h3>
<p>Un porcentaje global puede empeorar aunque cada segmento mejore, si cambia la <b>mezcla</b>. Es un error frecuente al comparar tiendas: una tienda con más pedidos difíciles (domicilio) se ve peor en el global aunque sea mejor en cada modalidad. Por eso el curso insiste: <b>corta por modalidad, canal y categoría antes de concluir</b>.</p>`,
example:`<p>«Retail Andino» (ficticio) compara la tienda X con la tienda Y. Y tiene mejor On Time en domicilio y en retiro, pero peor global porque casi todos sus pedidos son domicilio, la modalidad más difícil. Si el gerente solo ve el global, castiga a la tienda equivocada.</p>`,
ex:{type:'calc',intro:'Pedidos entregados por tienda y modalidad (datos sintéticos).',cols:['Tienda','Modalidad','Pedidos','A tiempo'],rows:[['X','Domicilio',10,6],['X','Retiro',90,85],['Y','Domicilio',90,63],['Y','Retiro',10,10]],num:[2,3],
task:'Calcula el On Time global de X, el global de Y y el On Time de Y en Domicilio.',
parts:[{l:'Global X',u:'%',tol:0.1,fn:function(r){var p=0,a=0;r.filter(function(x){return x[0]==='X'}).forEach(function(x){p+=x[2];a+=x[3]});return 100*a/p}},{l:'Global Y',u:'%',tol:0.1,fn:function(r){var p=0,a=0;r.filter(function(x){return x[0]==='Y'}).forEach(function(x){p+=x[2];a+=x[3]});return 100*a/p}},{l:'Y en Domicilio',u:'%',tol:0.1,fn:function(r){var x=r[2];return 100*x[3]/x[2]}}],
sol:function(v){return '<p>Global X = <b>'+fmt(v[0])+'%</b>; global Y = <b>'+fmt(v[1])+'%</b>. Pero en Domicilio Y logra <b>'+fmt(v[2])+'%</b> frente a 60% de X, y en Retiro Y logra 100% frente a 94,4% de X. Y es mejor en <b>cada</b> modalidad y peor en el global: efecto de mezcla (paradoja de Simpson).</p>'}},
quiz:[
{q:'Una correlación alta entre dos variables demuestra que…',o:['Una causa la otra','Se mueven juntas; la causa requiere más evidencia','Son idénticas','Hay error de datos'],a:1,w:'Correlación no es causalidad.'},
{q:'La paradoja de Simpson ocurre cuando…',o:['Los datos son pocos','El global contradice a los segmentos por cambio de mezcla','Hay atípicos','Falta el ERP'],a:1,w:'Cada segmento mejora, pero el peso de los segmentos cambia.'},
{q:'Antes de concluir que una tienda es peor…',o:['Miras solo el global','Cortas por modalidad, canal y categoría','Le preguntas al cliente','Esperas un año'],a:1,w:'Evita comparar mezclas distintas.'}],
src:[['https://itl.nist.gov/div898/handbook/pmc/section3/pmc32.htm','NIST/SEMATECH e-Handbook (referencia general de variabilidad y control)']],
ver:['Ejemplo de Simpson con cifras inventadas para ilustrar el efecto de mezcla.']},

{id:'10.5',title:'Control de procesos simple: cuándo una variación es señal',min:20,
goal:'Usar un gráfico de control básico para distinguir la variación normal de una señal que merece acción.',
body:`<p>Todo proceso varía. Un <b>gráfico de control</b> (Shewhart) grafica una medida en el tiempo con una línea central (la media) y dos límites: <b>LCL</b> y <b>UCL</b> a tres desviaciones estándar por debajo y por arriba. Un punto fuera de los límites sugiere una <b>causa especial</b> (algo cambió), mientras que la variación dentro de los límites es <b>causa común</b> (ruido normal).</p>
<pre><code>LCL = media − 3 × desviación estándar
UCL = media + 3 × desviación estándar</code></pre>
<p>Reglas de sentido común: define los límites con un <b>periodo estable</b> previo (línea base); recalcúlalos solo cuando el proceso cambió a propósito; y complementa con reglas como 8 puntos seguidos del mismo lado de la media, que indican un desplazamiento sostenido.</p>
<p><b>Cuidado con la muestra:</b> el manual del NIST recuerda la recomendación clásica de Shewhart de reunir del orden de 25 subgrupos antes de dar un proceso por controlado. Con 10 días de historia, los límites son provisionales. Y para porcentajes (como On Time) con distinto número de pedidos por día existe el gráfico p, cuyos límites cambian con n ${V('usar gráfico p si el volumen diario varía mucho')}.</p>
<p>Aplicación: usar el LCL del On Time diario como umbral de alerta en Power BI o Power Automate (capítulo 12.1). Así avisas cuando algo <i>realmente</i> cambió y no por cada pequeña oscilación.</p>`,
example:`<p>El On Time diario de «Retail Andino» (ficticio) oscila entre 89% y 95% durante meses. Un día marca 84%: fuera del LCL, se investiga. Otro día marca 88%: dentro del ruido normal, no se activa ninguna alarma. Eso evita la fatiga de alertas.</p>`,
ex:{type:'calc',intro:'On Time diario (%) de un periodo estable de 10 días (datos sintéticos): 92, 90, 94, 91, 93, 89, 92, 95, 90, 93. Días nuevos: 88, 84, 96.',
task:'Calcula la media, el LCL con 3 desviaciones (desviación muestral) y cuántos de los tres días nuevos caen por debajo del LCL.',
parts:[{l:'Media',u:'%',tol:0.05,fn:function(){return mean([92,90,94,91,93,89,92,95,90,93])}},{l:'LCL',u:'%',tol:0.1,fn:function(){var b=[92,90,94,91,93,89,92,95,90,93];return mean(b)-3*sdS(b)}},{l:'Días nuevos bajo el LCL',tol:0,fn:function(){var b=[92,90,94,91,93,89,92,95,90,93],l=mean(b)-3*sdS(b);return [88,84,96].filter(function(x){return x<l}).length}}],
sol:function(v){var b=[92,90,94,91,93,89,92,95,90,93];return '<p>Media = <b>'+fmt(v[0])+'%</b>, desviación muestral = '+fmt(sdS(b),2)+', LCL = <b>'+fmt(v[1])+'%</b>, UCL = '+fmt(mean(b)+3*sdS(b))+'%. Solo el día de 84% cae por debajo (<b>'+v[2]+'</b>). El 88% se ve mal pero está dentro de la variación normal; el 96% está dentro del UCL. Con solo 10 días de línea base los límites son provisionales.</p>'}},
quiz:[
{q:'Un punto fuera del LCL o UCL sugiere…',o:['Ruido normal','Una posible causa especial que hay que investigar','Un error del ERP siempre','Que hay que recalcular todo'],a:1,w:'Es una señal, no una certeza.'},
{q:'¿Para qué defines una línea base estable?',o:['Para calcular límites con un periodo sin cambios grandes','Para borrar datos','Por estética','Para ahorrar licencias'],a:0,w:'Los límites se calculan con un proceso estable.'},
{q:'¿Qué riesgo tienen los límites calculados con 10 puntos?',o:['Ninguno','Son provisionales y poco confiables','Son perfectos','Son ilegales'],a:1,w:'Shewhart recomendaba del orden de 25 subgrupos.'}],
src:[['https://itl.nist.gov/div898/handbook/pmc/section3/pmc32.htm','NIST/SEMATECH e-Handbook: gráficos de control de variables y cantidad de muestras'],['https://www.sqconline.com/node/15','SQCOnline: reglas de Western Electric y gráficos de control']],
ver:['Los límites de 3 sigma asumen aproximadamente una distribución normal e independencia entre puntos '+V('validar supuestos antes de automatizar alertas')]}
]});
MODS.push({id:'11',grp:'tools',title:'11. Power Automate para operaciones',short:'Tipos de flujo, conectores, recetas, buenas prácticas',blurb:'Cuándo y cómo automatizar tareas de operaciones con Forms, Lists, Excel, Outlook, Teams y Power BI.',ch:[
{id:'11.1',title:'Qué es Power Automate y cuándo conviene usarlo',min:18,
goal:'Distinguir los tipos de flujo, saber qué tareas de operaciones sí conviene automatizar y cuáles no.',
body:`<p><b>Power Automate</b> es el servicio de Microsoft para automatizar tareas repetitivas conectando aplicaciones. Piénsalo como el «pegamento» entre herramientas de oficina: un formulario, una lista, un correo, un canal de Teams, una hoja de Excel. No reemplaza al OMS, al WMS ni al ERP: automatiza el trabajo que ocurre <i>alrededor</i> de ellos.</p>
${T(['Tipo de flujo','Se inicia por…','Ejemplo en operaciones e-commerce'],[
['Automatizado (cloud)','Un evento: llega un correo, se envía un formulario, se crea un elemento en una lista','Registrar y clasificar una incidencia cuando alguien llena el formulario'],
['Instantáneo (cloud)','Un botón, en la web o el móvil','Botón «tienda sin picker» que avisa al jefe de operaciones'],
['Programado (cloud)','Un horario','Cada mañana, enviar la lista de pedidos atorados'],
['De escritorio (RPA)','Un robot que repite clics y teclas en Windows o en la web','Copiar datos de una pantalla sin API a Excel'],
['De proceso de negocio','Una guía por etapas dentro de una aplicación','Llevar un caso por etapas hasta cerrarlo']])}
<p>Microsoft documenta los flujos de nube (automatizados, instantáneos y programados), los de escritorio y los de proceso de negocio; su clasificación se ha ido actualizando (por ejemplo, ya aparecen «acciones generativas» en vista previa) ${V('lista vigente de tipos y funciones con IA')}.</p>
<h3>Cuándo sí</h3>
<ul><li>La tarea se repite y tiene <b>reglas claras</b> («si severidad es alta, avisa a X»).</li><li>Los datos entran <b>estructurados</b> (formulario con listas desplegables, tabla).</li><li>Hay riesgo de olvido o demora (recordatorios, vencimientos).</li><li>Existe un conector para el sistema.</li></ul>
<h3>Cuándo no, o todavía no</h3>
<ul><li>El proceso está mal definido: automatizas el desorden.</li><li>Hay excepciones en la mayoría de los casos.</li><li>Una fórmula de Excel o un filtro de Power BI ya lo resuelve.</li><li>Manejas datos personales o financieros y no tienes autorización.</li><li>Solo puedes hacerlo con robots de pantalla (RPA) sobre un sistema crítico que cambia mucho: es frágil.</li></ul>
<p>Regla de trabajo: <b>define, mide, automatiza</b>. Si no sabes cuánto tarda hoy la tarea, no sabrás si la automatización sirvió.</p>`,
example:`<p>En «Retail Andino» (ficticio), las tiendas reportan incidencias por WhatsApp y alguien las copia a un Excel al final del día. Con un formulario, una lista y un flujo, la incidencia queda registrada al momento, clasificada y con aviso al responsable. El equipo deja de perder tiempo copiando y tú ganas datos limpios para analizar.</p>`,
ex:{type:'match',intro:'¿Qué tipo de flujo usarías?',opts:['Automatizado','Instantáneo','Programado','De escritorio (RPA)','De proceso de negocio'],items:[
{t:'Cada vez que alguien envía el formulario de incidencias',a:'Automatizado'},
{t:'Todos los días a las 8:00, enviar los pedidos atorados',a:'Programado'},
{t:'Un botón en el móvil para avisar «tienda sin picker»',a:'Instantáneo'},
{t:'Un robot que repite clics en una pantalla web sin API para bajar datos',a:'De escritorio (RPA)'},
{t:'Guiar por etapas a quien gestiona un caso dentro de una aplicación',a:'De proceso de negocio'}],
sol:'<p>Bien. Para operaciones e-commerce, empieza casi siempre con flujos <b>automatizados y programados</b>: son los más simples de mantener.</p>'},
quiz:[
{q:'Power Automate sirve sobre todo para…',o:['Reemplazar el ERP','Automatizar tareas repetitivas conectando aplicaciones','Calcular KPI avanzados','Diseñar dashboards'],a:1,w:'Es un integrador de tareas y aplicaciones.'},
{q:'¿Cuál es una mala razón para automatizar?',o:['La tarea se repite todos los días','El proceso es confuso y cambia cada vez','Hay reglas claras','Hay riesgo de olvido'],a:1,w:'Automatizar un proceso confuso multiplica el desorden.'},
{q:'Un flujo que se ejecuta cada mañana a una hora fija es…',o:['Instantáneo','Programado','De proceso de negocio','Un RPA obligatoriamente'],a:1,w:'Se inicia por horario.'}],
src:[['https://learn.microsoft.com/en-us/flow/flow-types','Microsoft Learn: tipos de flujos de Power Automate'],['https://learn.microsoft.com/en-us/training/modules/explore-power-automate/2-examine-functionality','Microsoft Learn: automatizados, instantáneos, programados, de proceso y de escritorio']],
ver:['Tipos de flujo, funciones con IA y nombres de la interfaz en 2026/2027: '+V('Microsoft Learn'),'Los ejemplos de operaciones son propuestas didácticas, no casos de una empresa real.']},

{id:'11.2',title:'Anatomía de un flujo: disparador, acciones, condiciones y expresiones',min:20,
goal:'Leer y diseñar un flujo paso a paso, incluido el tuyo de incidencias, y usar las expresiones más comunes.',
body:`<p>Todo flujo tiene un <b>disparador</b> (lo que lo inicia) y una o más <b>acciones</b> (lo que hace). Entre medias puedes poner <b>condiciones</b> (Sí/No), <b>bucles</b> (aplicar a cada elemento), <b>variables</b> y acciones de <b>Redactar</b> (Compose) para preparar datos. Los resultados de cada paso se reutilizan como <b>contenido dinámico</b>.</p>
<p>Un detalle clave del conector de Forms: el disparador «Cuando se envía una nueva respuesta» solo entrega el <b>ID</b> del formulario y de la respuesta. Para leer los campos necesitas la acción <b>«Obtener los detalles de la respuesta»</b>. Además, los valores llegan como <b>texto</b> aunque el campo del formulario sea de otro tipo; por eso conviene usar listas desplegables y validar en el flujo.</p>
<h3>Expresiones que usarás seguido</h3>
${T(['Expresión','Para qué'],[
['<code>utcNow()</code>','Fecha y hora actual en UTC'],
['<code>convertTimeZone(utcNow(),\'UTC\',\'SA Pacific Standard Time\',\'yyyy-MM-dd HH:mm\')</code>','Hora de Lima (verifica el nombre de la zona en tu entorno)'],
['<code>formatDateTime(utcNow(),\'yyyy-MM-dd\')</code>','Dar formato a una fecha'],
['<code>addDays(utcNow(),15)</code>','Sumar días calendario (no hábiles)'],
['<code>if(equals(variables(\'sev\'),\'Alta\'),\'Urgente\',\'Normal\')</code>','Decidir un valor según una condición'],
['<code>coalesce(x,\'sin dato\')</code>','Reemplazar vacíos'],
['<code>length(body(\'Obtener_elementos\')?[\'value\'])</code>','Contar elementos devueltos']])}
<p>Perú usa UTC−5 todo el año, y si no conviertes la zona, las horas de registro saldrán desfasadas ${V('nombre de zona horaria y comportamiento de fechas en tu entorno')}.</p>`,
example:`<p>Tu flujo de incidencias sigue esta lógica. Recórrelo en el diagrama de abajo y fíjate en el orden: primero se obtienen los detalles, luego se guarda, luego se decide a quién avisar.</p>`,
ex:{type:'flow',intro:'Flujo «Registro y clasificación de incidencia» (versión de referencia, con datos ficticios).',steps:[
{k:'trigger',t:'Cuando se envía una nueva respuesta (Microsoft Forms)',d:'Solo entrega el ID de la respuesta. Selecciona el formulario de incidencias de la lista; evita pegar un ID a mano.'},
{k:'action',t:'Obtener los detalles de la respuesta',d:'Recupera los campos como texto. Usa listas desplegables en el formulario para evitar valores libres.'},
{k:'action',t:'Crear elemento (SharePoint / Microsoft Lists)',d:'Mapea cada campo a una columna. Estado inicial «Nuevo». Fecha de registro con <code>convertTimeZone(...)</code>.'},
{k:'cond',t:'¿Severidad = Alta?',d:'Rama Sí: mensaje al canal de Teams y correo al responsable. Rama No: solo correo al responsable.'},
{k:'action',t:'Enviar correo (Outlook) o publicar en Teams',d:'Asunto claro (tienda, categoría, severidad) y enlace al elemento. Sin datos personales del cliente.'},
{k:'action',t:'Actualizar elemento',d:'Cambia el estado a «Notificado» y guarda la fecha de aviso, para medir tiempos después.'},
{k:'end',t:'Resultado: incidencia registrada, clasificada y notificada',d:'Además quedan datos limpios para analizar en Power BI.'}],
task:'Marca 4 puntos donde este flujo puede fallar y cómo te enterarías.',
sol:'<ol><li><b>Campo del formulario renombrado o borrado:</b> el mapeo a la lista se rompe. Te enteras por el historial de ejecuciones, o mejor por un aviso de error.</li><li><b>Tipo de columna incompatible</b> (por ejemplo, texto en una columna de número o fecha): falla «Crear elemento».</li><li><b>Correo sin destinatario</b> o permisos de la cuenta que envía: falla el aviso.</li><li><b>Cuenta de conexión desactivada o contraseña cambiada:</b> todo el flujo se detiene.</li></ol><p>Solución común: bloque Try/Catch con aviso (capítulo 11.5).</p>'},
quiz:[
{q:'El disparador de Forms «Cuando se envía una nueva respuesta» entrega…',o:['Todos los campos ya listos','Solo el ID de la respuesta; los detalles se piden con otra acción','El PDF del formulario','El correo del jefe'],a:1,w:'Se necesita «Obtener los detalles de la respuesta».'},
{q:'¿Qué hace <code>addDays(utcNow(),15)</code>?',o:['Suma 15 días hábiles','Suma 15 días calendario','Resta 15 días','Suma 15 horas'],a:1,w:'No conoce sábados, domingos ni feriados.'},
{q:'Los campos de Forms llegan al flujo como…',o:['Fechas y números tipados siempre','Texto','Imágenes','Nada'],a:1,w:'Conviene validar y convertir cuando haga falta.'}],
src:[['https://github.com/MicrosoftDocs/power-automate-docs/blob/live/articles/forms/overview.md','Documentación de Power Automate (fuente): conector de Forms'],['https://manueltgomes.com/microsoft/powerautomate/forms-when-a-new-response-is-submitted-trigger','Manuel T. Gomes: el disparador de Forms devuelve solo IDs (fuente secundaria)'],['https://manueltgomes.com/reference/power-automate-action-reference/forms-get-response-details-action/','Manuel T. Gomes: valores como texto (fuente secundaria)']],
ver:['Nombres de acciones y de zona horaria según el idioma y el entorno de tu Power Automate: '+V('probar en tu entorno'),'Este flujo es una versión de referencia; el tuyo puede tener otros pasos.']},

{id:'11.3',title:'Conectores, licencias y dónde guardar los datos',min:18,
goal:'Saber qué conectores puedes usar con tu cuenta, qué es «premium» y dónde conviene guardar los datos de tus flujos.',
body:`<p>Un <b>conector</b> es lo que permite al flujo hablar con una aplicación. Se dividen en <b>estándar</b> y <b>premium</b>. Con Microsoft 365 suelen estar cubiertos los estándar más usados (Outlook, SharePoint, Teams, Forms, Excel Online, OneDrive, Aprobaciones). Los premium, como <b>SQL Server</b>, Dataverse o HTTP, exigen una licencia adicional; el propio FAQ de licencias de Microsoft clasifica SQL Server como premium. Y basta con <b>una</b> acción premium en el flujo para que todo el flujo requiera esa licencia ${V('licencias, precios y reglas actuales; consúltalo con TI')}.</p>
<p>En una empresa, además, los administradores pueden aplicar <b>políticas DLP</b> que bloquean o agrupan conectores. Aunque un conector exista, tu organización puede no permitirlo.</p>
<h3>Dónde guardar datos para tus flujos</h3>
${T(['Opción','Cuándo usarla','Cuidado'],[
['Microsoft Lists / SharePoint','Registros como incidencias, reclamos y aprobaciones','Define columnas tipadas y listas desplegables'],
['Excel Online (Business)','Tablas pequeñas y reportes','Los datos deben estar en una Tabla dentro de OneDrive o SharePoint, no en un archivo local'],
['Dataverse','Aplicaciones más grandes','Premium'],
['SQL Server','Datos transaccionales','Premium; requiere permisos y, para fuentes locales, una puerta de enlace']])}
<p>Para empezar, la combinación <b>Forms + Lists + Outlook/Teams + Excel + Power BI</b> resuelve mucho y usa conectores estándar.</p>
<p>Otro dato: los límites dependen del plan. Con planes de Microsoft 365 el flujo tiene el perfil de rendimiento más bajo (límites de solicitudes menores), lo que importa cuando el volumen crece.</p>`,
example:`<p>Un analista de «Retail Andino» (ficticio) quiere leer directamente la base de pedidos de SQL Server desde el flujo. Se encuentra con un conector premium. Alternativa práctica: exportar cada mañana una tabla resumen a Excel Online y leer esa tabla desde el flujo, o pedir a TI el permiso y la licencia si el caso lo justifica.</p>`,
ex:{type:'match',intro:'¿Qué conector usarías?',opts:['Microsoft Forms','SharePoint / Lists','Microsoft Teams','Outlook','Excel Online (Business)','SQL Server (premium)'],items:[
{t:'Recibir los datos de un formulario de incidencias',a:'Microsoft Forms'},
{t:'Guardar registros de incidencias con columnas y estados',a:'SharePoint / Lists'},
{t:'Avisar al canal del equipo de operaciones',a:'Microsoft Teams'},
{t:'Enviar un correo con el resumen diario',a:'Outlook'},
{t:'Leer las filas de una tabla en un Excel de OneDrive',a:'Excel Online (Business)'},
{t:'Consultar directamente una base de datos SQL Server',a:'SQL Server (premium)'}],
sol:'<p>Bien. Antes de diseñar, pregunta a TI qué conectores y qué entorno están permitidos.</p>'},
quiz:[
{q:'Una sola acción premium en un flujo implica que…',o:['Solo esa acción requiere licencia','Todo el flujo requiere la licencia correspondiente','No hay cambios','El flujo se borra'],a:1,w:'La licencia se aplica al flujo completo.'},
{q:'Para Excel Online en un flujo, los datos deben estar…',o:['En un archivo local','En una Tabla dentro de OneDrive o SharePoint','En un PDF','En un correo'],a:1,w:'Las acciones de Excel trabajan con tablas.'},
{q:'Una política DLP sirve para…',o:['Acelerar los flujos','Restringir o agrupar los conectores que se pueden usar','Reducir el precio','Crear formularios'],a:1,w:'Es control de gobernanza del administrador.'}],
src:[['https://www.microsoft.com/licensing/faqs/8','Microsoft Licensing FAQ: lista de conectores premium (incluye SQL Server)'],['https://learn.microsoft.com/en-us/power-automate/limits-and-config','Microsoft Learn: perfiles de rendimiento y límites'],['https://team400.ai/blog/2026-04-15-power-automate-licensing-australia','Team400: licencias de Power Automate 2026 (fuente secundaria)']],
ver:['Precios y planes: no los cito porque cambian y varían por país '+V('consultar a TI o a Microsoft'),'Conectores permitidos por tu empleador: depende de las políticas DLP.']},

{id:'11.4',title:'Cinco recetas para operaciones e-commerce',min:20,
goal:'Conocer cinco flujos útiles, con su tipo, sus pasos y qué datos necesitan, para decidir cuál construir primero.',
body:`<p>Cada receta indica el <b>disparador</b>, las <b>acciones</b> y la <b>fuente de datos</b>. Elige una pestaña y toca los pasos. Son diseños de referencia, no plantillas oficiales.</p>
<p>Ojo con la fuente de datos: si tu OMS o tu SQL Server no ofrecen un conector estándar, el flujo puede leer un <b>resumen exportado a Excel o a una lista</b>, que a su vez se actualiza desde un reporte. Es más lento, pero funciona sin licencias adicionales.</p>`,
example:`<p>Empieza por la receta 1 (la que ya hiciste) y la 5 (el reporte diario). Las dos usan datos estructurados, conectores estándar y producen un ahorro fácil de medir.</p>`,
ex:{type:'flow',intro:'',recipes:[
{t:'1 Incidencias',d:'Automatizado. Fuente: Forms y Lists.',steps:[
{k:'trigger',t:'Cuando se envía una respuesta (Forms)',d:'Formulario con categoría, tienda, severidad y número de pedido.'},
{k:'action',t:'Obtener detalles y crear elemento en la lista',d:'Registra con estado «Nuevo» y fecha de registro en hora de Lima.'},
{k:'cond',t:'¿Severidad alta?',d:'Sí: Teams al canal. No: correo al responsable.'},
{k:'end',t:'Datos listos para un Pareto de causas en Power BI',d:'Ver capítulo 2.4.'}]},
{t:'2 Pedidos atorados',d:'Programado. Fuente: tabla exportada a Excel o lista.',steps:[
{k:'trigger',t:'Recurrencia (por ejemplo, cada hora en turno)',d:'Define zona horaria de Lima y días hábiles. El intervalo mínimo de recurrencia es de 60 segundos, pero rara vez hace falta tan seguido.'},
{k:'action',t:'Obtener filas de la tabla de pedidos',d:'Filtra por estado y por horas en estado mayor al umbral (capítulo 2.1).'},
{k:'cond',t:'¿Hay pedidos atorados?',d:'Si la cantidad es 0, el flujo termina sin molestar a nadie.'},
{k:'action',t:'Crear tabla HTML y enviar por Outlook o Teams',d:'Agrupa por tienda para mostrar dónde llamar.'},
{k:'end',t:'Lista diaria de excepciones, sin trabajo manual',d:'Depende de que la tabla de origen esté actualizada.'}]},
{t:'3 Plazo de reclamos',d:'Programado. Fuente: lista de reclamos.',steps:[
{k:'trigger',t:'Recurrencia diaria',d:'Cada mañana, en hora de Lima.'},
{k:'action',t:'Obtener reclamos abiertos',d:'La lista guarda la fecha límite. El plazo es de 15 días hábiles (capítulo 5.2). La fecha se registra al crear el reclamo, no con <code>addDays</code>.'},
{k:'cond',t:'¿Faltan 3 días hábiles o menos?',d:'Compara con la fecha límite. Los feriados van en una lista aparte '+V('regla de cómputo y feriados con el área legal')+'.'},
{k:'action',t:'Recordar al responsable y escalar al jefe si vence',d:'Correo con el enlace al reclamo.'},
{k:'end',t:'Menos reclamos vencidos',d:'El riesgo real es la fecha límite mal calculada, no el envío.'}]},
{t:'4 Aprobaciones',d:'Automatizado. Fuente: lista o formulario.',steps:[
{k:'trigger',t:'Cuando se crea un elemento (ajuste de stock o devolución especial)',d:'Ejemplo: ajuste negativo grande o reembolso excepcional.'},
{k:'action',t:'Iniciar y esperar una aprobación',d:'El aprobador responde por correo o Teams.'},
{k:'cond',t:'¿Aprobado?',d:'Sí: actualiza la lista y avisa a almacén. No: notifica y cierra con motivo.'},
{k:'ctrl',t:'Recordatorio y escalamiento',d:'Una ejecución dura como máximo 30 días; después, los pasos pendientes caducan. Programa recordatorios mucho antes.'},
{k:'end',t:'Ajustes con trazabilidad',d:'Queda registrado quién aprobó y cuándo.'}]},
{t:'5 Reporte diario',d:'Programado. Fuente: tabla de Excel Online.',steps:[
{k:'trigger',t:'Recurrencia, todos los días a las 8:00 (hora de Lima)',d:'Configura la zona horaria explícitamente.'},
{k:'action',t:'Obtener filas de la tabla de KPIs',d:'La tabla se alimenta con Power Query o desde tu proceso diario.'},
{k:'action',t:'Seleccionar y crear tabla HTML',d:'Columnas: KPI, valor, meta, variación.'},
{k:'action',t:'Enviar correo (Outlook)',d:'Asunto con fecha; cuerpo con la tabla y el enlace al tablero.'},
{k:'end',t:'Reporte que sale solo',d:'Mide cuánto tiempo tomaba antes (capítulo 11.6).'}]}],
task:'¿Cuál construirías primero? Da tres criterios para decidir.',
sol:'<p>Criterios: <b>frecuencia</b> (cuántas veces al día o semana), <b>dolor</b> (tiempo perdido o riesgo si se olvida) y <b>simplicidad</b> (datos estructurados y conectores estándar). Con esos criterios, las recetas 1 y 5 suelen ganar. La 3 tiene más valor de negocio, pero exige definir bien la fecha límite y los feriados; conviene construirla con el área legal.</p>'},
quiz:[
{q:'¿Cuál es una limitación importante de esperar una aprobación en un flujo?',o:['No se puede','La ejecución dura como máximo 30 días','Solo funciona en domingo','Requiere premium siempre'],a:1,w:'La documentación de límites indica 30 días de duración de ejecución.'},
{q:'Si no hay pedidos atorados, ¿qué debería hacer el flujo de la receta 2?',o:['Enviar un correo vacío','Terminar sin notificar','Borrar la tabla','Reiniciar'],a:1,w:'Evita ruido y fatiga de alertas.'},
{q:'¿Por qué la receta 3 exige cuidado?',o:['Porque usa Forms','Porque el cálculo de la fecha límite en días hábiles con feriados es delicado','Porque es más lenta','Porque es ilegal'],a:1,w:'Un error de fecha equivale a un reclamo vencido.'}],
src:[['https://learn.microsoft.com/en-us/power-automate/limits-and-config','Microsoft Learn: 30 días de ejecución, recurrencia mínima de 60 segundos'],['https://learn.microsoft.com/en-us/power-automate/guidance/coding-guidelines/error-handling','Microsoft Learn: guía de manejo de errores y alertas']],
ver:['Las cinco recetas son diseños didácticos. Conectores, nombres de acciones y límites exactos: '+V('según tu entorno y plan')]},

{id:'11.5',title:'Buenas prácticas: errores, seguridad, propiedad y límites',min:20,
goal:'Construir flujos que no se rompen en silencio, que no exponen datos y que sobreviven a los cambios de personal.',
body:`<h3>1. Errores</h3>
<p>Por defecto, cada acción solo se ejecuta si la anterior fue exitosa, así que el primer error detiene todo. Microsoft recomienda agrupar acciones en <b>Scopes</b> con patrón <b>Try / Catch</b>: en «Try» va el trabajo principal y en «Catch», configurado para ejecutarse si «Try» falla (<i>Configure run after</i>), identificas el error, lo registras y avisas por correo o Teams. Un flujo sin esto falla en silencio.</p>
<h3>2. Datos personales</h3>
<p>Si un flujo envía correos o mensajes, incluye lo mínimo: número de pedido, tienda, estado. No pongas DNI, teléfono ni dirección. Es el principio del capítulo 5.3.</p>
<h3>3. Propiedad</h3>
<p>Los flujos usan las <b>conexiones</b> de quien los creó. Si esa persona deja la empresa y su cuenta se desactiva, los flujos pueden dejar de funcionar; las fuentes de la comunidad recomiendan tener <b>co-propietarios</b>, una <b>cuenta de servicio</b> (con aprobación de TI) o flujos dentro de <b>soluciones</b>. Añadir un co-propietario ayuda a que otra persona pueda entrar y cambiar las conexiones, pero no hace que el flujo use sus credenciales automáticamente.</p>
<p>Y una regla de oro: <b>lo que construyes en una empresa pertenece a la empresa</b>. No copies flujos ni datos a tu cuenta personal.</p>
<h3>4. Límites y mantenimiento</h3>
<ul><li>Una ejecución dura como máximo 30 días y el historial de ejecuciones se conserva 30 días.</li><li>Nombres claros: «Incidencias - Forms a Lista - Alta», no «Flow 3 final v2».</li><li>Una <b>ficha del flujo</b>: objetivo, dueño, conexiones, fuentes de datos, fallos conocidos y cómo apagarlo.</li><li>Prueba con casos límite: campos vacíos, texto donde esperas número, un adjunto enorme.</li></ul>`,
example:`<p>El flujo de incidencias de tu compañero de «Retail Andino» (ficticio) usa su cuenta personal. Cuando cambia de área y su licencia se retira, las incidencias dejan de registrarse y nadie lo nota durante tres días. Con un Catch que avise y un co-propietario, se habría detectado el primer día.</p>`,
ex:{type:'match',intro:'Une cada problema con la práctica que lo previene.',opts:['Try/Catch con aviso','Co-propietario o cuenta de servicio','Minimizar datos personales','Nombre claro y ficha del flujo','Recordatorio y escalamiento','Pruebas con casos límite'],items:[
{t:'Si Forms falla, nadie se entera',a:'Try/Catch con aviso'},
{t:'El flujo corre con tu cuenta personal y te vas de la empresa',a:'Co-propietario o cuenta de servicio'},
{t:'El correo lleva DNI, teléfono y dirección de 200 clientes',a:'Minimizar datos personales'},
{t:'Nadie sabe qué hace «Flow 3 final v2»',a:'Nombre claro y ficha del flujo'},
{t:'Una aprobación queda esperando 45 días',a:'Recordatorio y escalamiento'},
{t:'Solo probaste con un caso perfecto y falla con un campo vacío',a:'Pruebas con casos límite'}],
sol:'<p>Bien. Si dudas sobre cuentas de servicio o solutions, esa decisión es de TI o del administrador de Power Platform, no tuya.</p>'},
quiz:[
{q:'En un flujo sin manejo de errores, cuando falla una acción…',o:['Continúa igual','Se detiene el resto de acciones dependientes','Se repara sola','Se borra'],a:1,w:'Por defecto, las acciones siguientes solo corren si la anterior tuvo éxito.'},
{q:'Añadir un co-propietario garantiza…',o:['Que el flujo use sus credenciales','Que otra persona pueda entrar y cambiar las conexiones si hace falta','Que nunca falle','Nada'],a:1,w:'No cambia las conexiones por sí solo.'},
{q:'¿Puedes copiar a tu cuenta personal un flujo hecho en tu empresa?',o:['Sí, es tuyo','No, pertenece a la empresa y manejas sus datos','Solo los viernes','Sí, si borras el nombre'],a:1,w:'Gobernanza y confidencialidad.'}],
src:[['https://learn.microsoft.com/en-us/power-automate/guidance/coding-guidelines/error-handling','Microsoft Learn: manejo de errores con Scopes (Try/Catch)'],['https://learn.microsoft.com/en-us/power-automate/limits-and-config','Microsoft Learn: límites de duración y retención'],['https://learn.microsoft.com/et-ee/training/modules/get-started-flows/8-flow-share-flows','Microsoft Learn: compartir flujos y conexiones'],['https://sharepains.com/2020/12/10/how-to-handle-leavers-in-power-automate/','SharePains: qué pasa con los flujos de quien se va (fuente secundaria)'],['https://powerusers.microsoft.com/t5/General-Power-Automate/What-happens-to-the-flow-if-flow-owner-leave-the-organisation/m-p/399563','Comunidad Power Users: propiedad y solutions (foro, sin garantía oficial)']],
ver:['Qué pasa exactamente con un flujo cuando se desactiva la cuenta de su dueño depende del tipo de flujo y de la configuración de tu organización: '+V('consultar al administrador'),'Los límites de la documentación pueden cambiar: '+V('límites vigentes')]},

{id:'11.6',title:'Tu flujo real: de 8 columnas a datos que se pueden analizar',min:20,
goal:'Revisar tu lista de incidencias tal como está, decidir qué mejorar (y qué no) y medir el ahorro con números.',
body:`<p>Tu lista actual tiene ocho columnas: <code>Titulo</code>, <code>NumeroPedido</code>, <code>Producto</code>, <code>TipoIncidencia</code>, <code>Descripcion</code>, <code>Severidad</code>, <code>ResponsablePicking</code> y <code>Estado</code>. Para una primera automatización de un curso es una base correcta: registra, deja evidencia y permite avisar. <b>No necesitas cambiar nada para aprender.</b> Lo que sigue son mejoras opcionales, ordenadas por lo que más rinde.</p>
<h3>Lo que ya puedes analizar con tus 8 columnas</h3>
<ul><li><b>Pareto por <code>TipoIncidencia</code>:</b> qué tipos concentran las incidencias.</li><li><b>Reincidencia por <code>Producto</code>:</b> qué productos se repiten.</li><li><b>Carga por <code>ResponsablePicking</code></b> y por <code>Estado</code>.</li><li><b>Incidencias por día</b>, si SharePoint guarda la fecha de creación de cada elemento (normalmente lo hace; compruébalo en tu lista).</li></ul>
<h3>El límite: texto libre</h3>
<p><code>TipoIncidencia</code>, <code>Severidad</code> y <code>Estado</code> son texto de una línea. Si alguien escribe «Alta», «alta» y «ALTA », para el análisis son tres valores distintos. La mejora de mayor impacto es convertir esas tres columnas en <b>columnas de elección (Choice)</b> con opciones fijas, y usar en el formulario una <b>lista desplegable</b> con exactamente las mismas opciones. La forma de cambiar el tipo de columna puede variar según tu versión ${V('probar primero en una copia de la lista')}.</p>
<h3>Mejoras que puedes dejar para después</h3>
<ul><li><code>ResponsablePicking</code> como columna de <b>Persona</b>, solo si los responsables son cuentas de tu organización; sirve para avisar directamente.</li><li>Una <b>fecha de cierre</b>, si quieres medir el tiempo de resolución (capítulo 10.1: media y percentil 90).</li><li>Una columna de <b>tienda</b>, solo si vas a analizar por tienda.</li></ul>
<p>No agregues columnas «por si acaso». Cada columna nueva es un dato que alguien tiene que llenar.</p>`,
example:`<p>Con las opciones fijas, en un tablero de Power BI verás una barra por cada tipo de incidencia, no diez variantes del mismo. Con tus datos de práctica ya puedes preparar tu Pareto (capítulo 2.4) y presentarlo en la entrevista, aclarando que son datos ficticios.</p>`,
ex:{type:'match',intro:'¿Qué tipo de columna elegirías para cada campo de tu lista?',opts:['Texto de una línea','Texto de varias líneas','Elección (Choice)','Persona (si son usuarios de tu organización)'],items:[

{id:'11.7',title:'Catálogo de ideas y ruta de práctica guiada',min:20,
goal:'Ver qué más se puede automatizar en operaciones, logística, reportes, atención y estudio, y practicar en un orden que funcione.',
body:`<p>Power Automate sirve para casi cualquier tarea repetitiva con reglas claras. El catálogo de abajo reúne ideas por <b>área</b> y por <b>nivel</b>. «Estándar» significa que la idea se apoya en conectores estándar según la documentación de Microsoft; «premium» o «verificar» indica que puede exigir licencia o permisos adicionales ${V('licencias y conectores permitidos en tu plan y en tu empresa')}.</p>
<h3>Ruta de práctica, en orden</h3>
${T(['Nivel','Qué practicas','Pasa al siguiente cuando…'],[
['1 Básico','Un disparador, una acción, un aviso. Avisos por correo, guardar adjuntos, recordatorios.','Sabes leer el historial de ejecuciones y encontrar por qué falló un flujo.'],
['2 Intermedio','Condiciones, listas y Excel Online, expresiones de fecha, un flujo programado.','Tus flujos usan Try/Catch y evitan enviar avisos vacíos.'],
['3 Avanzado','Aprobaciones, bucles, Power BI y varios sistemas en un mismo proceso.','Puedes explicar cómo medirías el ahorro y qué pasa si el flujo falla.'],
['4 Requiere permisos o licencias','SQL Server, IA o robots de escritorio.','Tienes autorización de TI y un caso de negocio claro.']])}
<h3>Cómo elegir una idea</h3>
<ul><li>Tarea que se repite <b>a menudo</b> y duele o se olvida.</li><li>Datos <b>estructurados</b> (formulario, lista, tabla).</li><li>Puedes <b>medir el antes</b> (minutos, errores).</li><li>No expone <b>datos personales</b> innecesarios.</li></ul>
<p>Empieza por una del nivel 1 o 2 en tu área, hazla funcionar con datos de prueba, añade el manejo de errores del capítulo 11.5 y anota su ficha. Luego pasa a la siguiente.</p>`,
example:`<p>Una progresión razonable con lo que ya hiciste: (1) aviso por correo con cada incidencia → (2) clasificación por severidad con Choice → (3) reporte diario con el conteo por tipo → (3) alerta desde Power BI cuando el número sube más de lo normal (capítulo 12.1).</p>`,

(function(){
var COURSE_NAME='E-commerce Operations, Supply Chain & Analytics';
var LS='ecom-curso-v1',S={done:{},quiz:{},theme:'',notes:{},ex:{},simulacros:[],srs:{}};
try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);for(var k in o)S[k]=o[k]}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
(function migrate(){
  var k,p;
  if(!S.ver||S.ver<2){
    var M={};for(var n=1;n<=6;n++)M['6.'+n]='10.'+n;for(n=1;n<=5;n++)M['7.'+n]='9.'+n;M['8.5']='11.1';M['8.6']='11.2';
    var nd={};for(k in S.done)nd[M[k]||k]=S.done[k];S.done=nd;
    var nq={};for(k in S.quiz){p=k.split('.');nq[(M[p[0]+'.'+p[1]]||(p[0]+'.'+p[1]))+'.'+p[2]]=S.quiz[k]}S.quiz=nq;
    var ck={'chk_6.6':'chk_10.6','chk_8.6':'chk_11.2'};for(k in ck){if(S[k]){S[ck[k]]=S[k];delete S[k]}}
    S.ver=2;
  }
  if(S.ver<3){
    function sh(id){var m=/^(\d+)\.(\d+)$/.exec(id);return m&&+m[1]>=6?(+m[1]+1)+'.'+m[2]:id}
    var d2={};for(k in S.done)d2[sh(k)]=S.done[k];S.done=d2;
    var q2={};for(k in S.quiz){p=k.split('.');q2[sh(p[0]+'.'+p[1])+'.'+p[2]]=S.quiz[k]}S.quiz=q2;
    var x2={};for(k in (S.ex||{}))x2[sh(k)]=S.ex[k];S.ex=x2;
    for(k in S.notes){}
    var ks=Object.keys(S);ks.forEach(function(kk){if(kk.indexOf('chk_')===0){var nid='chk_'+sh(kk.slice(4));if(nid!==kk){S[nid]=S[kk];delete S[kk]}}});
    if(S.last)S.last=sh(S.last);
    S.ver=3;
  }
  save();
})();
function $(s,e){return (e||document).querySelector(s)}
function $$(s,e){return Array.prototype.slice.call((e||document).querySelectorAll(s))}
function E(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
if(!S.ex)S.ex={};
if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);

MODS.sort(function(a,b){return mkey(a)-mkey(b)});

function updateProgress(){
  var d=ALL.filter(function(c){return S.done[c.id]}).length;
  $('#pfill').style.width=(100*d/ALL.length)+'%';
  $('#ptxt').textContent=d+' de '+ALL.length+' completados';
}
function updateBar(c){
  var p=$('#bprev'),n=$('#bnext');
  if(c){var i=ALL.indexOf(c),pv=ALL[i-1],nx=ALL[i+1];
    if(pv){p.hidden=false;p.href='#/'+pv.id}else p.hidden=true;
    if(nx){n.hidden=false;n.href='#/'+nx.id;n.textContent='Siguiente ›'}else n.hidden=true;
  }else{p.hidden=true;var f=ALL.filter(function(x){return !S.done[x.id]})[0]||ALL[0];n.hidden=false;n.href='#/'+f.id;n.textContent='Continuar ›'}
}
function route(){
  var id=(location.hash||'#/home').slice(2)||'home';cur=id;
  var c=ALL.filter(function(x){return x.id===id})[0];
  hideTip();
  if(simTimer){clearInterval(simTimer);simTimer=null}
  if(id==='glosario'){renderGlossary()}
  else if(id==='simulacro'){renderSimulacro()}
  else if(id==='repaso'){renderRepaso()}
  else if(id==='mapa'){renderMapa()}
  else if(id==='mis-datos'){renderMisDatos()}
  else if(id==='avance'){renderAvance()}
  else if(id==='certificado'){renderCertificado()}
  else if(c){renderChapter(c);S.last=c.id;save()}else{cur='home';renderHome()}
  renderNav();updateProgress();updateBar(c);window.scrollTo(0,0);setNav(false);
}

  function upd(){
    var fp=per[$('#fp',box).value],ft=$('#ft',box).value,fc=$('#fc2',box).value,fm=$('#fm',box).value;
    var rs=DATA.filter(function(r){return fp(r)&&(ft==='Todas'||r.tienda===ft)&&(fc==='Todas'||r.categoria===fc)&&(fm==='Todas'||r.modalidad===fm)});

    h+='<h3>Cancelaciones por motivo</h3>'+(mk.length?bars(mk.map(function(m){return [m,mot[m],mot[m]]}),true):'<p class="small">No hay cancelaciones con este filtro.</p>');

function linkTerms(root){
  if(!root||!GRE)return;
  var seen={};$$('.term',root).forEach(function(t){seen[t.getAttribute('data-g')]=1});
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null),nodes=[],n;
  while((n=w.nextNode()))nodes.push(n);
  nodes.forEach(function(tn){
    var txt=tn.nodeValue;if(!txt||txt.trim().length<2||skipNode(tn))return;
    var ms=[],m;GRE.lastIndex=0;
    while((m=GRE.exec(txt))){
      var s=m.index,e2=s+m[0].length,ent=GMAP[m[0].toLowerCase()];
      if(!ent)continue;
      if(ent.g.cs&&m[0]!==ent.orig)continue;
      if(s>0&&LET.test(txt[s-1]))continue;
      var after=e2<txt.length?txt[e2]:'';
      if(after&&LET.test(after)){if(!ent.g.ns&&after==='s'&&(e2+1>=txt.length||!LET.test(txt[e2+1])))e2=e2+1;else continue}
      if(seen[ent.g.k])continue;
      seen[ent.g.k]=1;ms.push([s,e2,ent.g.k]);GRE.lastIndex=e2;
    }
    if(!ms.length)return;
    var frag=document.createDocumentFragment(),pos=0;
    ms.forEach(function(x){
      if(x[0]>pos)frag.appendChild(document.createTextNode(txt.slice(pos,x[0])));
      var b=document.createElement('button');b.type='button';b.className='term';b.setAttribute('data-g',x[2]);b.textContent=txt.slice(x[0],x[1]);frag.appendChild(b);pos=x[1];
    });

    tn.parentNode.replaceChild(frag,tn);
  });
}

var SIMCAT={'1':'Mapa y operación','2':'Operación diaria y stock','3':'KPIs y reportes','4':'Catálogo y marketplace','5':'Cumplimiento y empleo','6':'Incidencias y gestión operativa','C':'Caso final','7':'Logística y almacén','8':'Planificación de inventario','9':'Datos y dashboards','10':'Estadística aplicada','11':'Power Automate','12':'Integración y proyecto final'};

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function quizPool(){
  var pool=[];
  ALL.forEach(function(c){if(!c.quiz)return;var cat=SIMCAT[c.mod.id]||c.mod.title;c.quiz.forEach(function(q,qi){pool.push({chId:c.id,qi:qi,cat:cat})})});

function pickSim(n){
  var byCat={};quizPool().forEach(function(it){(byCat[it.cat]=byCat[it.cat]||[]).push(it)});
  var cats=Object.keys(byCat);cats.forEach(function(c){byCat[c]=shuffle(byCat[c])});
  var idx={};cats.forEach(function(c){idx[c]=0});
  var total=cats.reduce(function(a,c){return a+byCat[c].length},0);
  n=Math.min(n,total);
  var picked=[];
  while(picked.length<n){
    var any=false;
    shuffle(cats).forEach(function(c){if(picked.length<n&&idx[c]<byCat[c].length){picked.push(byCat[c][idx[c]]);idx[c]++;any=true}});
    if(!any)break;
  }
  return shuffle(picked);
}

    +'<div class="ex">'+'<p>'+(i+1)+'. '+q.q+'</p>'+q.o.map(function(o,oi){return '<button class="opt'+(SIM.answers[i]===oi?' right':'')+'" data-o="'+oi+'">'+o+'</button>'}).join('')
    +'</div><div class="pager nolink"><button class="btn pn" id="simprev"'+(i===0?' disabled':'')+'>Anterior</button><span class="grow"></span><button class="btn '+(i===n-1?'pri':'')+'" id="simnext">'+(i===n-1?'Finalizar y ver resultado':'Siguiente ›')+'</button></div>'
    +'<p class="rst"><button class="btn sm" id="simquit">Salir sin guardar</button></p></article></div>';
  $$('[data-o]',main).forEach(function(b){b.onclick=function(){SIM.answers[i]=+b.getAttribute('data-o');renderSimRunning()}});
  $('#simprev').onclick=function(){if(SIM.i>0){SIM.i--;renderSimRunning()}};
  $('#simnext').onclick=function(){if(i===n-1)finishSim();else{SIM.i++;renderSimRunning()}};
  $('#simquit').onclick=function(){if(confirm('¿Salir del simulacro sin guardar el resultado?')){SIM=null;renderSimulacro()}};
  var myTimer=setInterval(function(){

    else cl.textContent='Tiempo: '+clock(e);
  },1000);

function finishSim(){
  if(simTimer){clearInterval(simTimer);simTimer=null}
  var durSec=Math.floor((Date.now()-SIM.started)/1000);
  var items=SIM.items.map(function(it,i){
    var info=qOf(it),ok=!!(info&&SIM.answers[i]===info.q.a);

  });
  var ok=items.filter(function(x){return x.ok}).length;
  var att={id:'sim_'+Date.now(),fecha:Date.now(),n:items.length,ok:ok,durSec:durSec,items:items};
  S.simulacros.push(att);
  if(S.simulacros.length>20)S.simulacros=S.simulacros.slice(-20);

  renderSimulacro();
}
